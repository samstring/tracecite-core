name: Search Cost V2 CProfile

on:
  push:
    branches:
      - experiment/evidence-intelligence-search-cost-v2
    paths:
      - .github/workflows/search-cost-v2-cprofile.yml

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install --quiet huggingface_hub pandas pyarrow
      - name: Prepare 76MB source
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          from huggingface_hub import snapshot_download
          case='re3tt_ts-route-service_f3_6'
          root=Path('/tmp/rcaeval-source')
          out=Path('/tmp/rcaeval-profile')
          out.mkdir(parents=True, exist_ok=True)
          snapshot_download(repo_id='phamquiluan/RCAEval', repo_type='dataset', allow_patterns=[f'{case}/traces.parquet'], local_dir=root)
          pd.read_parquet(root/case/'traces.parquet').to_json(out/'traces.jsonl', orient='records', lines=True, force_ascii=False)
          PY
      - name: Profile high-match TraceCite search
        run: |
          python - <<'PY'
          import cProfile, io, pstats
          from pathlib import Path
          from tracecite.runtime import tools
          source=Path('/tmp/rcaeval-profile/traces.jsonl')
          profiler=cProfile.Profile()
          profiler.enable()
          result=tools.search(source, 'ts-route-service', snapshot=False, segmenter='jsonline', max_evidence=20, investigation_path=None, cache=False)
          profiler.disable()
          print('matches=', result['coverage']['match_records'])
          stream=io.StringIO()
          pstats.Stats(profiler, stream=stream).strip_dirs().sort_stats('cumtime').print_stats(50)
          print(stream.getvalue())
          PY
