name: Pi TraceCite 139417 Capability

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/evidence-intelligence
    paths:
      - .github/workflows/pi-tracecite-139417-capability.yml
      - benchmarks/agent-investigation/pi_tracecite_extension.ts
      - benchmarks/agent-investigation/pi_tracecite_bridge.py
      - src/tracecite/runtime/session_retrieval.py
      - src/tracecite/runtime/retrieval_session.py
      - tests/test_session_novelty_regressions.py

permissions:
  contents: read

jobs:
  tracecite-capability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.TRACECITE_BENCH_BASE_URL || 'https://api.gmi-serving.com/v1' }}
      BENCH_MODEL: ${{ vars.TRACECITE_BENCH_MODEL }}
      PI_CODING_AGENT_DIR: /tmp/pi-agent-config
      PI_SKIP_VERSION_CHECK: "1"
      PI_TELEMETRY: "0"
      CASE_ID: kubernetes-139417
      CASE_DIR: benchmarks/agent-investigation/scale-cases/kubernetes-139417
      RESULT: /tmp/pi-tracecite-139417-capability
      PREP: /tmp/pi-tracecite-139417-capability/prepared
      ELIGIBLE_DIMENSIONS: failure_localization,immediate_failure_mechanism

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Pi, TraceCite, and ripgrep
        shell: bash
        run: |
          set -euo pipefail
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.84.4
          python -m pip install -e ".[dev]"
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ripgrep
          fi
          pi --version

      - name: Configure GMI model for Pi
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PI_CODING_AGENT_DIR"
          python - <<'PY'
          import json, os
          from pathlib import Path
          model = os.environ['BENCH_MODEL']
          if not model:
              raise SystemExit('BENCH_MODEL is empty')
          target = Path(os.environ['PI_CODING_AGENT_DIR']) / 'models.json'
          payload = {'providers': {'gmi': {
              'name': 'GMI OpenAI-compatible',
              'baseUrl': os.environ['OPENAI_BASE_URL'],
              'api': 'openai-completions',
              'models': [{
                  'id': model, 'name': model, 'reasoning': False, 'input': ['text'],
                  'cost': {'input': 0, 'output': 0, 'cacheRead': 0, 'cacheWrite': 0},
                  'contextWindow': 1_000_000, 'maxTokens': 4_096,
                  'compat': {'supportsDeveloperRole': False, 'supportsReasoningEffort': False},
              }],
          }}}
          target.write_text(json.dumps(payload, indent=2) + '\n')
          PY

      - name: Run novelty regressions first
        run: python -m pytest -q tests/test_session_novelty_regressions.py tests/test_pi_ab_benchmark_policy.py

      - name: Prepare 139417
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RESULT"
          mkdir -p "$RESULT" "$PREP"
          python -m tracecite.root_cause_benchmarking validate "$CASE_DIR" > "$RESULT/validate.json"
          python -m tracecite.root_cause_benchmarking prepare "$CASE_DIR" --work-dir "$PREP" > "$RESULT/prepare.json"
          PREPARED="$(find "$PREP" -name prepared.json -type f -print -quit)"
          test -n "$PREPARED"
          python - "$PREPARED" >> "$GITHUB_ENV" <<'PY'
          import json, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          inputs = data.get('inputs') or []
          if len(inputs) != 1:
              raise SystemExit(f'expected one input, got {len(inputs)}')
          f = Path(inputs[0]['path']).resolve()
          print(f'INPUT_ROOT={f.parent}')
          print(f'INPUT_FILE={f.name}')
          print(f'QUESTION_FILE={Path(data["question"]).resolve()}')
          PY

      - name: Run Pi with TraceCite capability flow
        shell: bash
        run: |
          set -euo pipefail
          QUESTION="$(cat "$QUESTION_FILE")"
          SYSTEM_PROMPT='You are a real coding agent investigating supplied runtime evidence. Use only evidence from files in the current working directory; do not use external knowledge. This is a TraceCite capability run, so exercise tracecite_search and tracecite_expand at least once in a meaningful way; otherwise you own hypotheses, causal reasoning, tool choice, investigation order, and the final conclusion. Native tools remain available. TraceCite provides evidence, provenance, bounded context, and session-scoped novelty facts only; it does not decide root cause or when you should stop. Repeated evidence may be suppressed; if you truly need old exact context again, you may explicitly replay it. Do not replay merely to satisfy the test. Keep exploration bounded. Every material factual claim must cite exact line numbers you actually observed. Distinguish direct observation from inference and explicitly say when the supplied evidence is insufficient for a deeper claim.'
          mkdir -p "$RESULT/pi-tracecite-session"
          cd "$INPUT_ROOT"
          set +e
          timeout 900s pi \
            --provider gmi --model "$BENCH_MODEL" --api-key "$OPENAI_API_KEY" \
            --thinking off --mode text --print \
            --session-dir "$RESULT/pi-tracecite-session" \
            --extension "$GITHUB_WORKSPACE/benchmarks/agent-investigation/pi_tracecite_extension.ts" \
            --tools read,bash,grep,find,ls,tracecite_search,tracecite_expand \
            --no-skills --no-prompt-templates --no-context-files \
            --system-prompt "$SYSTEM_PROMPT" "$QUESTION" \
            > "$RESULT/pi-tracecite-answer.md" 2> "$RESULT/pi-tracecite-stderr.log"
          code=$?
          set -e
          echo "$code" > "$RESULT/pi-tracecite-exit.txt"

      - name: Convert, score, and compare with old TraceCite run
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          SESSION="$(find "$RESULT/pi-tracecite-session" -type f -name '*.jsonl' -print -quit 2>/dev/null || true)"
          ANSWER="$RESULT/pi-tracecite-answer.md"
          if [[ -n "$SESSION" && -f "$ANSWER" ]]; then
            python benchmarks/agent-investigation/pi_session_to_transcript.py \
              "$SESSION" "$ANSWER" "$RESULT/pi-tracecite-transcript.jsonl" \
              --mode pi-tracecite --model "$BENCH_MODEL"
            python -m tracecite.root_cause_benchmarking score \
              "$CASE_DIR" "$RESULT/pi-tracecite-transcript.jsonl" \
              > "$RESULT/pi-tracecite-score.json" || true
          fi

          python - <<'PY'
          import json, os, sys
          from collections import Counter
          from pathlib import Path

          sys.path.insert(0, str(Path('benchmarks/agent-investigation').resolve()))
          from pi_ab_runtime import classify_arm_validity

          root = Path(os.environ['RESULT'])
          transcript = root / 'pi-tracecite-transcript.jsonl'
          score_path = root / 'pi-tracecite-score.json'
          exit_path = root / 'pi-tracecite-exit.txt'
          stderr_path = root / 'pi-tracecite-stderr.log'
          score = json.loads(score_path.read_text()) if score_path.is_file() else {}
          quality = score.get('quality') or {}
          cost = score.get('context_cost') or {}
          eligible = [x for x in os.environ['ELIGIBLE_DIMENSIONS'].split(',') if x]
          tools = Counter()
          replay_calls = 0
          if transcript.is_file():
              for line in transcript.read_text().splitlines():
                  if not line.strip():
                      continue
                  event = json.loads(line)
                  if event.get('type') != 'tool':
                      continue
                  name = str(event.get('name') or 'unknown')
                  tools[name] += 1
                  if name == 'tracecite_expand':
                      args = event.get('arguments') or event.get('args') or {}
                      if isinstance(args, dict) and args.get('replay') is True:
                          replay_calls += 1
          exit_code = int(exit_path.read_text().strip()) if exit_path.is_file() else None
          stderr = stderr_path.read_text(errors='replace') if stderr_path.is_file() else ''
          validity = classify_arm_validity(exit_code, stderr)
          dims = {d['id']: bool(d.get('hit')) for d in quality.get('dimensions') or []}
          support = {d['id']: bool(d.get('supported')) for d in quality.get('dimension_evidence_support') or []}
          current = {
              'valid_for_comparison': validity.valid_for_comparison,
              'infrastructure_invalid': validity.infrastructure_invalid,
              'failure_kind': validity.failure_kind,
              'raw_passed': score.get('passed') if validity.valid_for_comparison else None,
              'eligible_dimension_recall': sum(dims.get(d, False) for d in eligible) / len(eligible) if eligible else None,
              'eligible_supported_dimension_recall': sum(support.get(d, False) for d in eligible) / len(eligible) if eligible else None,
              'citation_accuracy': (quality.get('citation') or {}).get('accuracy'),
              'model_calls': cost.get('model_calls'),
              'tool_calls': cost.get('tool_calls'),
              'reported_input_tokens': cost.get('reported_input_tokens'),
              'reported_cache_read_input_tokens': cost.get('reported_cache_read_input_tokens'),
              'reported_output_tokens': cost.get('reported_output_tokens'),
              'tool_output_chars': cost.get('tool_output_chars'),
              'tool_names': dict(sorted(tools.items())),
              'tracecite_replay_calls': replay_calls,
          }
          old = {
              'raw_passed': False,
              'eligible_dimension_recall': 1.0,
              'eligible_supported_dimension_recall': 1.0,
              'citation_accuracy': 0.4694,
              'model_calls': 159,
              'tool_calls': 111,
              'reported_input_tokens': 124237,
              'reported_cache_read_input_tokens': 6139097,
              'reported_output_tokens': 14552,
              'tool_output_chars': 351968,
              'tracecite_search_calls': 29,
              'tracecite_expand_calls': 22,
          }

          def reduction(key):
              before = old.get(key)
              after = current.get(key)
              if not isinstance(before, (int, float)) or not isinstance(after, (int, float)) or before == 0:
                  return None
              return (before - after) / before

          transport_reduction = reduction('tool_output_chars')
          model_call_reduction = reduction('model_calls')
          cache_reduction = reduction('reported_cache_read_input_tokens')
          preserved_correctness = (
              current['eligible_dimension_recall'] == 1.0 and
              current['eligible_supported_dimension_recall'] == 1.0
          )
          meaningful_optimization = bool(
              validity.valid_for_comparison and
              preserved_correctness and
              transport_reduction is not None and transport_reduction >= 0.20
          )
          report = {
              'schema_version': 1,
              'case_id': os.environ['CASE_ID'],
              'purpose': 'tracecite_capability_before_formal_ab',
              'old_tracecite': old,
              'current_tracecite': current,
              'reductions': {
                  'tool_output_chars': transport_reduction,
                  'model_calls': model_call_reduction,
                  'cache_read_input_tokens': cache_reduction,
              },
              'preserved_correctness': preserved_correctness,
              'meaningful_optimization': meaningful_optimization,
              'formal_ab_recommended': meaningful_optimization,
          }
          (root / 'optimization.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          print(json.dumps(report, indent=2, sort_keys=True))

          if validity.infrastructure_invalid:
              raise SystemExit('Capability run infrastructure-invalid: ' + validity.failure_kind)
          if tools.get('tracecite_search', 0) < 1 or tools.get('tracecite_expand', 0) < 1:
              raise SystemExit('Capability run did not exercise both TraceCite tools')
          PY

      - name: Upload focused capability artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracecite-capability-kubernetes-139417
          path: /tmp/pi-tracecite-139417-capability
          if-no-files-found: warn
