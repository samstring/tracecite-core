name: Search Cost V2 Agent Cost Discipline

on:
  push:
    branches:
      - experiment/evidence-intelligence-search-cost-v2
    paths:
      - .github/workflows/search-cost-v2-agent-cost-discipline.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: experiment/evidence-intelligence-search-cost-v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add cost-aware evidence discipline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.pi/skills/tracecite/SKILL.md')
          text = p.read_text(encoding='utf-8')
          marker = '## `tracecite_retrieve`\n'
          section = '''## Cost-aware default investigation loop\n\nLarge evidence sources make repeated semantically broad retrieval expensive for the Agent even when each TraceCite operation is mechanically fast. Keep the Agent in control, but default to a bounded evidence loop:\n\n1. Inspect the source shape once; do not rediscover filenames or schemas with synonym searches.\n2. Use one broad retrieval to identify a concrete error signature, service, trace ID, request ID, or other correlation key.\n3. Once a concrete correlation key is available, pivot to that key and materialize only the bounded spans/ranges needed to establish the causal chain.\n4. Prefer correlation-local evidence over unrelated confirmatory sampling. In particular, do not sample arbitrary metric rows after a trace/log chain already resolves the active causal question unless the metric evidence answers a specific unresolved contradiction.\n5. `no_match` and `no_new_evidence` should usually end that exact search direction; do not retry a list of synonyms unless the next query targets a materially different evidence class.\n6. After a Host convergence checkpoint, do not continue merely to increase confidence. Continue only for a concrete unresolved question whose answer could change the conclusion or evidence boundary.\n7. As a default cost target, aim to finish a straightforward single-incident RCA within roughly a dozen evidence operations. This is not a hard stop: exceed it only when the unresolved question and expected new evidence are explicit and materially different.\n\nThe budget is an Agent cost discipline, not a Runtime planner or causal stopping decision. TraceCite still does not choose the next query, root cause, or final answer.\n\n'''
          if '## Cost-aware default investigation loop' in text:
              raise SystemExit('cost discipline already present')
          if marker not in text:
              raise SystemExit('insert marker missing')
          p.write_text(text.replace(marker, section + marker, 1), encoding='utf-8')
          PY
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_pi_tracecite_bridge.py tests/test_pi_tracecite_formal_flow.py tests/test_runtime_session_retrieval.py tests/test_session_novelty_regressions.py
      - name: Commit cost discipline
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/search-cost-v2-agent-cost-discipline.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .pi/skills/tracecite/SKILL.md
          git commit -m 'tighten Agent evidence cost discipline'
          git push origin HEAD:experiment/evidence-intelligence-search-cost-v2
