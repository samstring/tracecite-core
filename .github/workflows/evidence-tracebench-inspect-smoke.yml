name: TraceBench Inspect Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-first-three:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TraceCite
        run: python -m pip install -e .
      - name: Restore TraceBench archive cache
        id: cache
        uses: actions/cache@v4
        with:
          path: /tmp/tracebench-cache/HDFS_v3_TraceBench.zip
          key: tracebench-hdfs-v3-c69999ff28933d2b163170d26c2faf64
      - name: Download pinned archive on cache miss
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tracebench-cache
          curl -L --retry 5 --retry-delay 2 \
            -o /tmp/tracebench-cache/HDFS_v3_TraceBench.zip \
            'https://zenodo.org/records/8196385/files/HDFS_v3_TraceBench.zip?download=1'
      - name: Verify archive
        shell: bash
        run: |
          set -euo pipefail
          echo 'c69999ff28933d2b163170d26c2faf64  /tmp/tracebench-cache/HDFS_v3_TraceBench.zip' | md5sum -c -
      - name: Build deterministic first three tiers
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/tb-inspect
          mkdir -p /tmp/tb-inspect/extracted /tmp/tb-inspect/tiers
          cd /tmp/tb-inspect/extracted
          unzip -q /tmp/tracebench-cache/HDFS_v3_TraceBench.zip \
            'tracebench/AN_Data_corruptBlk_r_30FDN_30C_1to19B_0to120INT_15RT_5WT/event.csv' \
            'tracebench/NM_*/event.csv'
          cd "$GITHUB_WORKSPACE"
          python - <<'PY'
          from __future__ import annotations
          import csv, hashlib
          from pathlib import Path

          root = Path('/tmp/tb-inspect/extracted/tracebench')
          fault = root / 'AN_Data_corruptBlk_r_30FDN_30C_1to19B_0to120INT_15RT_5WT' / 'event.csv'
          target_task = 'EC78D31AEC1E64FD'
          out_root = Path('/tmp/tb-inspect/tiers')

          with fault.open(encoding='utf-8', errors='replace', newline='') as fh:
              reader = csv.reader(fh)
              header = next(reader)
              target_rows = [row for row in reader if row and row[0] == target_task]
          assert len(target_rows) == 143

          normal_files = sorted(root.glob('NM_*/event.csv'))
          assert normal_files

          def normal_rows():
              for source in normal_files:
                  with source.open(encoding='utf-8', errors='replace', newline='') as fh:
                      reader = csv.reader(fh)
                      assert next(reader, None) == header
                      yield from reader

          target = out_root / 'target-only.csv'
          with target.open('w', encoding='utf-8', newline='') as out:
              writer = csv.writer(out)
              writer.writerow(header)
              writer.writerows(target_rows)
          assert target.stat().st_size == 25600

          for size in (500_000, 5_000_000):
              path = out_root / f'{size}.csv'
              before_budget = (size - target.stat().st_size) // 2
              inserted = False
              with path.open('w', encoding='utf-8', newline='') as out:
                  writer = csv.writer(out)
                  writer.writerow(header)
                  for row in normal_rows():
                      if not inserted and out.tell() >= before_budget:
                          writer.writerows(target_rows)
                          inserted = True
                      writer.writerow(row)
                      if inserted and out.tell() >= size:
                          break
                  if not inserted:
                      writer.writerows(target_rows)

          expected = {
              'target-only.csv': (25600, '8a99726a33e3d1d651c13a481df34574990c838cf0388f25eb6809d5bb303a43'),
              '500000.csv': (500162, 'df1861fe7d0cf1f1a779770b192a27164c0c38141a63f6b67a3a4fdab04eba3a'),
              '5000000.csv': (5000105, '6f15b49df8981bacf9743ac8e2480e3fc4b98063196b3653c45591d5aae75804'),
          }
          for name, (size, digest) in expected.items():
              path = out_root / name
              assert path.stat().st_size == size
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest
          PY
      - name: Validate bounded inspect and line recovery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tb-inspect/outputs
          python - <<'PY'
          from __future__ import annotations
          import importlib.util
          import re
          import sys
          from pathlib import Path

          bench = Path('benchmarks/agent-investigation').resolve()
          sys.path.insert(0, str(bench))
          spec = importlib.util.spec_from_file_location('tracebench_scale_host_smoke', bench / 'gmi_scale_host.py')
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          root = Path('/tmp/tb-inspect/tiers')
          outputs = Path('/tmp/tb-inspect/outputs')
          required = ('EC78D31AEC1E64FD', 'ChecksumException', 'reportBadBlocks')
          for name in ('target-only.csv', '500000.csv', '5000000.csv'):
              scratch = outputs / (name + '.scratch')
              scratch.mkdir()
              runtime = module.ScaleRuntime(
                  mode='tracecite', input_root=root, scratch=scratch, context_id=''
              )
              result = runtime._tracecite_inspect({'file': name})
              (outputs / f'{name}.inspect.txt').write_text(result, encoding='utf-8')
              for marker in required:
                  if marker not in result:
                      raise SystemExit(f'{name}: inspect missing required benchmark truth marker {marker}')
              if len(result) > module._MAX_INSPECT_CHARS + 512:
                  raise SystemExit(f'{name}: inspect exceeded bounded output: {len(result)}')
              match = re.search(r'#L(\d+)\t[^\n]*ChecksumException', result)
              if match is None:
                  raise SystemExit(f'{name}: no line-addressable ChecksumException in inspect')
              line = int(match.group(1))
              recovered = runtime._tracecite_get({'file': name, 'line': line, 'radius': 4})
              (outputs / f'{name}.get.txt').write_text(recovered, encoding='utf-8')
              if 'ChecksumException' not in recovered or 'reportBadBlocks' not in recovered:
                  raise SystemExit(f'{name}: get window did not recover failure sequence')
              print(name, 'inspect_chars=', len(result), 'signal_line=', line)
          PY
      - name: Upload inspect outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracebench-inspect-smoke
          path: /tmp/tb-inspect/outputs
          if-no-files-found: error
