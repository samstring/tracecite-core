name: Finalize Host Observation and Evaluation

on:
  push:
    branches: [experiment/evidence-intelligence]
    paths: [.github/workflows/host-eval-finalize.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/evidence-intelligence
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply one-shot refactor
        run: python scripts/_host_eval_finalize.py

      - name: Verify focused gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          pytest -q \
            tests/test_canonical_evidence_contract.py \
            tests/test_runtime_session_retrieval.py \
            tests/test_session_novelty_regressions.py \
            tests/test_evidence_routing.py \
            tests/test_evidence_selection.py \
            tests/test_root_cause_benchmarking.py \
            tests/test_support_aware_root_cause_benchmarking.py \
            tests/test_pi_session_to_transcript.py \
            tests/test_pi_host_tool_activity.py
          python scripts/check_architecture.py
          python benchmarks/agent-investigation/support_level_score.py --self-test
          python -m compileall -q src/tracecite

      - name: Commit verified implementation and clean one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tracecite-refactor-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/tracecite/support_scoring.py \
            src/tracecite/root_cause_benchmarking.py \
            benchmarks/agent-investigation/support_level_score.py \
            benchmarks/agent-investigation/pi_tracecite_extension.ts \
            benchmarks/agent-investigation/pi_session_to_transcript.py \
            tests/test_support_aware_root_cause_benchmarking.py \
            tests/test_pi_host_tool_activity.py
          git commit -m 'integration: observe full Pi tool activity and formalize support scoring'
          git rm scripts/_host_eval_finalize.py .github/workflows/host-eval-finalize.yml
          git commit -m 'chore: remove host/eval one-shot files'
          git push origin HEAD:experiment/evidence-intelligence
