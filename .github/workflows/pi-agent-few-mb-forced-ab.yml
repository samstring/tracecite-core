name: Pi Agent Few-MB Forced TraceCite A/B

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/evidence-intelligence
    paths:
      - .github/workflows/pi-agent-few-mb-forced-ab.yml

permissions:
  contents: read

concurrency:
  group: pi-agent-few-mb-forced-ab
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - case_id: kubernetes-140039-runc-5347-2mb
            kind: repo-root-cause
          - case_id: tracebench-hdfs-corrupt-block-5mb
            kind: tracebench-5mb
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.TRACECITE_BENCH_BASE_URL || 'https://api.gmi-serving.com/v1' }}
      BENCH_MODEL: ${{ vars.TRACECITE_BENCH_MODEL }}
      PI_CODING_AGENT_DIR: /tmp/pi-agent-config
      PI_SKIP_VERSION_CHECK: "1"
      PI_TELEMETRY: "0"
      CASE_ID: ${{ matrix.case_id }}
      KIND: ${{ matrix.kind }}
      RESULT: /tmp/pi-few-mb-${{ matrix.case_id }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Pi and TraceCite
        shell: bash
        run: |
          set -euo pipefail
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.84.4
          python -m pip install -e ".[dev]"
          test -f "$GITHUB_WORKSPACE/.pi/skills/tracecite/SKILL.md"
          pi --help | grep -q -- '--skill'

      - name: Run targeted retrieval tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_retrieval_guidance.py tests/test_session_novelty_regressions.py

      - name: Configure GMI model for Pi
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY"
          test -n "$BENCH_MODEL"
          mkdir -p "$PI_CODING_AGENT_DIR"
          python - <<'PY'
          import json, os
          from pathlib import Path
          model = os.environ['BENCH_MODEL']
          payload = {'providers': {'gmi': {
              'name': 'GMI OpenAI-compatible',
              'baseUrl': os.environ['OPENAI_BASE_URL'],
              'api': 'openai-completions',
              'models': [{
                  'id': model, 'name': model, 'reasoning': False, 'input': ['text'],
                  'cost': {'input': 0, 'output': 0, 'cacheRead': 0, 'cacheWrite': 0},
                  'contextWindow': 1_000_000, 'maxTokens': 4_096,
                  'compat': {'supportsDeveloperRole': False, 'supportsReasoningEffort': False},
              }],
          }}}
          (Path(os.environ['PI_CODING_AGENT_DIR']) / 'models.json').write_text(json.dumps(payload, indent=2) + '\n')
          PY

      - name: Prepare Kubernetes 140039 2.29MB case
        if: matrix.kind == 'repo-root-cause'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RESULT"
          mkdir -p "$RESULT/prepared"
          CASE_DIR="$GITHUB_WORKSPACE/benchmarks/agent-investigation/scale-cases/kubernetes-140039-runc-5347"
          python -m tracecite.root_cause_benchmarking validate "$CASE_DIR" > "$RESULT/validate.json"
          python -m tracecite.root_cause_benchmarking prepare "$CASE_DIR" --work-dir "$RESULT/prepared" > "$RESULT/prepare.json"
          PREPARED="$(find "$RESULT/prepared" -name prepared.json -type f -print -quit)"
          python - "$PREPARED" "$CASE_DIR" >> "$GITHUB_ENV" <<'PY'
          import json, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          f = Path(data['inputs'][0]['path']).resolve()
          print(f'CASE_DIR_RUN={Path(sys.argv[2]).resolve()}')
          print('SCORER=root_cause')
          print(f'INPUT_ROOT={f.parent}')
          print(f'INPUT_BYTES={f.stat().st_size}')
          print(f'QUESTION_FILE={Path(data["question"]).resolve()}')
          PY

      - name: Download pinned TraceBench archive
        if: matrix.kind == 'tracebench-5mb'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tracebench-cache
          curl -L --retry 5 --retry-delay 2 \
            -o /tmp/tracebench-cache/HDFS_v3_TraceBench.zip \
            'https://zenodo.org/records/8196385/files/HDFS_v3_TraceBench.zip?download=1'
          echo 'c69999ff28933d2b163170d26c2faf64  /tmp/tracebench-cache/HDFS_v3_TraceBench.zip' | md5sum -c -

      - name: Build deterministic TraceBench 5MB case
        if: matrix.kind == 'tracebench-5mb'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RESULT" /tmp/tb-few-mb
          mkdir -p "$RESULT" /tmp/tb-few-mb/extracted /tmp/tb-few-mb/input /tmp/tb-few-mb/case
          cd /tmp/tb-few-mb/extracted
          unzip -q /tmp/tracebench-cache/HDFS_v3_TraceBench.zip \
            'tracebench/AN_Data_corruptBlk_r_30FDN_30C_1to19B_0to120INT_15RT_5WT/event.csv' \
            'tracebench/NM_*/event.csv'
          cd "$GITHUB_WORKSPACE"
          python - <<'PY'
          from __future__ import annotations
          import csv, hashlib, json
          from pathlib import Path

          root = Path('/tmp/tb-few-mb/extracted/tracebench')
          fault = root / 'AN_Data_corruptBlk_r_30FDN_30C_1to19B_0to120INT_15RT_5WT' / 'event.csv'
          target_task = 'EC78D31AEC1E64FD'
          out = Path('/tmp/tb-few-mb/input/runtime.csv')
          case = Path('/tmp/tb-few-mb/case')

          with fault.open(encoding='utf-8', errors='replace', newline='') as fh:
              reader = csv.reader(fh)
              header = next(reader)
              target_rows = [row for row in reader if row and row[0] == target_task]
          assert len(target_rows) == 143
          normal_files = sorted(p for p in root.glob('NM_*/event.csv') if p.is_file())
          assert normal_files

          def normal_rows():
              for source in normal_files:
                  with source.open(encoding='utf-8', errors='replace', newline='') as fh:
                      reader = csv.reader(fh)
                      assert next(reader, None) == header
                      yield from reader

          target_size = 5_000_000
          target_bytes = sum(len(','.join(row).encode('utf-8')) + 1 for row in target_rows)
          before_budget = max(0, (target_size - target_bytes) // 2)
          inserted = False
          with out.open('w', encoding='utf-8', newline='') as fh:
              writer = csv.writer(fh)
              writer.writerow(header)
              for row in normal_rows():
                  if not inserted and fh.tell() >= before_budget:
                      writer.writerows(target_rows)
                      inserted = True
                  writer.writerow(row)
                  if inserted and fh.tell() >= target_size:
                      break
              if not inserted:
                  writer.writerows(target_rows)

          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          assert 4_900_000 <= out.stat().st_size <= 5_100_000
          text = out.read_text(encoding='utf-8', errors='replace')
          assert text.count(target_task) == 143
          assert text.lower().count('checksumexception') >= 4
          assert text.lower().count('reportbadblocks') >= 8

          (case / 'question.md').write_text(
              'Using only the supplied HDFS runtime evidence, investigate the failed copy-to-local activity. '
              'Identify the affected task/trace, reconstruct the relevant failure sequence, state the immediate '
              'failure mechanism, and identify the most likely underlying data-integrity problem. Distinguish '
              'direct observation from inference and cite precise runtime.csv line locations. Do not assume any '
              'injected-fault label or outside knowledge.\n', encoding='utf-8')
          gold = {
              'required_concepts': [
                  {'id':'target-task','patterns':['EC78D31AEC1E64FD']},
                  {'id':'copy-operation','patterns':['copyToLocal|copy[- ]?to[- ]?local']},
                  {'id':'checksum-mechanism','patterns':['ChecksumException|checksum.{0,30}(?:error|mismatch|fail)']},
                  {'id':'bad-block-sequence','patterns':['reportBadBlocks|bad block|block.{0,30}(?:bad|unavailable|corrupt)']},
                  {'id':'data-integrity-cause','patterns':['(?:data|block).{0,40}corrupt|corrupt(?:ed|ion).{0,40}(?:data|block)|block data.{0,40}(?:modified|damaged|corrupt)']},
                  {'id':'source-citation','patterns':['runtime\\.csv:\\d+|#?L\\d+|(?:line|lines)\\s+\\d+']},
              ],
              'evidence_markers':['EC78D31AEC1E64FD','ChecksumException','reportBadBlocks'],
              'thresholds':{'concept_recall':1.0,'evidence_marker_recall':1.0},
              'leak_terms':['AN_Data_corruptBlk','data blocks modified on some DataNodes'],
          }
          (case / 'gold.json').write_text(json.dumps(gold, indent=2) + '\n', encoding='utf-8')
          case_json = {
              'schema_version':1,
              'id':'tracebench-hdfs-corrupt-block-5mb',
              'question_file':'question.md',
              'gold_file':'gold.json',
              'inputs':[{'id':'tracebench-5mb','url':'derived://tracebench/HDFS_v3/runtime.csv','filename':'runtime.csv','sha256':digest}],
          }
          (case / 'case.json').write_text(json.dumps(case_json, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'bytes':out.stat().st_size,'sha256':digest,'target_rows':143}, indent=2))
          PY
          python -m tracecite.benchmarking validate /tmp/tb-few-mb/case > "$RESULT/validate.json"
          {
            echo 'CASE_DIR_RUN=/tmp/tb-few-mb/case'
            echo 'SCORER=legacy'
            echo 'INPUT_ROOT=/tmp/tb-few-mb/input'
            echo "INPUT_BYTES=$(stat -c '%s' /tmp/tb-few-mb/input/runtime.csv)"
            echo 'QUESTION_FILE=/tmp/tb-few-mb/case/question.md'
          } >> "$GITHUB_ENV"

      - name: Run Pi native A arm
        shell: bash
        run: |
          set -euo pipefail
          QUESTION="$(cat "$QUESTION_FILE")"
          SYSTEM_PROMPT='You are a real coding agent investigating supplied runtime evidence. Use only evidence from files in the current working directory; do not use external knowledge. You own hypotheses, causal reasoning, tool choice, investigation order, conclusions, and when to stop. Keep exploration bounded. Every material factual claim must cite exact line numbers you actually observed. Distinguish direct observation from inference and state when supplied evidence is insufficient.'
          mkdir -p "$RESULT/pi-native-session"
          cd "$INPUT_ROOT"
          set +e
          timeout -k 30s 600s pi \
            --provider gmi --model "$BENCH_MODEL" --api-key "$OPENAI_API_KEY" \
            --thinking off --mode text --print \
            --session-dir "$RESULT/pi-native-session" \
            --tools read,bash,grep,find,ls \
            --no-extensions --no-skills --no-prompt-templates --no-context-files \
            --system-prompt "$SYSTEM_PROMPT" "$QUESTION" \
            > "$RESULT/pi-native-answer.md" 2> "$RESULT/pi-native-stderr.log"
          code=$?
          set -e
          echo "$code" > "$RESULT/pi-native-exit.txt"

      - name: Cool down provider between arms
        shell: bash
        run: sleep 60

      - name: Run Pi forced TraceCite B arm with skill
        shell: bash
        run: |
          set -euo pipefail
          QUESTION="$(cat "$QUESTION_FILE")"
          SYSTEM_PROMPT='You are a real coding agent investigating supplied runtime evidence. Use only evidence from files in the current working directory; do not use external knowledge. You own hypotheses, causal reasoning, investigation order, conclusions, and when to stop. Native tools and TraceCite tools are available. You MUST use tracecite_search at least once as a real part of the evidence investigation before giving the final answer. Follow the TraceCite skill tool-selection, search-syntax, novelty, and identity-safety semantics. TraceCite supplies evidence and retrieval memory; it does not decide root cause or when to stop. Keep exploration bounded. Every material factual claim must cite exact line numbers you actually observed. Distinguish direct observation from inference and state when supplied evidence is insufficient.'
          mkdir -p "$RESULT/pi-tracecite-session"
          cd "$INPUT_ROOT"
          set +e
          timeout -k 30s 600s pi \
            --provider gmi --model "$BENCH_MODEL" --api-key "$OPENAI_API_KEY" \
            --thinking off --mode text --print \
            --session-dir "$RESULT/pi-tracecite-session" \
            --extension "$GITHUB_WORKSPACE/benchmarks/agent-investigation/pi_tracecite_extension.ts" \
            --tools read,bash,grep,find,ls,tracecite_search,tracecite_expand \
            --no-skills --skill "$GITHUB_WORKSPACE/.pi/skills/tracecite/SKILL.md" \
            --no-prompt-templates --no-context-files \
            --system-prompt "$SYSTEM_PROMPT" "$QUESTION" \
            > "$RESULT/pi-tracecite-answer.md" 2> "$RESULT/pi-tracecite-stderr.log"
          code=$?
          set -e
          echo "$code" > "$RESULT/pi-tracecite-exit.txt"

      - name: Convert, score, and compare
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for arm in native tracecite; do
            SESSION="$(find "$RESULT/pi-${arm}-session" -type f -name '*.jsonl' -print -quit 2>/dev/null || true)"
            ANSWER="$RESULT/pi-${arm}-answer.md"
            if [[ -z "$SESSION" || ! -f "$ANSWER" ]]; then continue; fi
            python benchmarks/agent-investigation/pi_session_to_transcript.py \
              "$SESSION" "$ANSWER" "$RESULT/pi-${arm}-transcript.jsonl" \
              --mode "pi-${arm}" --model "$BENCH_MODEL"
            if [[ "$SCORER" == "root_cause" ]]; then
              python -m tracecite.root_cause_benchmarking score "$CASE_DIR_RUN" "$RESULT/pi-${arm}-transcript.jsonl" > "$RESULT/pi-${arm}-score.json" || true
            else
              python -m tracecite.benchmarking score "$CASE_DIR_RUN" "$RESULT/pi-${arm}-transcript.jsonl" > "$RESULT/pi-${arm}-score.json" || true
            fi
          done

          python - <<'PY'
          import json, os, sys
          from collections import Counter
          from pathlib import Path
          sys.path.insert(0, str(Path('benchmarks/agent-investigation').resolve()))
          from pi_ab_runtime import classify_arm_validity

          root = Path(os.environ['RESULT'])
          scorer = os.environ['SCORER']

          def arm(name):
              score_path = root / f'pi-{name}-score.json'
              transcript_path = root / f'pi-{name}-transcript.jsonl'
              exit_path = root / f'pi-{name}-exit.txt'
              stderr_path = root / f'pi-{name}-stderr.log'
              score = json.loads(score_path.read_text()) if score_path.is_file() else {}
              quality = score.get('quality') or {}
              cost = score.get('context_cost') or {}
              tools = Counter(); sequence=[]
              if transcript_path.is_file():
                  for line in transcript_path.read_text(errors='replace').splitlines():
                      if not line.strip(): continue
                      e = json.loads(line)
                      if e.get('type') == 'tool':
                          n = str(e.get('name') or 'unknown'); tools[n] += 1; sequence.append(n)
              exit_code = int(exit_path.read_text().strip()) if exit_path.is_file() else None
              stderr = stderr_path.read_text(errors='replace') if stderr_path.is_file() else ''
              validity = classify_arm_validity(exit_code, stderr)
              valid = validity.valid_for_comparison
              failure_kind = validity.failure_kind
              required_used = True
              if name == 'tracecite' and tools.get('tracecite_search', 0) < 1:
                  required_used = False; valid = False; failure_kind = 'required_tracecite_not_used'
              row = {
                  'exit_code':exit_code,'valid_for_comparison':valid,'infrastructure_invalid':validity.infrastructure_invalid,
                  'failure_kind':failure_kind,'required_tracecite_used':required_used,
                  'raw_passed':score.get('passed') if valid else None,'scored_raw_passed':score.get('passed'),
                  'tool_names':dict(sorted(tools.items())),'tool_sequence':sequence,
                  'model_calls':cost.get('model_calls'),'tool_calls':cost.get('tool_calls'),
                  'reported_input_tokens':cost.get('reported_input_tokens'),
                  'reported_cache_read_input_tokens':cost.get('reported_cache_read_input_tokens'),
                  'reported_output_tokens':cost.get('reported_output_tokens'),'tool_output_chars':cost.get('tool_output_chars'),
                  'stderr_tail':stderr[-400:] if stderr else '',
              }
              if scorer == 'root_cause':
                  row['dimension_recall']=quality.get('dimension_recall')
                  row['supported_dimension_recall']=quality.get('supported_dimension_recall')
                  row['citation_accuracy']=(quality.get('citation') or {}).get('accuracy')
              else:
                  row['concept_recall']=quality.get('concept_recall')
                  row['evidence_marker_recall']=quality.get('evidence_marker_recall')
              return row

          a=arm('native'); b=arm('tracecite')
          result={
              'schema_version':1,'suite_id':'pi-few-mb-forced-tracecite-smoke-v1','case_id':os.environ['CASE_ID'],
              'input_bytes':int(os.environ.get('INPUT_BYTES') or 0),'scorer':scorer,'tracecite_use_required':True,
              'comparison_valid':a['valid_for_comparison'] and b['valid_for_comparison'],'native':a,'tracecite':b,
          }
          (root/'comparison.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,indent=2,sort_keys=True))
          if not result['comparison_valid']:
              raise SystemExit(f"invalid A/B pair: native={a['failure_kind']} tracecite={b['failure_kind']}")
          PY

      - name: Upload comparison artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-few-mb-${{ matrix.case_id }}
          path: /tmp/pi-few-mb-${{ matrix.case_id }}
          if-no-files-found: warn

  aggregate:
    needs: compare
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pi-few-mb-*
          path: /tmp/pi-few-mb-all
      - name: Aggregate two comparisons
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for p in sorted(Path('/tmp/pi-few-mb-all').rglob('comparison.json')):
              rows.append(json.loads(p.read_text()))
          summary={'requested':2,'received':len(rows),'valid_pairs':sum(bool(r.get('comparison_valid')) for r in rows),'cases':rows}
          Path('/tmp/pi-few-mb-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pi-few-mb-forced-ab-summary
          path: /tmp/pi-few-mb-summary.json
