name: Pi RCAEval Parallel A/B 5x Budget

on:
  workflow_dispatch:
  push:
    branches:
      - feature_for_agent_refacotr_shell
    paths:
      - .github/workflows/pi-rcaeval-parallel-ab-5x-budget.yml

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare shared RCAEval telemetry
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build anonymous telemetry image
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pandas pyarrow huggingface_hub
          mkdir -p /tmp/evidence /tmp/rcaeval-download
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          import pandas as pd
          from huggingface_hub import hf_hub_download

          case = 're3tt_ts-route-service_f3_6'
          download_root = Path('/tmp/rcaeval-download')
          evidence_root = Path('/tmp/evidence')

          def fetch(name: str) -> Path:
              return Path(hf_hub_download(
                  repo_id='phamquiluan/RCAEval', repo_type='dataset',
                  filename=f'{case}/{name}', local_dir=download_root,
              ))

          def scalar(value):
              if value is None:
                  return None
              try:
                  if pd.isna(value):
                      return None
              except Exception:
                  pass
              if hasattr(value, 'item'):
                  try:
                      value = value.item()
                  except Exception:
                      pass
              if hasattr(value, 'isoformat'):
                  try:
                      return value.isoformat()
                  except Exception:
                      pass
              return value

          telemetry = {
              'logs': ('logs.parquet', evidence_root / 'logs.jsonl'),
              'traces': ('traces.parquet', evidence_root / 'traces.jsonl'),
              'metrics': ('metrics.parquet', evidence_root / 'metrics.jsonl'),
          }
          stats = {}
          for kind, (remote_name, out_path) in telemetry.items():
              frame = pd.read_parquet(fetch(remote_name))
              with out_path.open('w', encoding='utf-8') as handle:
                  for row in frame.to_dict(orient='records'):
                      payload = {'kind': kind[:-1] if kind.endswith('s') else kind}
                      payload.update({str(k): scalar(v) for k, v in row.items()})
                      handle.write(json.dumps(payload, ensure_ascii=False, separators=(',', ':'), default=str) + '\n')
              stats[kind] = {'rows': int(len(frame)), 'bytes': out_path.stat().st_size}

          inject = fetch('inject_time.txt').read_text(encoding='utf-8').strip()
          (evidence_root / 'incident_time.txt').write_text(inject + '\n', encoding='utf-8')
          (evidence_root / 'telemetry-stats.json').write_text(json.dumps(stats, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          shutil.rmtree(download_root, ignore_errors=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rcaeval-shared-telemetry
          path: /tmp/evidence
          retention-days: 1

  arm:
    name: ${{ matrix.label }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arm: native
            label: Native / GMI1
          - arm: tracecite
            label: TraceCite / GMI2
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GMI_BASE_URL: https://api.gmi-serving.com/v1
      PI_CODING_AGENT_DIR: /tmp/pi-agent-${{ matrix.arm }}-${{ github.run_id }}
      PI_SKIP_VERSION_CHECK: "1"
      PI_TELEMETRY: "0"
      EVIDENCE_ROOT: /tmp/evidence
      RESULT_ROOT: /tmp/result-${{ matrix.arm }}
      WORK_ROOT: /tmp/work-${{ matrix.arm }}
      MCP_STATE_ROOT: /tmp/mcp-state-${{ matrix.arm }}
      TRACECITE_MCP_REF: b83c3e64a1b5d8018ebb57a089ec1c5c96263d2a
      TRACECITE_EVIDENCE_MAX_TOKENS: "60000"
      TRACECITE_EVIDENCE_MAX_BYTES: "327680"
      TRACECITE_MATERIALIZE_MAX_CHARS: "4000"
      AGENT_TIMEOUT_SECONDS: "420"
      ARM_MODEL: ${{ matrix.arm == 'native' && vars.GMI_MODEL || vars.GMI2_MODEL }}
      ARM_API_KEY: ${{ matrix.arm == 'native' && secrets.GMI_API_KEY || secrets.GMI2_API_KEY }}
    steps:
      - name: Checkout TraceCite Core under test
        uses: actions/checkout@v4
      - name: Checkout pinned TraceCite MCP
        uses: actions/checkout@v4
        with:
          repository: samstring/tracecite-mcp
          ref: ${{ env.TRACECITE_MCP_REF }}
          path: tracecite-mcp
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          name: rcaeval-shared-telemetry
          path: /tmp/evidence
      - name: Install Pi and benchmark dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.84.4
          mkdir -p "$PI_CODING_AGENT_DIR"
          python -m pip install -q -e ".[dev]"
          python -m pip install -q 'mcp>=2,<3'
          pi install npm:pi-mcp-adapter@2.27.0 --approve
          python -m pip install -q -e ./tracecite-mcp --no-deps
      - name: Verify vNext Core and MCP contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_evidence_compute_batch.py \
            tests/test_evidence_shell_fast_jsonl.py \
            tests/test_evidence_shell_agent_regressions.py
          python -m pytest -q \
            tracecite-mcp/tests/test_server.py \
            tracecite-mcp/tests/test_stdio_integration.py \
            tracecite-mcp/tests/test_shell_projection_agent_feedback.py \
            tracecite-mcp/tests/test_session_transport_regressions.py
      - name: Run ${{ matrix.label }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ARM_MODEL:-}" && test -n "${ARM_API_KEY:-}"
          mkdir -p "$RESULT_ROOT" "$WORK_ROOT" "$MCP_STATE_ROOT"
          cat > "$WORK_ROOT/question.md" <<'EOF'
          Investigate the supplied microservice failure using the telemetry in the evidence directory.
          The directory contains logs.jsonl, traces.jsonl, metrics.jsonl, and incident_time.txt.
          Identify the most likely root-cause service and the concrete failure mechanism/fault type.
          Explain the causal chain and cite exact observed evidence using file:L<line> references.
          Distinguish direct observations from inference. If the supplied telemetry cannot distinguish a more specific mechanism, state that evidence boundary rather than guessing. Do not use the web or external knowledge.
          EOF
          python - <<'PY'
          import json, os
          from pathlib import Path
          model = os.environ['ARM_MODEL']
          payload = {'providers': {'gmi': {
              'name': 'GMI OpenAI-compatible',
              'baseUrl': os.environ['GMI_BASE_URL'],
              'api': 'openai-completions',
              'models': [{
                  'id': model, 'name': model, 'reasoning': False, 'input': ['text'],
                  'cost': {'input': 0, 'output': 0, 'cacheRead': 0, 'cacheWrite': 0},
                  'contextWindow': 1_000_000, 'maxTokens': 4_096,
                  'compat': {'supportsDeveloperRole': False, 'supportsReasoningEffort': False},
              }],
          }}}
          path = Path(os.environ['PI_CODING_AGENT_DIR']) / 'models.json'
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, indent=2) + '\n')
          PY

          extra=()
          if [[ "${{ matrix.arm }}" == tracecite ]]; then
            # Only the real Agent run is host-pinned. Preflight tests retain the
            # default caller-selected session semantics.
            export TRACECITE_MCP_SESSION_ID="rcaeval-${GITHUB_RUN_ID}-tracecite"
            extra=(
              --skill-dir "$GITHUB_WORKSPACE/tracecite-mcp/skills/tracecite"
              --mcp-evidence-root "$EVIDENCE_ROOT"
              --mcp-state-dir "$MCP_STATE_ROOT"
            )
          fi

          set +e
          python benchmarks/agent-investigation/agent_flow_runner.py \
            --agent pi \
            --mode "${{ matrix.arm }}" \
            --workspace-kind evidence-only \
            --source-root "$WORK_ROOT" \
            --runtime-log "$EVIDENCE_ROOT/logs.jsonl" \
            --result-root "$RESULT_ROOT" \
            --question-file "$WORK_ROOT/question.md" \
            --provider gmi \
            --model "$ARM_MODEL" \
            --api-key "$ARM_API_KEY" \
            --thinking off \
            --timeout-seconds "$AGENT_TIMEOUT_SECONDS" \
            --host-extension "$GITHUB_WORKSPACE/benchmarks/agent-investigation/pi_log_code_benchmark_host.ts" \
            "${extra[@]}"
          code=$?
          set -e
          echo "$code" > "$RESULT_ROOT/arm-exit.txt"
          printf '%s\n' "${{ matrix.arm }}" > "$RESULT_ROOT/arm.txt"
          printf '%s\n' "$ARM_MODEL" > "$RESULT_ROOT/model.txt"
          printf '%s\n' "${{ github.sha }}" > "$RESULT_ROOT/core-commit.txt"
          printf '%s\n' "$AGENT_TIMEOUT_SECONDS" > "$RESULT_ROOT/agent-timeout-seconds.txt"
          if [[ "${{ matrix.arm }}" == tracecite ]]; then
            printf '%s\n' "$TRACECITE_MCP_REF" > "$RESULT_ROOT/tracecite-mcp-ref.txt"
            printf '%s\n' "$TRACECITE_EVIDENCE_MAX_TOKENS" > "$RESULT_ROOT/evidence-max-tokens.txt"
            printf '%s\n' "$TRACECITE_EVIDENCE_MAX_BYTES" > "$RESULT_ROOT/evidence-max-bytes.txt"
            printf '%s\n' "$TRACECITE_MATERIALIZE_MAX_CHARS" > "$RESULT_ROOT/materialize-max-chars.txt"
            printf '%s\n' "$TRACECITE_MCP_SESSION_ID" > "$RESULT_ROOT/host-session-id.txt"
          fi
          exit 0
      - name: Build no-gold summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          session="$(find "$RESULT_ROOT/pi-${{ matrix.arm }}-session" -type f -name '*.jsonl' -print -quit 2>/dev/null || true)"
          answer="$RESULT_ROOT/pi-${{ matrix.arm }}-answer.md"
          if [[ -z "$session" || ! -f "$answer" ]]; then exit 0; fi
          transcript="$RESULT_ROOT/pi-${{ matrix.arm }}-transcript.jsonl"
          python benchmarks/agent-investigation/pi_session_to_transcript.py "$session" "$answer" "$transcript" --mode "pi-rcaeval-parallel-${{ matrix.arm }}" --model "$ARM_MODEL"
          python - "$session" "$transcript" "$answer" "$RESULT_ROOT/no-gold-summary.json" "${{ matrix.arm }}" <<'PY'
          import importlib.util, json, sys
          from collections import Counter
          from pathlib import Path
          session_path, transcript_path, answer_path, output_path = map(Path, sys.argv[1:5])
          arm = sys.argv[5]
          spec = importlib.util.spec_from_file_location('run_result', Path('benchmarks/agent-investigation/run_result.py'))
          module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          events = [json.loads(x) for x in transcript_path.read_text().splitlines() if x.strip()]
          usage = [e.get('usage') or {} for e in events if e.get('type') == 'model']
          tools = [e for e in events if e.get('type') == 'tool']
          incidents = module._provider_session_incidents(session_path.read_text(encoding='utf-8', errors='replace'))
          out = {
            'evaluation_mode': 'manual_no_gold', 'arm': arm,
            'answer_nonempty': bool(answer_path.read_text(encoding='utf-8', errors='replace').strip()),
            'provider_incidents': dict(Counter(str(x['kind']) for x in incidents)),
            'token_usage': {
              'fresh_input_tokens': sum(int(x.get('input_tokens') or 0) for x in usage),
              'cached_input_tokens': sum(int(x.get('cached_input_tokens') or 0) for x in usage),
              'output_tokens': sum(int(x.get('output_tokens') or 0) for x in usage),
              'model_calls': len(usage),
            },
            'trajectory': module.trajectory_summary(events),
            'tool_counts': dict(Counter(str(e.get('tool') or e.get('name') or '') for e in tools)),
          }
          output_path.write_text(json.dumps(out, indent=2, sort_keys=True) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rcaeval-parallel-${{ matrix.arm }}
          path: ${{ env.RESULT_ROOT }}
          retention-days: 14
