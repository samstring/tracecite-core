name: A1 Session Path Cleanup

on:
  push:
    branches: [experiment/evidence-intelligence]
    paths: [.github/workflows/a1-session-path-cleanup.yml]

permissions:
  contents: write

jobs:
  cleanup-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/evidence-intelligence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/_a1_session_path_cleanup.py
      - name: Verify expanded A1 coverage
        run: |
          python -m pip install -e . pytest
          python -m compileall -q src/tracecite/runtime
          pytest -q tests/test_runtime_agent_api.py tests/test_runtime_boundary.py tests/test_session_novelty_regressions.py tests/test_gmi_scale_evidence_progress.py
          python scripts/check_architecture.py
      - name: Commit verified cleanup and remove one-shot helpers
        run: |
          git config user.name "tracecite-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm scripts/_a1_session_path_cleanup.py
          git rm .github/workflows/a1-session-path-cleanup.yml
          git add src/tracecite/runtime/session_retrieval.py src/tracecite/runtime/relationship_frontier.py tests/test_runtime_boundary.py
          git commit -m "runtime: remove residual session stop semantics"
          git push origin HEAD:experiment/evidence-intelligence
