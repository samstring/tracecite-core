name: Pi Three New Cases Strict A/B GMI Rerun

on:
  push:
    branches:
      - experiment/evidence-intelligence
    paths:
      - .github/workflows/pi-three-new-cases-strict-ab-gmi-rerun.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pi-three-new-cases-strict-gmi-rerun
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - case_id: moby-35310-endpoint-cnt
            artifact_name: pi-three-new-moby-35310-endpoint-cnt
            arm_order: native tracecite
          - case_id: vscode-41136-clock-spdlog
            artifact_name: pi-three-new-vscode-41136-clock-spdlog
            arm_order: tracecite native
          - case_id: vscode-132086-gpu-startup
            artifact_name: pi-three-new-vscode-132086-gpu-startup
            arm_order: native tracecite
    env:
      GMI_BASE_URL: https://api.gmi-serving.com/v1
      GMI_API_KEY: ${{ secrets.GMI_API_KEY }}
      BENCH_MODEL: ${{ vars.GMI_MODEL }}
      PI_CODING_AGENT_DIR: /tmp/pi-agent-config
      PI_SKIP_VERSION_CHECK: "1"
      PI_TELEMETRY: "0"
      SOURCE_RUN_ID: "33478792915"
      CASE_ID: ${{ matrix.case_id }}
      ARTIFACT_NAME: ${{ matrix.artifact_name }}
      ARM_ORDER: ${{ matrix.arm_order }}
      RESULT_ROOT: /tmp/pi-three-new-gmi/${{ matrix.case_id }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Pi and TraceCite
        shell: bash
        run: |
          set -euo pipefail
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.84.4
          python -m pip install -e ".[dev]"
          test -n "$GMI_API_KEY"
          test -n "$BENCH_MODEL"
          test -f "$GITHUB_WORKSPACE/.pi/skills/tracecite/SKILL.md"

      - name: Configure GMI model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PI_CODING_AGENT_DIR"
          python - <<'PY'
          import json, os
          from pathlib import Path
          model = os.environ['BENCH_MODEL']
          payload = {'providers': {'gmi': {
              'name': 'GMI OpenAI-compatible',
              'baseUrl': os.environ['GMI_BASE_URL'],
              'api': 'openai-completions',
              'models': [{
                  'id': model,
                  'name': model,
                  'reasoning': False,
                  'input': ['text'],
                  'cost': {'input': 0, 'output': 0, 'cacheRead': 0, 'cacheWrite': 0},
                  'contextWindow': 1_000_000,
                  'maxTokens': 4_096,
                  'compat': {'supportsDeveloperRole': False, 'supportsReasoningEffort': False},
              }],
          }}}
          (Path(os.environ['PI_CODING_AGENT_DIR']) / 'models.json').write_text(json.dumps(payload, indent=2) + '\n')
          PY

      - name: Reuse prepared evidence and source from first run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RESULT_ROOT"
          mkdir -p "$RESULT_ROOT"
          gh run download "$SOURCE_RUN_ID" -n "$ARTIFACT_NAME" -D "$RESULT_ROOT"
          rm -rf "$RESULT_ROOT"/pi-native-* "$RESULT_ROOT"/pi-tracecite-* \
                 "$RESULT_ROOT"/tracecite-* "$RESULT_ROOT"/comparison.json "$RESULT_ROOT"/arm-order.txt
          test -f "$RESULT_ROOT/input/evidence.log"
          test -f "$RESULT_ROOT/case/question.md"
          test -f "$RESULT_ROOT/case/gold.json"
          mkdir -p "$RESULT_ROOT/source"
          {
            echo "RUNTIME_LOG=$(realpath "$RESULT_ROOT/input/evidence.log")"
            echo "RUNTIME_LOG_BYTES=$(stat -c '%s' "$RESULT_ROOT/input/evidence.log")"
            echo "SOURCE_ROOT=$(realpath "$RESULT_ROOT/source")"
            echo "CASE_DIR=$(realpath "$RESULT_ROOT/case")"
          } >> "$GITHUB_ENV"
          python -m tracecite.root_cause_benchmarking validate "$RESULT_ROOT/case"

      - name: Run paired Native vs Strict TraceCite
        shell: bash
        run: |
          set -euo pipefail
          QUESTION="$(cat "$CASE_DIR/question.md")"
          if find "$SOURCE_ROOT" -mindepth 1 -maxdepth 1 -print -quit | grep -q .; then
            BASE_PROMPT="You are a real coding agent debugging a failure with a complete pre-fix source repository as your current working directory. A failing runtime evidence file is available at $RUNTIME_LOG. You own hypotheses, causal reasoning, source-code exploration, investigation order, conclusions, evidence sufficiency, and when to stop. Do not use the web, issue/PR content, remote git operations, or post-fix knowledge. Cite important claims as exact runtime-evidence or source path:L<line> references you actually observed. Distinguish direct observation from inference."
          else
            BASE_PROMPT="You are a real coding agent investigating a supplied runtime evidence file at $RUNTIME_LOG. No source checkout is supplied for this case. You own hypotheses, causal reasoning, investigation order, conclusions, evidence sufficiency, and when to stop. Do not use the web, issue/PR content, or post-fix knowledge. Cite important claims as exact evidence.log:L<line> references you actually observed. Distinguish direct observation from inference."
          fi

          run_arm() {
            arm="$1"
            mkdir -p "$RESULT_ROOT/pi-${arm}-session"
            cd "$SOURCE_ROOT"
            set +e
            if [[ "$arm" == native ]]; then
              PROMPT="$BASE_PROMPT This is the native evidence arm. You may inspect the runtime evidence with the same native read/grep/bash tools you use for source code."
              timeout -k 30s 1200s pi \
                --provider gmi --model "$BENCH_MODEL" --api-key "$GMI_API_KEY" \
                --thinking off --mode text --print \
                --session-dir "$RESULT_ROOT/pi-native-session" \
                --tools read,bash,grep,find,ls \
                --no-extensions --no-skills --no-prompt-templates --no-context-files \
                --system-prompt "$PROMPT" "$QUESTION" \
                > "$RESULT_ROOT/pi-native-answer.md" 2> "$RESULT_ROOT/pi-native-stderr.log"
            else
              PROMPT="$BASE_PROMPT This is the strict TraceCite evidence arm. Native read/grep/bash/find/ls remain available for source-code exploration, but EVERY operation that inspects or derives from runtime evidence content MUST use TraceCite. The Host blocks native content access outside the source root. Use TraceCite as real evidence retrieval, not merely to satisfy a tool-call requirement."
              TRACECITE_PI_SESSION="$RESULT_ROOT/tracecite-retrieval-session.json" \
              TRACECITE_PI_ACTIVITY="$RESULT_ROOT/tracecite-host-tool-activity.json" \
              TRACECITE_LOG_GUARD_ACTIVITY="$RESULT_ROOT/tracecite-log-guard-blocks.jsonl" \
              TRACECITE_LOG_ACCESS_ACTIVITY="$RESULT_ROOT/tracecite-runtime-log-access.jsonl" \
              TRACECITE_CODE_ROOT="$SOURCE_ROOT" \
              TRACECITE_RUNTIME_LOG="$RUNTIME_LOG" \
              timeout -k 30s 1200s pi \
                --provider gmi --model "$BENCH_MODEL" --api-key "$GMI_API_KEY" \
                --thinking off --mode text --print \
                --session-dir "$RESULT_ROOT/pi-tracecite-session" \
                --extension "$GITHUB_WORKSPACE/benchmarks/agent-investigation/pi_log_code_tracecite_extension.ts" \
                --tools read,bash,grep,find,ls,tracecite_retrieve,tracecite_materialize,tracecite_replay,tracecite_aggregate,tracecite_traverse,tracecite_verify,tracecite_search,tracecite_expand \
                --no-skills --skill "$GITHUB_WORKSPACE/.pi/skills/tracecite/SKILL.md" \
                --no-prompt-templates --no-context-files \
                --system-prompt "$PROMPT" "$QUESTION" \
                > "$RESULT_ROOT/pi-tracecite-answer.md" 2> "$RESULT_ROOT/pi-tracecite-stderr.log"
            fi
            code=$?
            set -e
            echo "$code" > "$RESULT_ROOT/pi-${arm}-exit.txt"
          }

          echo "$ARM_ORDER" > "$RESULT_ROOT/arm-order.txt"
          first="${ARM_ORDER%% *}"
          second="${ARM_ORDER##* }"
          run_arm "$first"
          sleep 20
          run_arm "$second"

      - name: Convert, score, and summarize
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for arm in native tracecite; do
            SESSION="$(find "$RESULT_ROOT/pi-${arm}-session" -type f -name '*.jsonl' -print -quit 2>/dev/null || true)"
            ANSWER="$RESULT_ROOT/pi-${arm}-answer.md"
            EXIT="$RESULT_ROOT/pi-${arm}-exit.txt"
            if [[ -z "$SESSION" || ! -f "$ANSWER" || ! -f "$EXIT" ]]; then continue; fi
            TRANSCRIPT="$RESULT_ROOT/pi-${arm}-transcript.jsonl"
            SCORE="$RESULT_ROOT/pi-${arm}-score.json"
            RUN_RESULT="$RESULT_ROOT/pi-${arm}-run-result.json"
            python benchmarks/agent-investigation/pi_session_to_transcript.py \
              "$SESSION" "$ANSWER" "$TRANSCRIPT" \
              --mode "pi-three-new-gmi-${arm}" --model "$BENCH_MODEL"
            python -m tracecite.root_cause_benchmarking score "$CASE_DIR" "$TRANSCRIPT" > "$SCORE" || true
            if [[ -f "$SCORE" ]]; then
              python benchmarks/agent-investigation/run_result.py \
                --score "$SCORE" --exit-code-file "$EXIT" \
                --stderr "$RESULT_ROOT/pi-${arm}-stderr.log" \
                --session "$SESSION" --transcript "$TRANSCRIPT" \
                --output "$RUN_RESULT" || true
            fi
          done

          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RESULT_ROOT'])
          def read(name):
              p=root/name
              return json.loads(p.read_text()) if p.is_file() else None
          def rows(name):
              p=root/name
              return [json.loads(x) for x in p.read_text().splitlines() if x.strip()] if p.is_file() else []
          def valid(v): return bool(v and (v.get('run_validity') or {}).get('valid_for_comparison'))
          native=read('pi-native-run-result.json'); trace=read('pi-tracecite-run-result.json')
          blocked=rows('tracecite-log-guard-blocks.jsonl'); accesses=rows('tracecite-runtime-log-access.jsonl')
          trajectory=(trace or {}).get('trajectory') or {}
          report={
            'schema_version':2,
            'case_id':os.environ['CASE_ID'],
            'runtime_log_bytes':int(os.environ.get('RUNTIME_LOG_BYTES') or 0),
            'arm_order':(root/'arm-order.txt').read_text().strip() if (root/'arm-order.txt').is_file() else None,
            'native':native,
            'tracecite':trace,
            'blocked_native_log_attempts':blocked,
            'tracecite_runtime_log_access':accesses,
            'tracecite_total_evidence_calls':int(trajectory.get('tracecite_evidence_calls') or 0),
            'tracecite_runtime_log_calls':len(accesses),
            'strict_boundary_valid':len(accesses)>0,
            'comparison_valid':valid(native) and valid(trace) and len(accesses)>0,
          }
          (root/'comparison.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          PY

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-three-new-gmi-${{ matrix.case_id }}
          path: ${{ env.RESULT_ROOT }}
          if-no-files-found: warn
