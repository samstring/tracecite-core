name: Trigger Evidence Runtime Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/evidence-intelligence
    paths:
      - .github/workflows/trigger-formal-pi-ab.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Pi Evidence Runtime smoke A/B
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/$REPO/actions/workflows/pi-evidence-runtime-ab.yml/dispatches" \
            --input - <<'JSON'
          {
            "ref": "experiment/evidence-intelligence",
            "inputs": {
              "scope": "smoke"
            }
          }
          JSON
          echo "Pi Evidence Runtime smoke A/B dispatched."
