name: Evidence Bounded Density Repair Once

on:
  push:
    branches:
      - experiment/evidence-intelligence
    paths:
      - .github/workflows/evidence-bounded-density-repair-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/evidence-intelligence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Increase bounded navigation density under same char cap
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/tracecite/runtime/retrieve_contract.py')
          s = p.read_text()
          old = '_BOUNDED_SOURCE_SAMPLE_RECORDS = 16\n_BOUNDED_SOURCE_SAMPLE_CHARS = 12_000\n'
          new = '_BOUNDED_SOURCE_SAMPLE_RECORDS = 64\n_BOUNDED_SOURCE_SAMPLE_CHARS = 12_000\n'
          if old not in s:
              raise SystemExit('bounded source constants not found')
          p.write_text(s.replace(old, new))

          p = Path('tests/test_evidence_routing.py')
          s = p.read_text()
          old = '''    rows = [f"record {index}" for index in range(160)]\n    rows[80] = "MIDPOINT_STRUCTURAL_LANDMARK"\n'''
          new = '''    rows = [f"record {index}" for index in range(623)]\n    rows[88] = "MIDPOINT_STRUCTURAL_LANDMARK"\n'''
          if old not in s:
              raise SystemExit('routing sample fixture not found')
          s = s.replace(old, new)
          old = '''    assert payload["coverage"]["sampled_records"] == 16\n    assert payload["coverage"]["returned_chars"] <= 12_000\n    assert payload["data"]["samples"]\n'''
          new = '''    assert payload["coverage"]["sampled_records"] == 64\n    assert payload["coverage"]["returned_chars"] <= 12_000\n    assert payload["data"]["samples"]\n    assert any(\n        sample.get("start_line") == 89 and "MIDPOINT_STRUCTURAL_LANDMARK" in sample.get("text", "")\n        for sample in payload["data"]["samples"]\n    )\n'''
          if old not in s:
              raise SystemExit('routing sample assertions not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Run deterministic routing regressions
        run: |
          python -m pip install -e ".[dev]"
          pytest -q tests/test_evidence_routing.py tests/test_evidence_ambiguity.py tests/test_retrieval_guidance.py
      - name: Commit density repair and clean temporary workflows
        run: |
          rm -f .github/workflows/evidence-bounded-density-repair-once.yml
          rm -f .github/workflows/evidence-failure-focused-rerun-2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(evidence): densify bounded source landmarks"
          git push origin HEAD:experiment/evidence-intelligence
