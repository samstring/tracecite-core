name: Real-World Inspect-First Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/evidence-intelligence
    paths:
      - ".github/workflows/evidence-real-world-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.TRACECITE_BENCH_BASE_URL || 'https://api.gmi-serving.com/v1' }}
      BENCH_MODEL: ${{ vars.TRACECITE_BENCH_MODEL }}
      TRACECITE_BENCH_MAX_OUTPUT_TOKENS: "1800"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TraceCite
        run: python -m pip install -e ".[dev]"
      - name: Prepare case
        shell: bash
        run: |
          set -euo pipefail
          case_dir="benchmarks/agent-investigation/cases/doublecmd-2809"
          rm -rf /tmp/tracecite-rw-smoke
          python -m tracecite.benchmarking validate "$case_dir"
          python -m tracecite.benchmarking prepare "$case_dir" --work-dir /tmp/tracecite-rw-smoke
      - name: Run inspect-first TraceCite smoke
        shell: bash
        run: |
          set -uo pipefail
          case_dir="benchmarks/agent-investigation/cases/doublecmd-2809"
          manifest="/tmp/tracecite-rw-smoke/doublecmd-2809/prepared.json"
          mkdir -p /tmp/tracecite-rw-smoke-results
          transcript="/tmp/tracecite-rw-smoke-results/doublecmd-2809-tracecite-1.jsonl"
          python benchmarks/agent-investigation/run_host.py \
            "$case_dir" "$manifest" \
            --mode tracecite \
            --model "$BENCH_MODEL" \
            --seed 1 \
            --timeout-seconds 600 \
            --output "$transcript" \
            --pass-env OPENAI_API_KEY \
            --pass-env OPENAI_BASE_URL \
            --pass-env TRACECITE_BENCH_MAX_OUTPUT_TOKENS \
            -- python "$GITHUB_WORKSPACE/benchmarks/agent-investigation/gmi_raw_host_v2.py"
          rc=$?
          cat "$transcript"
          if [ "$rc" -eq 0 ]; then
            python -m tracecite.benchmarking score "$case_dir" "$transcript" | tee /tmp/tracecite-rw-smoke-results/score.json
          fi
          exit "$rc"
      - name: Upload smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-real-world-smoke
          path: /tmp/tracecite-rw-smoke-results
          if-no-files-found: warn
