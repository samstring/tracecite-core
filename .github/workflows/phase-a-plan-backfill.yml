name: Phase A Plan Backfill

on:
  push:
    branches: [experiment/evidence-intelligence]
    paths: [.github/workflows/phase-a-plan-backfill.yml]

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/evidence-intelligence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/_backfill_phase_a_plan.py
      - name: Commit plan and remove one-shot helpers
        run: |
          git config user.name "tracecite-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm scripts/_backfill_phase_a_plan.py
          git rm .github/workflows/phase-a-plan-backfill.yml
          git add docs/evidence-runtime-refactor-plan.zh-CN.md
          git commit -m "docs: close phase A and start RetrievalSession convergence"
          git push origin HEAD:experiment/evidence-intelligence
