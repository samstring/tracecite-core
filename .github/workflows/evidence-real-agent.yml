name: Evidence Real Agent Pilot

on:
  push:
    branches:
      - experiment/evidence-intelligence
    paths:
      - "benchmarks/agent-investigation/openai_host.py"
      - "benchmarks/agent-investigation/run_host.py"
      - "benchmarks/agent-investigation/aggregate_scores.py"
      - "benchmarks/agent-investigation/cases/mobile-payment-runtime-evidence/**"
      - ".github/workflows/evidence-real-agent.yml"
      - "src/tracecite/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.TRACECITE_BENCH_BASE_URL }}
      BENCH_MODEL: ${{ vars.TRACECITE_BENCH_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TraceCite
        run: python -m pip install -e ".[dev]"
      - name: Validate benchmark configuration
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not configured."
            exit 1
          fi
          if [ -z "$OPENAI_BASE_URL" ]; then
            echo "TRACECITE_BENCH_BASE_URL is not configured."
            exit 1
          fi
          if [ -z "$BENCH_MODEL" ]; then
            echo "TRACECITE_BENCH_MODEL is not configured."
            exit 1
          fi
          echo "Provider base URL: $OPENAI_BASE_URL"
          echo "Benchmark model: $BENCH_MODEL"
      - name: Validate host and prepare pinned case
        run: |
          python -m py_compile benchmarks/agent-investigation/openai_host.py
          python -m tracecite.benchmarking validate benchmarks/agent-investigation/cases/mobile-payment-runtime-evidence
          rm -rf /tmp/tracecite-real-agent
          python -m tracecite.benchmarking prepare \
            benchmarks/agent-investigation/cases/mobile-payment-runtime-evidence \
            --work-dir /tmp/tracecite-real-agent
      - name: Run three-mode smoke test
        id: real_model
        shell: bash
        run: |
          mkdir -p /tmp/tracecite-real-runs /tmp/tracecite-real-scores
          case_dir="benchmarks/agent-investigation/cases/mobile-payment-runtime-evidence"
          manifest="/tmp/tracecite-real-agent/mobile-payment-runtime-evidence/prepared.json"
          seed=1
          for mode in shell_rg tracecite_intelligence tracecite_investigate; do
            transcript="/tmp/tracecite-real-runs/${mode}-${seed}.jsonl"
            score="/tmp/tracecite-real-scores/${mode}-${seed}.json"
            python benchmarks/agent-investigation/run_host.py \
              "$case_dir" "$manifest" \
              --mode "$mode" \
              --model "$BENCH_MODEL" \
              --seed "$seed" \
              --timeout-seconds 600 \
              --output "$transcript" \
              --pass-env OPENAI_API_KEY \
              --pass-env OPENAI_BASE_URL \
              --pass-env TRACECITE_BENCH_MAX_TURNS \
              -- python "$GITHUB_WORKSPACE/benchmarks/agent-investigation/openai_host.py"
            python -m tracecite.benchmarking score "$case_dir" "$transcript" > "$score"
          done
          python benchmarks/agent-investigation/aggregate_scores.py \
            /tmp/tracecite-real-scores/*.json \
            --output /tmp/tracecite-real-runs/aggregate.json
          cat /tmp/tracecite-real-runs/aggregate.json
        env:
          TRACECITE_BENCH_MAX_TURNS: "4"
      - name: Upload pilot results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-real-agent-pilot
          path: |
            /tmp/tracecite-real-runs
            /tmp/tracecite-real-scores
          if-no-files-found: warn
