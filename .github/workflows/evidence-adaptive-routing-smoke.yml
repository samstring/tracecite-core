name: Adaptive Evidence Routing Smoke

# Targeted paired model-cost regression for adaptive transport.
# Small stays DIRECT, a smoke-only medium variant must exercise BOUNDED,
# and the large Kubernetes outlier must escalate to INVESTIGATE.
on:
  workflow_dispatch:
  push:
    branches:
      - experiment/evidence-intelligence
    paths:
      - .github/workflows/evidence-adaptive-routing-smoke.yml

permissions:
  contents: read

concurrency:
  group: evidence-adaptive-routing-smoke
  cancel-in-progress: true

jobs:
  adaptive-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.TRACECITE_BENCH_BASE_URL || 'https://api.gmi-serving.com/v1' }}
      BENCH_MODEL: ${{ vars.TRACECITE_BENCH_MODEL }}
      TRACECITE_BENCH_MAX_OUTPUT_TOKENS: "1800"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TraceCite
        run: python -m pip install -e ".[dev]"
      - name: Install and verify ripgrep
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ripgrep
          fi
          command -v rg
          rg --version
      - name: Validate configuration
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY is not configured"; exit 1; }
          test -n "$BENCH_MODEL" || { echo "TRACECITE_BENCH_MODEL is not configured"; exit 1; }
      - name: Run paired small and large cases
        shell: bash
        run: |
          set -euo pipefail
          rm -rf \
            /tmp/adaptive-tracecite \
            /tmp/adaptive-tracecite-results \
            /tmp/adaptive-shell \
            /tmp/adaptive-shell-results

          python -m tracecite.root_cause_suite run \
            --repo-root "$GITHUB_WORKSPACE" \
            --work-dir /tmp/adaptive-tracecite \
            --output-dir /tmp/adaptive-tracecite-results \
            --mode tracecite \
            --model "$BENCH_MODEL" \
            --host "$GITHUB_WORKSPACE/benchmarks/agent-investigation/gmi_canonical_host.py" \
            --timeout-seconds 180 \
            --case-id pulumi-14231 \
            --case-id kubernetes-140848

          python -m tracecite.root_cause_suite run \
            --repo-root "$GITHUB_WORKSPACE" \
            --work-dir /tmp/adaptive-shell \
            --output-dir /tmp/adaptive-shell-results \
            --mode free_shell \
            --model "$BENCH_MODEL" \
            --host "$GITHUB_WORKSPACE/benchmarks/agent-investigation/gmi_canonical_host.py" \
            --timeout-seconds 180 \
            --case-id pulumi-14231 \
            --case-id kubernetes-140848
      - name: Prepare smoke-only medium BOUNDED variant
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/adaptive-medium /tmp/adaptive-medium-results
          python -m tracecite.root_cause_suite materialize \
            --repo-root "$GITHUB_WORKSPACE" \
            --work-dir /tmp/adaptive-medium \
            --case-id doublecmd-2264

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('/tmp/adaptive-medium')
          index = json.loads((root / 'suite-index.json').read_text(encoding='utf-8'))
          row = index['cases'][0]
          manifest_path = Path(row['prepared_manifest'])
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          source = Path(manifest['inputs'][0]['path'])
          raw = source.read_bytes()

          target_bytes = 128 * 1024
          filler = (
              b'2026-08-28T00:00:00Z INFO healthcheck component=agent-smoke '
              b'status=healthy request=none\n'
          )
          if len(raw) < target_bytes:
              count = ((target_bytes - len(raw)) + len(filler) - 1) // len(filler)
              raw = raw + (b'\n' if raw and not raw.endswith(b'\n') else b'') + filler * count
              source.write_bytes(raw)

          digest = hashlib.sha256(raw).hexdigest()
          manifest['inputs'][0]['bytes'] = len(raw)
          manifest['inputs'][0]['sha256'] = digest
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          meta = {
              'case_dir': row['case_dir'],
              'prepared_manifest': str(manifest_path),
              'source_path': str(source),
              'source_bytes': len(raw),
              'sha256': digest,
          }
          (root / 'medium-meta.json').write_text(
              json.dumps(meta, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(meta, indent=2, sort_keys=True))
          if not (128 * 1024 <= len(raw) < 1024 * 1024):
              raise SystemExit(f'medium fixture size is outside expected bounds: {len(raw)}')
          PY
      - name: Run paired medium BOUNDED case
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/adaptive-medium-results/runs /tmp/adaptive-medium-results/scores
          CASE_DIR="$(python -c "import json; print(json.load(open('/tmp/adaptive-medium/medium-meta.json'))['case_dir'])")"
          MANIFEST="$(python -c "import json; print(json.load(open('/tmp/adaptive-medium/medium-meta.json'))['prepared_manifest'])")"

          for mode in tracecite free_shell; do
            transcript="/tmp/adaptive-medium-results/runs/doublecmd-2264-medium-${mode}.jsonl"
            set +e
            python "$GITHUB_WORKSPACE/benchmarks/agent-investigation/run_host.py" \
              "$CASE_DIR" "$MANIFEST" \
              --mode "$mode" \
              --model "$BENCH_MODEL" \
              --seed 1 \
              --timeout-seconds 180 \
              --output "$transcript" \
              --pass-env OPENAI_API_KEY \
              --pass-env OPENAI_BASE_URL \
              --pass-env TRACECITE_BENCH_MAX_OUTPUT_TOKENS \
              -- \
              python "$GITHUB_WORKSPACE/benchmarks/agent-investigation/gmi_canonical_host.py"
            rc=$?
            set -e
            echo "$rc" > "/tmp/adaptive-medium-results/${mode}-returncode.txt"
            python -m tracecite.root_cause_benchmarking score \
              "$CASE_DIR" "$transcript" \
              > "/tmp/adaptive-medium-results/scores/doublecmd-2264-medium-${mode}.json"
          done
      - name: Verify paired adaptive gates and print costs
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          trace_root = Path('/tmp/adaptive-tracecite-results')
          shell_root = Path('/tmp/adaptive-shell-results')
          medium_root = Path('/tmp/adaptive-medium-results')
          medium_meta = json.loads(Path('/tmp/adaptive-medium/medium-meta.json').read_text())

          def read_json(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def score_or_failure(root, case_id, mode):
              score = root / 'scores' / f'{case_id}-{mode}.json'
              if score.is_file():
                  return {'kind': 'score', **read_json(score)}
              failure = root / 'failures' / f'{case_id}-{mode}.json'
              if failure.is_file():
                  return {'kind': 'failure', **read_json(failure)}
              return {'kind': 'missing', 'case_id': case_id, 'mode': mode}

          def routing_rows(path):
              rows = []
              path = Path(path)
              if not path.is_file():
                  return rows
              for line in path.read_text(encoding='utf-8').splitlines():
                  try:
                      event = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if event.get('type') != 'tool':
                      continue
                  output = event.get('output')
                  if not isinstance(output, str):
                      continue
                  try:
                      payload = json.loads(output)
                  except json.JSONDecodeError:
                      continue
                  routing = ((payload.get('data') or {}).get('routing') or {})
                  if routing:
                      rows.append({
                          'mode': routing.get('mode'),
                          'next_mode': routing.get('next_mode'),
                          'reasons': routing.get('reasons') or [],
                      })
              return rows

          def compact_score(payload):
              if payload.get('kind') != 'score':
                  return payload
              quality = payload.get('quality') or {}
              cost = payload.get('context_cost') or {}
              return {
                  'kind': 'score',
                  'case_id': payload.get('case_id'),
                  'mode': payload.get('mode'),
                  'passed': payload.get('passed'),
                  'dimension_recall': quality.get('dimension_recall'),
                  'supported_dimension_recall': quality.get('supported_dimension_recall'),
                  'citation_accuracy': (quality.get('citation') or {}).get('accuracy'),
                  'input_tokens': cost.get('reported_input_tokens'),
                  'output_tokens': cost.get('reported_output_tokens'),
                  'tool_output_chars': cost.get('tool_output_chars'),
                  'model_calls': cost.get('model_calls'),
                  'tool_calls': cost.get('tool_calls'),
                  'peak_attempted_context_chars': cost.get('peak_attempted_context_chars'),
              }

          small_trace = score_or_failure(trace_root, 'pulumi-14231', 'tracecite')
          large_trace = score_or_failure(trace_root, 'kubernetes-140848', 'tracecite')
          small_shell = score_or_failure(shell_root, 'pulumi-14231', 'free_shell')
          large_shell = score_or_failure(shell_root, 'kubernetes-140848', 'free_shell')
          medium_trace = {'kind': 'score', **read_json(medium_root / 'scores' / 'doublecmd-2264-medium-tracecite.json')}
          medium_shell = {'kind': 'score', **read_json(medium_root / 'scores' / 'doublecmd-2264-medium-free_shell.json')}

          small_routes = routing_rows(trace_root / 'runs' / 'pulumi-14231-tracecite.jsonl')
          medium_routes = routing_rows(medium_root / 'runs' / 'doublecmd-2264-medium-tracecite.jsonl')
          large_routes = routing_rows(trace_root / 'runs' / 'kubernetes-140848-tracecite.jsonl')

          summary = {
              'small': {
                  'source': 'pulumi-14231',
                  'tracecite': compact_score(small_trace),
                  'free_shell_rg': compact_score(small_shell),
                  'routes': small_routes,
              },
              'medium': {
                  'source': 'doublecmd-2264 + smoke-only healthy padding',
                  'source_bytes': medium_meta['source_bytes'],
                  'tracecite': compact_score(medium_trace),
                  'free_shell_rg': compact_score(medium_shell),
                  'routes': medium_routes,
              },
              'large': {
                  'source': 'kubernetes-140848',
                  'tracecite': compact_score(large_trace),
                  'free_shell_rg': compact_score(large_shell),
                  'routes': large_routes,
              },
          }
          Path('/tmp/adaptive-paired-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(summary, indent=2, sort_keys=True))

          for label, payload in (
              ('small', small_trace),
              ('medium', medium_trace),
              ('large', large_trace),
          ):
              if payload.get('kind') != 'score':
                  raise SystemExit(f'{label} TraceCite did not produce a score: {payload}')
              quality = payload.get('quality') or {}
              if not payload.get('passed'):
                  raise SystemExit(f'{label} TraceCite quality gate failed')
              if float(quality.get('supported_dimension_recall') or 0.0) < 0.75:
                  raise SystemExit(f'{label} supported-dimension recall regressed')
              if float((quality.get('citation') or {}).get('accuracy') or 0.0) < 0.5:
                  raise SystemExit(f'{label} citation accuracy regressed')

          if not any(row.get('mode') == 'direct' for row in small_routes):
              raise SystemExit(f'small case did not exercise DIRECT: {small_routes}')
          if not any(
              row.get('mode') == 'bounded'
              and 'direct_output_exceeds_budget' in (row.get('reasons') or [])
              for row in medium_routes
          ):
              raise SystemExit(f'medium case did not exercise BOUNDED from context risk: {medium_routes}')
          if not any(
              row.get('mode') == 'investigate' or row.get('next_mode') == 'investigate'
              for row in large_routes
          ):
              raise SystemExit(f'large case did not escalate to INVESTIGATE: {large_routes}')
          PY
      - name: Upload adaptive paired smoke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-evidence-routing-paired-smoke
          path: |
            /tmp/adaptive-paired-summary.json
            /tmp/adaptive-tracecite/suite-index.json
            /tmp/adaptive-tracecite/snapshots
            /tmp/adaptive-tracecite-results
            /tmp/adaptive-shell/suite-index.json
            /tmp/adaptive-shell/snapshots
            /tmp/adaptive-shell-results
            /tmp/adaptive-medium/suite-index.json
            /tmp/adaptive-medium/medium-meta.json
            /tmp/adaptive-medium-results
          if-no-files-found: warn
