name: Search Cost V2 Literal Hot Path

on:
  push:
    branches:
      - experiment/evidence-intelligence-search-cost-v2
    paths:
      - .github/workflows/search-cost-v2-literal-hotpath.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: experiment/evidence-intelligence-search-cost-v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Patch literal matcher and candidate hot path
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise RuntimeError(f'block not found in {path}: {old[:100]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          matcher = Path('src/tracecite_core/matcher.py')
          replace_once(
              matcher,
              '''_COMPONENT_RESERVED_KEYS = frozenset({"id", "pattern", "effective", "kind"})\n\n# Regexes can be supplied''',
              '''_COMPONENT_RESERVED_KEYS = frozenset({"id", "pattern", "effective", "kind"})\n# CPython's substring search runs in C and is materially faster than the pure\n# Python Aho-Corasick fallback for small term sets. Keep AC for larger sets.\n_LITERAL_ENGINE_MAX_TERMS = 8\n\n# Regexes can be supplied''',
          )
          replace_once(
              matcher,
              '''        if self.terms is not None:\n            self.automaton = _build_automaton(self.terms)\n            if self.automaton is not None:\n                self.engine = "aho-corasick"\n            else:\n                try:\n                    self.pure_ac = _PureAhoCorasick(self.terms)\n                    self.engine = "ac-python"\n                except Exception:  # noqa: BLE001 - 自动机构建失败不是致命错误\n                    self.engine = "literal"\n        else:\n''',
              '''        if self.terms is not None:\n            if len(self.terms) <= _LITERAL_ENGINE_MAX_TERMS:\n                self.engine = "literal"\n            else:\n                self.automaton = _build_automaton(self.terms)\n                if self.automaton is not None:\n                    self.engine = "aho-corasick"\n                else:\n                    try:\n                        self.pure_ac = _PureAhoCorasick(self.terms)\n                        self.engine = "ac-python"\n                    except Exception:  # noqa: BLE001 - 自动机构建失败不是致命错误\n                        self.engine = "literal"\n        else:\n''',
          )
          replace_once(
              matcher,
              '''        if self.terms is not None:\n            hits = {t for t in self.terms if t in text}\n            if not hits:\n                return False, None, set()\n            # 统一按文本位置序取第一个（与 AC 一致，不依赖词表顺序）\n            first = min(hits, key=lambda t: text.index(t))\n            return True, first, hits\n''',
              '''        if self.terms is not None:\n            if len(self.terms) == 1:\n                term = self.terms[0]\n                if term not in text:\n                    return False, None, set()\n                return True, term, {term}\n            hits = {t for t in self.terms if t in text}\n            if not hits:\n                return False, None, set()\n            # 统一按文本位置序取第一个（与 AC 一致，不依赖词表顺序）\n            first = min(hits, key=lambda t: text.index(t))\n            return True, first, hits\n''',
          )

          candidates = Path('src/tracecite_core/candidate_search.py')
          replace_once(
              candidates,
              '''    literal_matcher = matcher if matcher.terms is not None else None\n    anchor_re = None if literal_matcher is not None else _anchor_regex(matcher, anchors)\n    with Path(path).open("r", encoding=encoding, errors="replace") as handle:\n        for total_lines, line in enumerate(handle, start=1):\n            matched = (\n                literal_matcher.match(line)[0]\n                if literal_matcher is not None\n                else bool(anchor_re and anchor_re.search(line))\n            )\n''',
              '''    literal_terms = tuple(matcher.terms or ())\n    single_literal = literal_terms[0] if len(literal_terms) == 1 else None\n    anchor_re = None if literal_terms else _anchor_regex(matcher, anchors)\n    with Path(path).open("r", encoding=encoding, errors="replace") as handle:\n        for total_lines, line in enumerate(handle, start=1):\n            if single_literal is not None:\n                matched = single_literal in line\n            elif literal_terms:\n                matched = any(term in line for term in literal_terms)\n            else:\n                matched = bool(anchor_re and anchor_re.search(line))\n''',
          )
          replace_once(
              candidates,
              '''        strategy="literal" if literal_matcher is not None else "required-literal",\n''',
              '''        strategy="literal" if literal_terms else "required-literal",\n''',
          )

          tests = Path('tests/test_matcher.py')
          text = tests.read_text(encoding='utf-8')
          text = text.replace(
              '''class TestAcPythonFallback:\n    """pyahocorasick 缺失时自动回落 ac-python，且语义与 re 一致。"""\n''',
              '''class TestAcPythonFallback:\n    """Small literal sets stay in C substring search; large sets retain AC fallback."""\n''',
          )
          text = text.replace(
              '''    def test_engine_falls_back_to_ac_python(self):\n        matcher = self._matcher_without_c_lib(pattern_from_terms(["login", "timeout"]))\n        assert matcher.engine == "ac-python"\n\n    def test_ac_python_equivalent_to_regex(self):\n        matcher = self._matcher_without_c_lib(pattern_from_terms(["login", "timeout"]))\n''',
              '''    def test_small_term_set_prefers_literal_engine(self):\n        matcher = self._matcher_without_c_lib(pattern_from_terms(["login", "timeout"]))\n        assert matcher.engine == "literal"\n\n    def test_large_term_set_falls_back_to_ac_python(self):\n        terms = [f"marker-{index}" for index in range(16)]\n        matcher = self._matcher_without_c_lib(pattern_from_terms(terms))\n        assert matcher.engine == "ac-python"\n\n    def test_literal_small_set_equivalent_to_regex(self):\n        matcher = self._matcher_without_c_lib(pattern_from_terms(["login", "timeout"]))\n''',
          )
          tests.write_text(text, encoding='utf-8')

          perf_test = Path('tests/test_search_cost_regressions.py')
          text = perf_test.read_text(encoding='utf-8')
          text += '''\n\ndef test_single_literal_candidate_scan_does_not_call_full_matcher_per_source_line(tmp_path: Path, monkeypatch) -> None:\n    from tracecite_core.candidate_search import scan_candidate_lines\n    from tracecite_core.matcher import Matcher\n\n    source = tmp_path / "large.log"\n    source.write_text("noise\\n" * 1000 + "needle here\\n", encoding="utf-8")\n    matcher = Matcher("needle")\n    assert matcher.engine == "literal"\n\n    calls = 0\n    original = matcher.match\n\n    def counted(value: str):\n        nonlocal calls\n        calls += 1\n        return original(value)\n\n    monkeypatch.setattr(matcher, "match", counted)\n    scan = scan_candidate_lines(source, matcher, capture_lines=True)\n    assert scan is not None\n    assert scan.line_numbers == frozenset({1001})\n    assert calls == 0\n'''
          perf_test.write_text(text, encoding='utf-8')
          PY

      - name: Install and run focused tests
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q \
            tests/test_matcher.py \
            tests/test_candidate_first_filter.py \
            tests/test_search_cost_regressions.py

      - name: Commit hot-path optimization
        run: |
          git rm .github/workflows/search-cost-v2-literal-hotpath.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src tests
          git commit -m 'use C literal search for small candidate queries'
          git push origin HEAD:experiment/evidence-intelligence-search-cost-v2
