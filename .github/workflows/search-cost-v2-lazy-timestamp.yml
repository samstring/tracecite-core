name: Search Cost V2 Lazy Timestamp

on:
  push:
    branches:
      - experiment/evidence-intelligence-search-cost-v2
    paths:
      - .github/workflows/search-cost-v2-lazy-timestamp.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: experiment/evidence-intelligence-search-cost-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Patch lazy JSON timestamp parsing for unscoped Agent search
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(rel: str, old: str, new: str) -> None:
              path = Path(rel)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise RuntimeError(f'block not found in {rel}: {old[:120]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/tracecite_core/segmenter.py',
              '''    def __init__(self, time_field=None, level_field=None, msg_field=None):\n        self._time_field = time_field\n        self._level_field = level_field\n        self._msg_field = msg_field\n''',
              '''    def __init__(\n        self,\n        time_field=None,\n        level_field=None,\n        msg_field=None,\n        *,\n        parse_timestamps: bool = True,\n    ):\n        self._time_field = time_field\n        self._level_field = level_field\n        self._msg_field = msg_field\n        self._parse_timestamps = bool(parse_timestamps)\n\n    def with_timestamp_parsing(self, enabled: bool) -> "JsonLineSegmenter":\n        """Clone this JSONL segmenter with timestamp parsing toggled."""\n        return JsonLineSegmenter(\n            time_field=self._time_field,\n            level_field=self._level_field,\n            msg_field=self._msg_field,\n            parse_timestamps=enabled,\n        )\n''',
          )
          replace_once(
              'src/tracecite_core/segmenter.py',
              '''            if ts is not None:\n                raw_timestamp = ts\n''',
              '''            if ts is not None and self._parse_timestamps:\n                raw_timestamp = ts\n''',
          )
          replace_once(
              'src/tracecite_core/segmenter.py',
              '''            level_keys = (self._level_field,) if self._level_field else _JSON_LEVEL_KEYS\n''',
              '''            if ts is not None and not self._parse_timestamps:\n                ts = None\n            level_keys = (self._level_field,) if self._level_field else _JSON_LEVEL_KEYS\n''',
          )

          replace_once(
              'src/tracecite_core/candidate_filter.py',
              '''from .segmenter import RawTextSegmenter, Segmenter\n''',
              '''from .segmenter import JsonLineSegmenter, RawTextSegmenter, Segmenter\n''',
          )
          replace_once(
              'src/tracecite_core/candidate_filter.py',
              '''    max_line_chars: Optional[int] = _legacy.DEFAULT_MAX_LINE_CHARS,\n) -> FilterResult:\n''',
              '''    max_line_chars: Optional[int] = _legacy.DEFAULT_MAX_LINE_CHARS,\n    parse_record_timestamps: bool = True,\n) -> FilterResult:\n''',
          )
          replace_once(
              'src/tracecite_core/candidate_filter.py',
              '''    candidate_first = candidate_scan is not None\n\n    work_total_lines = (\n''',
              '''    candidate_first = candidate_scan is not None\n    record_segmenter = selected_segmenter\n    if (\n        candidate_first\n        and not parse_record_timestamps\n        and isinstance(selected_segmenter, JsonLineSegmenter)\n    ):\n        record_segmenter = selected_segmenter.with_timestamp_parsing(False)\n\n    work_total_lines = (\n''',
          )
          replace_once(
              'src/tracecite_core/candidate_filter.py',
              '''            selected_segmenter,\n            candidate_scan.line_numbers,\n            encoding=encoding,\n            captured_lines=candidate_scan.captured_lines,\n''',
              '''            record_segmenter,\n            candidate_scan.line_numbers,\n            encoding=encoding,\n            captured_lines=candidate_scan.captured_lines,\n''',
          )
          replace_once(
              'src/tracecite_core/candidate_filter.py',
              '''            ts = _legacy.record_timestamp(\n                record, ref=ref, segmenter=selected_segmenter\n            )\n''',
              '''            ts = (\n                _legacy.record_timestamp(\n                    record, ref=ref, segmenter=record_segmenter\n                )\n                if parse_record_timestamps\n                else None\n            )\n''',
          )

          replace_once(
              'src/tracecite/runtime/tools.py',
              '''            template_threshold=10 if fold else 0,\n            max_line_chars=max_line_chars,\n        )\n''',
              '''            template_threshold=10 if fold else 0,\n            max_line_chars=max_line_chars,\n            # Evidence identity is SHA + line range; unscoped Agent search does\n            # not need to normalize every JSON timestamp. Time-scoped/folded\n            # searches keep historical timestamp parsing semantics.\n            parse_record_timestamps=bool(last or since or until or fold),\n        )\n''',
          )
          PY

      - name: Add focused regressions
        run: |
          cat > tests/test_lazy_timestamp_search.py <<'PYTEST'
          from __future__ import annotations

          from pathlib import Path

          from tracecite.runtime import tools
          from tracecite_core import filter_text
          from tracecite_core.segmenter import JsonLineSegmenter
          import tracecite_core.segmenter as segmenter_module


          def test_unscoped_agent_json_search_skips_timestamp_fallback_parsing(tmp_path: Path, monkeypatch) -> None:
              source = tmp_path / "events.jsonl"
              source.write_text(
                  '{"timestamp":"definitely-not-a-time","message":"needle"}\n' * 20,
                  encoding="utf-8",
              )
              calls = 0
              original = segmenter_module._strptime_timestamp

              def counted(raw: str, fmt: str):
                  nonlocal calls
                  calls += 1
                  return original(raw, fmt)

              monkeypatch.setattr(segmenter_module, "_strptime_timestamp", counted)
              result = tools.search(
                  source, "needle", snapshot=False, segmenter="jsonline", cache=False
              )
              assert result["status"] == "ok"
              assert result["coverage"]["match_records"] == 20
              assert calls == 0
              assert all(item.get("timestamp") is None for item in result["evidence"])


          def test_core_json_filter_default_keeps_timestamp_parsing_semantics(tmp_path: Path, monkeypatch) -> None:
              source = tmp_path / "events.jsonl"
              source.write_text(
                  '{"timestamp":"definitely-not-a-time","message":"needle"}\n',
                  encoding="utf-8",
              )
              calls = 0
              original = segmenter_module._strptime_timestamp

              def counted(raw: str, fmt: str):
                  nonlocal calls
                  calls += 1
                  return original(raw, fmt)

              monkeypatch.setattr(segmenter_module, "_strptime_timestamp", counted)
              result = filter_text(
                  source, pattern="needle", snapshot=False, segmenter=JsonLineSegmenter()
              )
              assert result.match_records == 1
              assert calls > 0
          PYTEST

      - name: Install and run focused tests
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q \
            tests/test_lazy_timestamp_search.py \
            tests/test_search_cost_regressions.py \
            tests/test_candidate_first_filter.py \
            tests/test_text_filter_time_scope.py \
            tests/test_text_filter_enhancements.py \
            tests/test_runtime_agent_api.py \
            tests/test_runtime_schema_tools.py

      - name: Commit optimization
        run: |
          git rm .github/workflows/search-cost-v2-lazy-timestamp.yml
          git rm .github/workflows/search-cost-v2-cprofile.yml || true
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src tests
          git commit -m 'defer JSON timestamp parsing for unscoped Agent search'
          git push origin HEAD:experiment/evidence-intelligence-search-cost-v2
