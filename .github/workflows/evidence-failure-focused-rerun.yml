name: Evidence Failure Focused Rerun
# Validate evidence-contract closure on the two previously failing correctness cases.

on:
  push:
    branches:
      - experiment/evidence-intelligence
    paths:
      - .github/workflows/evidence-failure-focused-rerun.yml
      - benchmarks/agent-investigation/gmi_evidence_contract_host.py
      - benchmarks/agent-investigation/gmi_canonical_host.py
      - benchmarks/agent-investigation/run_paired_retry.py
      - src/tracecite/runtime/**
      - tests/test_gmi_evidence_contract_host.py
      - tests/test_test_assessment.py
      - tests/test_finding_validation.py

permissions:
  contents: read

jobs:
  paired:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - id: flutter-179398-repair-v2
            dir: benchmarks/agent-investigation/cases/flutter-179398
            scorer: legacy
          - id: kubernetes-140268-repair-v2
            dir: benchmarks/agent-investigation/scale-cases/kubernetes-140268
            scorer: root
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.TRACECITE_BENCH_BASE_URL || 'https://api.gmi-serving.com/v1' }}
      BENCH_MODEL: ${{ vars.TRACECITE_BENCH_MODEL }}
      TRACECITE_BENCH_MAX_OUTPUT_TOKENS: "1800"
      TRACECITE_BENCH_MAX_ROUNDS: "12"
      TRACECITE_BENCH_NO_GROWTH_ROUNDS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TraceCite
        run: python -m pip install -e ".[dev]"
      - name: Install ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ripgrep
          fi
      - name: Prepare evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/tmp/focused-repair-${{ matrix.id }}"
          PREP="$ROOT/prepared"
          RESULT="$ROOT/result"
          rm -rf "$ROOT" && mkdir -p "$PREP" "$RESULT"
          python -m tracecite.benchmarking validate "${{ matrix.dir }}" > "$RESULT/validate.json"
          python -m tracecite.benchmarking prepare "${{ matrix.dir }}" --work-dir "$PREP" > "$RESULT/prepare.json"
          PREPARED="$(find "$PREP" -name prepared.json -type f -print -quit)"
          test -n "$PREPARED"
          echo "RESULT=$RESULT" >> "$GITHUB_ENV"
          echo "PREPARED=$PREPARED" >> "$GITHUB_ENV"
      - name: Run evidence-contract pair
        shell: bash
        run: |
          python benchmarks/agent-investigation/run_paired_retry.py \
            "${{ matrix.dir }}" "$PREPARED" \
            --case-id "${{ matrix.id }}" \
            --scorer "${{ matrix.scorer }}" \
            --model "$BENCH_MODEL" \
            --result-dir "$RESULT" \
            --host-script benchmarks/agent-investigation/gmi_evidence_contract_host.py \
            --retry-delay-seconds 120 \
            --timeout-seconds 900
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-${{ matrix.id }}
          path: /tmp/focused-repair-${{ matrix.id }}/result
          if-no-files-found: warn
      - name: Enforce focused correctness gate
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          pair_path = Path(os.environ["RESULT"]) / "pair.json"
          if not pair_path.is_file():
              raise SystemExit(f"missing focused result: {pair_path}")

          payload = json.loads(pair_path.read_text(encoding="utf-8"))
          outcomes = {
              str(item.get("mode")): item
              for item in payload.get("outcomes", [])
              if isinstance(item, dict)
          }
          free_shell = outcomes.get("free_shell") or {}
          tracecite = outcomes.get("tracecite") or {}

          print(
              "focused outcome:",
              json.dumps(
                  {
                      "case_id": payload.get("case_id"),
                      "free_shell": {
                          "run_status": free_shell.get("run_status"),
                          "passed": free_shell.get("passed"),
                          "primary_quality": free_shell.get("primary_quality"),
                      },
                      "tracecite": {
                          "run_status": tracecite.get("run_status"),
                          "passed": tracecite.get("passed"),
                          "primary_quality": tracecite.get("primary_quality"),
                      },
                  },
                  sort_keys=True,
              ),
          )

          if tracecite.get("run_status") not in {"ok", "incomplete"}:
              raise SystemExit("TraceCite arm did not complete")
          if tracecite.get("passed") is not True:
              raise SystemExit("focused repair unresolved: TraceCite correctness is not PASS")
          if free_shell.get("passed") is True and tracecite.get("passed") is not True:
              raise SystemExit("no-harm regression: free-shell PASS while TraceCite is not PASS")
          PY
