name: Evidence Failure Repair 2 Once

on:
  push:
    branches:
      - experiment/evidence-intelligence
    paths:
      - .github/workflows/evidence-failure-repair-2-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/evidence-intelligence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply bounded-source, identity-selection, and scorer repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) BOUNDED SourceTarget must return representative navigation context,
          # not a metadata-only probe. Keep this observation bounded and non-causal.
          p = Path('src/tracecite/runtime/retrieve_contract.py')
          s = p.read_text()
          s = s.replace(
              '_TRANSPORT_ONLY_OPERATIONS = frozenset({"probe", "search", "expand", "survey", "retrieve"})\n',
              '_TRANSPORT_ONLY_OPERATIONS = frozenset({"probe", "sample", "search", "expand", "survey", "retrieve"})\n'
              '_BOUNDED_SOURCE_SAMPLE_RECORDS = 16\n'
              '_BOUNDED_SOURCE_SAMPLE_CHARS = 12_000\n'
          )
          anchor = '''def _investigate_source(\n    request: EvidenceRequest,\n    decision: RoutingDecision,\n    policy: EvidenceRoutingPolicy,\n) -> RetrievalResult:\n'''
          if anchor not in s:
              raise SystemExit('investigate-source anchor not found')
          helper = '''def _bounded_source(\n    request: EvidenceRequest,\n    decision: RoutingDecision,\n) -> RetrievalResult:\n    """Return deterministic representative context for a bounded source inspection.\n\n    A metadata-only probe leaves the Agent blind on sources just above the\n    direct-context budget. Uniform bounded sampling exposes source structure and\n    navigation landmarks without diagnosing, ranking, or dumping the source.\n    ``snapshot=False`` keeps this a cheap navigation observation; exact evidence\n    remains recoverable through RangeTarget materialization.\n    """\n\n    assert isinstance(request.target, SourceTarget)\n    target = request.target\n    path = Path(target.source).expanduser().resolve()\n    if not path.is_file() or path.stat().st_size == 0:\n        return _with_routing(_retrieve(request), decision)\n\n    tracker = _restore_progress(request.investigation_path)\n    result = _tools.sample(\n        path,\n        strategy="uniform",\n        count=_BOUNDED_SOURCE_SAMPLE_RECORDS,\n        max_chars=_BOUNDED_SOURCE_SAMPLE_CHARS,\n        snapshot=False,\n        segmenter=target.segmenter,\n        investigation_path=request.investigation_path,\n        hypothesis_id=request.hypothesis_id,\n        test_id=request.test_id,\n        cache=request.cache,\n    )\n    readiness, new_rows, repeated = _observe_tool_result(tracker, result)\n    canonical = dict(result)\n    data = dict(canonical.get("data") or {})\n    data["navigation_only"] = True\n    data["navigation_note"] = (\n        "Uniform bounded source samples are navigation landmarks only; materialize "\n        "the relevant line range before treating it as cited Evidence."\n    )\n    canonical["data"] = data\n    resolved = RetrievalResult(\n        operation="sample",\n        status=str(canonical.get("status") or "unknown"),\n        canonical_result=canonical,\n        progress=readiness,\n        new_evidence=new_rows,\n        repeated_evidence=repeated,\n    )\n    return _with_routing(resolved, decision)\n\n\n'''
          s = s.replace(anchor, helper + anchor)
          old = '''        if decision.route == EvidenceRoute.INVESTIGATE:\n            return _investigate_source(request, decision, policy)\n        return _with_routing(_retrieve(request), decision)\n'''
          new = '''        if decision.route == EvidenceRoute.INVESTIGATE:\n            return _investigate_source(request, decision, policy)\n        return _bounded_source(request, decision)\n'''
          if old not in s:
              raise SystemExit('SourceTarget bounded branch not found')
          s = s.replace(old, new)
          p.write_text(s)

          # 2) Identity verification: bounded sibling output should prioritize
          # entities physically nearest to directly associated identifier evidence,
          # rather than whichever names/first occurrences happen to sort first.
          p = Path('src/tracecite/runtime/evidence_ambiguity.py')
          s = p.read_text()
          old = '''                            siblings[entity] = {\n                                "entity": entity,\n                                "scope": f"{scope}/",\n                                "occurrence_count": 0,\n                                "references": [],\n                                "first_line": number,\n                            }\n                        row = siblings[entity]\n                        row["occurrence_count"] += 1\n                        if len(row["references"]) < reference_limit:\n                            row["references"].append(f"{path.name}:{number}")\n'''
          new = '''                            siblings[entity] = {\n                                "entity": entity,\n                                "scope": f"{scope}/",\n                                "occurrence_count": 0,\n                                "references": [],\n                                "first_line": number,\n                                "last_line": number,\n                            }\n                        row = siblings[entity]\n                        row["occurrence_count"] += 1\n                        row["last_line"] = number\n                        if len(row["references"]) < reference_limit:\n                            row["references"].append(f"{path.name}:{number}")\n                        elif reference_limit > 1:\n                            # Preserve early provenance plus the most recent\n                            # occurrence so bounded selection can retain nearby\n                            # late-stage siblings without storing every match.\n                            row["references"][-1] = f"{path.name}:{number}"\n'''
          if old not in s:
              raise SystemExit('sibling scan block not found')
          s = s.replace(old, new)
          old = '''                        entities[entity] = {\n                            "entity": entity,\n                            "scope": scope,\n                            "occurrence_count": 0,\n                            "references": [],\n                            "first_line": entity_line,\n                        }\n                    row = entities[entity]\n                    row["occurrence_count"] += 1\n                    if len(row["references"]) < reference_limit:\n                        row["references"].append(\n                            {\n                                "entity_ref": f"{path.name}:{entity_line}",\n                                "identifier_ref": f"{path.name}:{number}",\n                            }\n                        )\n'''
          new = '''                        entities[entity] = {\n                            "entity": entity,\n                            "scope": scope,\n                            "occurrence_count": 0,\n                            "references": [],\n                            "first_line": entity_line,\n                            "last_line": entity_line,\n                        }\n                    row = entities[entity]\n                    row["occurrence_count"] += 1\n                    row["last_line"] = entity_line\n                    reference = {\n                        "entity_ref": f"{path.name}:{entity_line}",\n                        "identifier_ref": f"{path.name}:{number}",\n                    }\n                    if len(row["references"]) < reference_limit:\n                        row["references"].append(reference)\n                    elif reference_limit > 1:\n                        row["references"][-1] = reference\n'''
          if old not in s:
              raise SystemExit('entity scan block not found')
          s = s.replace(old, new)
          old = '''        siblings = sorted(\n            slot["siblings"].values(),\n            key=lambda row: (int(row["first_line"]), str(row["entity"])),\n        )\n        entity_count = len(ordered)\n'''
          new = '''        anchor_lines = [\n            line\n            for row in ordered\n            for line in (int(row["first_line"]), int(row.get("last_line") or row["first_line"]))\n        ]\n        def _sibling_distance(row: dict[str, Any]) -> tuple[int, int, str]:\n            first = int(row["first_line"])\n            last = int(row.get("last_line") or first)\n            if not anchor_lines:\n                return (0, first, str(row["entity"]))\n            distance = min(\n                abs(candidate - anchor)\n                for candidate in (first, last)\n                for anchor in anchor_lines\n            )\n            return (distance, first, str(row["entity"]))\n\n        siblings = sorted(slot["siblings"].values(), key=_sibling_distance)\n        entity_count = len(ordered)\n'''
          if old not in s:
              raise SystemExit('sibling sorting block not found')
          s = s.replace(old, new)
          s = s.replace(
              '{key: value for key, value in row.items() if key != "first_line"}',
              '{key: value for key, value in row.items() if key not in {"first_line", "last_line"}}',
          )
          old = '''                "sibling_entity_count_observed": sibling_count,\n                "sibling_entities": [\n'''
          new = '''                "sibling_entity_count_observed": sibling_count,\n                "sibling_selection_basis": "nearest_to_direct_identifier_association",\n                "sibling_entities": [\n'''
          if old not in s:
              raise SystemExit('sibling output block not found')
          s = s.replace(old, new)
          p.write_text(s)

          # 3) Benchmark pass/fail must use the same precision that is reported.
          p = Path('src/tracecite/benchmarking.py')
          s = p.read_text()
          old = '''    min_concepts = float(thresholds.get("concept_recall", 1.0))\n    min_evidence = float(thresholds.get("evidence_marker_recall", 0.0))\n    passed = bool(answer.strip()) and concept_recall >= min_concepts and evidence_recall >= min_evidence\n'''
          new = '''    min_concepts = float(thresholds.get("concept_recall", 1.0))\n    min_evidence = float(thresholds.get("evidence_marker_recall", 0.0))\n    reported_concept_recall = round(concept_recall, 4)\n    reported_evidence_recall = round(evidence_recall, 4)\n    passed = (\n        bool(answer.strip())\n        and reported_concept_recall >= min_concepts\n        and reported_evidence_recall >= min_evidence\n    )\n'''
          if old not in s:
              raise SystemExit('benchmark threshold block not found')
          s = s.replace(old, new)
          s = s.replace('"concept_recall": round(concept_recall, 4),\n            "evidence_marker_recall": round(evidence_recall, 4),',
                        '"concept_recall": reported_concept_recall,\n            "evidence_marker_recall": reported_evidence_recall,')
          p.write_text(s)

          # Routing regression: bounded first source now has representative content.
          p = Path('tests/test_evidence_routing.py')
          s = p.read_text()
          old = '''def test_large_first_source_uses_bounded_probe_instead_of_direct_dump(tmp_path) -> None:\n    source = tmp_path / "large.log"\n    source.write_text("x" * 12_000 + "\\n", encoding="utf-8")\n    state_path = tmp_path / "investigation.json"\n    InvestigationStore(state_path).create("inspect large source")\n\n    result = retrieve(\n        EvidenceRequest(SourceTarget(source), investigation_path=state_path),\n        routing_policy=EvidenceRoutingPolicy(\n            fallback_direct_chars=2_000,\n            max_direct_chars=2_000,\n        ),\n    )\n    payload = result.to_dict()\n\n    assert result.operation == "probe"\n    assert payload["data"]["routing"]["mode"] == "bounded"\n    assert "direct_output_exceeds_budget" in payload["data"]["routing"]["reasons"]\n    assert "text" not in payload["data"]\n'''
          new = '''def test_large_first_source_uses_bounded_uniform_navigation_sample(tmp_path) -> None:\n    source = tmp_path / "large.log"\n    rows = [f"record {index}" for index in range(160)]\n    rows[80] = "MIDPOINT_STRUCTURAL_LANDMARK"\n    source.write_text("\\n".join(rows) + "\\n", encoding="utf-8")\n    state_path = tmp_path / "investigation.json"\n    InvestigationStore(state_path).create("inspect large source")\n\n    result = retrieve(\n        EvidenceRequest(SourceTarget(source), investigation_path=state_path),\n        routing_policy=EvidenceRoutingPolicy(\n            fallback_direct_chars=200,\n            max_direct_chars=200,\n        ),\n    )\n    payload = result.to_dict()\n\n    assert result.operation == "sample"\n    assert payload["data"]["routing"]["mode"] == "bounded"\n    assert "direct_output_exceeds_budget" in payload["data"]["routing"]["reasons"]\n    assert payload["data"]["strategy"] == "uniform"\n    assert payload["data"]["navigation_only"] is True\n    assert payload["coverage"]["sampled_records"] == 16\n    assert payload["coverage"]["returned_chars"] <= 12_000\n    assert payload["data"]["samples"]\n'''
          if old not in s:
              raise SystemExit('routing regression block not found')
          p.write_text(s.replace(old, new))

          # Identity regression: a nearby late sibling must survive a small output cap.
          p = Path('tests/test_evidence_ambiguity.py')
          s = p.read_text()
          marker = '\ndef test_bounded_sibling_selection_prefers_entities_near_direct_identifier_evidence(tmp_path: Path) -> None:\n'
          if marker.strip() not in s:
              s += marker + '''    source = tmp_path / "evidence.log"\n    rows = [f"name: resource.example/widget-{1000 + i}" for i in range(1, 12)]\n    rows += ["noise"] * 80\n    rows += [\n        "name: resource.example/widget-9999",\n        "name: resource.example/widget-1001",\n        "resourceID: local-device",\n    ]\n    source.write_text("\\n".join(rows) + "\\n", encoding="utf-8")\n    visible = "\\n".join([\n        "name: resource.example/widget-1001",\n        "resourceID: local-device",\n    ])\n    result = verify_scoped_identity_gaps(\n        source,\n        visible,\n        expected_sha256=_sha256(source),\n        entity_limit=3,\n    )[0]\n    selected = [row["entity"] for row in result["sibling_entities"]]\n    assert "resource.example/widget-1001" in selected\n    assert "resource.example/widget-9999" in selected\n    assert result["sibling_selection_basis"] == "nearest_to_direct_identifier_association"\n'''
          p.write_text(s)

          # Metric precision regression: the displayed 2/3 == 0.6667 threshold must pass.
          p = Path('tests/test_agent_investigation_benchmark.py')
          s = p.read_text()
          marker = '\ndef test_score_threshold_uses_reported_four_decimal_precision(tmp_path: Path) -> None:\n'
          if marker.strip() not in s:
              s += marker + '''    transcript = tmp_path / "precision.jsonl"\n    events = [\n        {"type": "session", "mode": "tracecite_context", "model": "test-model"},\n        {"type": "tool", "tool": "search", "output": "DrawCircularArc round_superellipse_geometry.cc"},\n        {\n            "type": "final",\n            "answer": (\n                "Impeller RoundSuperellipse DrawCircularArc. A use-after-free lifetime bug left a poisoned pointer; "\n                "the crashed thread is not the corrupting thread and is only a downstream manifestation."\n            ),\n            "evidence": [],\n        },\n    ]\n    transcript.write_text("\\n".join(json.dumps(event) for event in events) + "\\n", encoding="utf-8")\n    result = score_transcript(FLUTTER_CASE, transcript)\n    assert result["quality"]["concept_recall"] == 1.0\n    assert result["quality"]["evidence_marker_recall"] == 0.6667\n    assert result["passed"] is True\n'''
          p.write_text(s)
          PY
      - name: Run deterministic regression suite
        run: |
          python -m pip install -e ".[dev]"
          pytest -q \
            tests/test_evidence_routing.py \
            tests/test_evidence_ambiguity.py \
            tests/test_retrieval_guidance.py \
            tests/test_agent_investigation_benchmark.py \
            tests/test_signal_hint_routing.py
          python -m tracecite.benchmarking validate benchmarks/agent-investigation/cases/flutter-179398
          python -m tracecite.benchmarking validate benchmarks/agent-investigation/scale-cases/kubernetes-140268
      - name: Commit repair and clean temporary workflows
        run: |
          rm -f .github/workflows/evidence-failure-repair-2-once.yml
          rm -f .github/workflows/evidence-failure-focused-rerun.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(evidence): seed bounded source navigation"
          git push origin HEAD:experiment/evidence-intelligence
