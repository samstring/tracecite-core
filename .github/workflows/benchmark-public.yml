name: Public Agent Benchmark Smoke

on:
  pull_request:
    branches: [feature_for_agent]
    paths:
      - "benchmarks/agent-investigation/**"
      - "src/tracecite/benchmarking.py"
      - "src/tracecite/integrations/context_engine.py"
      - "src/tracecite/integrations/stateful_cli.py"
      - ".github/workflows/benchmark-public.yml"
  workflow_dispatch:

jobs:
  case-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        case:
          - kubernetes-140848
          - flutter-179398
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install package
        run: python -m pip install -e .
      - name: Validate leak-free case
        run: >-
          python -m tracecite.benchmarking validate
          benchmarks/agent-investigation/cases/${{ matrix.case }}
      - name: Download and hash public source input
        run: >-
          python -m tracecite.benchmarking prepare
          benchmarks/agent-investigation/cases/${{ matrix.case }}
          --work-dir /tmp/tracecite-public-inputs

  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        case:
          - kubernetes-140848
          - flutter-179398
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install package
        run: python -m pip install -e .
      - name: Install shell baseline dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          rg --version
      - name: Validate leak-free case
        run: >-
          python -m tracecite.benchmarking validate
          benchmarks/agent-investigation/cases/${{ matrix.case }}
      - name: Download public source input
        run: >-
          python -m tracecite.benchmarking prepare
          benchmarks/agent-investigation/cases/${{ matrix.case }}
          --work-dir /tmp/tracecite-public-bench
      - name: Run two-turn Context Engine smoke
        run: >-
          python benchmarks/agent-investigation/public_smoke.py
          /tmp/tracecite-public-bench/${{ matrix.case }}/prepared.json
          --output /tmp/tracecite-public-bench/${{ matrix.case }}/report.json
      - name: Show report
        run: cat /tmp/tracecite-public-bench/${{ matrix.case }}/report.json
