name: Pi Agent Real Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/evidence-intelligence
    paths:
      - .github/workflows/pi-agent-real-benchmark.yml
      - benchmarks/agent-investigation/pi_session_to_transcript.py
      - benchmarks/agent-investigation/scale-cases/kubernetes-140268/**
      - src/tracecite/**

permissions:
  contents: read

jobs:
  kubernetes-140268:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.TRACECITE_BENCH_BASE_URL || 'https://api.gmi-serving.com/v1' }}
      BENCH_MODEL: ${{ vars.TRACECITE_BENCH_MODEL }}
      PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-agent-config
      PI_SKIP_VERSION_CHECK: "1"
      PI_TELEMETRY: "0"
      CASE_DIR: benchmarks/agent-investigation/scale-cases/kubernetes-140268
      RESULT: ${{ runner.temp }}/pi-real-kubernetes-140268
      PREP: ${{ runner.temp }}/pi-real-kubernetes-140268/prepared
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install real Pi coding agent
        run: |
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.84.4
          pi --version

      - name: Install ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ripgrep
          fi

      - name: Configure GMI model for Pi
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PI_CODING_AGENT_DIR"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          target = Path(os.environ["PI_CODING_AGENT_DIR"]) / "models.json"
          model = os.environ["BENCH_MODEL"]
          if not model:
              raise SystemExit("BENCH_MODEL is empty")
          payload = {
              "providers": {
                  "gmi": {
                      "name": "GMI OpenAI-compatible",
                      "baseUrl": os.environ["OPENAI_BASE_URL"],
                      "api": "openai-completions",
                      "models": [
                          {
                              "id": model,
                              "name": model,
                              "reasoning": False,
                              "input": ["text"],
                              "cost": {
                                  "input": 0,
                                  "output": 0,
                                  "cacheRead": 0,
                                  "cacheWrite": 0,
                              },
                              "contextWindow": 1_000_000,
                              "maxTokens": 1_800,
                              "compat": {
                                  "supportsDeveloperRole": False,
                                  "supportsReasoningEffort": False,
                              },
                          }
                      ],
                  }
              }
          }
          target.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"wrote {target}")
          PY
          pi --provider gmi --list-models "$BENCH_MODEL"

      - name: Prepare Kubernetes evidence without installing TraceCite CLI
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RESULT"
          mkdir -p "$RESULT" "$PREP"
          PYTHONPATH="$GITHUB_WORKSPACE/src" python -m tracecite.root_cause_benchmarking validate "$CASE_DIR" > "$RESULT/validate.json"
          PYTHONPATH="$GITHUB_WORKSPACE/src" python -m tracecite.root_cause_benchmarking prepare "$CASE_DIR" --work-dir "$PREP" > "$RESULT/prepare.json"
          PREPARED="$(find "$PREP" -name prepared.json -type f -print -quit)"
          test -n "$PREPARED"
          python - "$PREPARED" >> "$GITHUB_ENV" <<'PY'
          import json
          import sys
          from pathlib import Path

          prepared = Path(sys.argv[1])
          payload = json.loads(prepared.read_text(encoding="utf-8"))
          inputs = payload.get("inputs") or []
          if len(inputs) != 1:
              raise SystemExit(f"expected one input, got {len(inputs)}")
          input_path = Path(inputs[0]["path"]).resolve()
          print(f"PREPARED={prepared}")
          print(f"INPUT_ROOT={input_path.parent}")
          print(f"INPUT_FILE={input_path.name}")
          print(f"QUESTION_FILE={Path(payload['question']).resolve()}")
          PY

      - name: Run real Pi baseline with native tools
        shell: bash
        run: |
          set -euo pipefail
          QUESTION="$(cat "$QUESTION_FILE")"
          SYSTEM_PROMPT=$(cat <<'EOF'
          You are a real coding agent investigating one supplied CI log. Use only evidence from files in the current working directory; do not use external knowledge. You own hypotheses, causal reasoning, and the final conclusion. Use native read, grep, find, ls, and bash tools as needed. Keep exploration bounded. Every material factual claim in the final answer must cite exact line numbers you actually observed, preferably as build-log.txt:L123. Distinguish direct observation from inference. Answer the user's questions directly.
          EOF
          )
          mkdir -p "$RESULT/pi-baseline-session"
          cd "$INPUT_ROOT"
          set +e
          timeout 900s pi \
            --provider gmi \
            --model "$BENCH_MODEL" \
            --api-key "$OPENAI_API_KEY" \
            --thinking off \
            --mode text \
            --print \
            --session-dir "$RESULT/pi-baseline-session" \
            --tools read,bash,grep,find,ls \
            --no-extensions \
            --no-skills \
            --no-prompt-templates \
            --no-context-files \
            --system-prompt "$SYSTEM_PROMPT" \
            "$QUESTION" \
            > "$RESULT/pi-baseline-answer.md" 2> "$RESULT/pi-baseline-stderr.log"
          code=$?
          set -e
          echo "$code" > "$RESULT/pi-baseline-exit.txt"
          cat "$RESULT/pi-baseline-answer.md"

      - name: Install TraceCite for Pi additive arm
        run: python -m pip install -e ".[dev]"

      - name: Run real Pi with TraceCite CLI available
        shell: bash
        run: |
          set -euo pipefail
          QUESTION="$(cat "$QUESTION_FILE")"
          SYSTEM_PROMPT=$(cat <<'EOF'
          You are a real coding agent investigating one supplied CI log. Use only evidence from files in the current working directory; do not use external knowledge. You own hypotheses, causal reasoning, and the final conclusion. Native read, grep, find, ls, and bash tools are available. In addition, the `tracecite` CLI is available through bash as a deterministic evidence-retrieval tool; TraceCite is not a reasoner and its output is not root-cause truth. On this large log, prefer bounded TraceCite searches when useful, for example: `tracecite search build-log.txt "query" --no-snapshot --compact --max-evidence 20 --max-output-chars 16000 --lightweight`. You may still use native tools when they are better. Keep exploration bounded. Every material factual claim in the final answer must cite exact line numbers you actually observed, preferably as build-log.txt:L123. Distinguish direct observation from inference. Answer the user's questions directly.
          EOF
          )
          mkdir -p "$RESULT/pi-tracecite-session"
          cd "$INPUT_ROOT"
          set +e
          timeout 900s pi \
            --provider gmi \
            --model "$BENCH_MODEL" \
            --api-key "$OPENAI_API_KEY" \
            --thinking off \
            --mode text \
            --print \
            --session-dir "$RESULT/pi-tracecite-session" \
            --tools read,bash,grep,find,ls \
            --no-extensions \
            --no-skills \
            --no-prompt-templates \
            --no-context-files \
            --system-prompt "$SYSTEM_PROMPT" \
            "$QUESTION" \
            > "$RESULT/pi-tracecite-answer.md" 2> "$RESULT/pi-tracecite-stderr.log"
          code=$?
          set -e
          echo "$code" > "$RESULT/pi-tracecite-exit.txt"
          cat "$RESULT/pi-tracecite-answer.md"

      - name: Convert Pi sessions and score both arms
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for arm in baseline tracecite; do
            SESSION_DIR="$RESULT/pi-${arm}-session"
            ANSWER="$RESULT/pi-${arm}-answer.md"
            SESSION="$(find "$SESSION_DIR" -type f -name '*.jsonl' -print -quit 2>/dev/null || true)"
            if [[ -z "$SESSION" || ! -f "$ANSWER" ]]; then
              echo "missing session or answer for $arm" > "$RESULT/pi-${arm}-score-error.txt"
              continue
            fi
            python benchmarks/agent-investigation/pi_session_to_transcript.py \
              "$SESSION" "$ANSWER" "$RESULT/pi-${arm}-transcript.jsonl" \
              --mode "pi-${arm}" --model "$BENCH_MODEL"
            python -m tracecite.root_cause_benchmarking score \
              "$CASE_DIR" "$RESULT/pi-${arm}-transcript.jsonl" \
              > "$RESULT/pi-${arm}-score.json" || true
          done
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = Path(os.environ["RESULT"])
          summary = {"pi_version": None, "model": os.environ.get("BENCH_MODEL"), "arms": {}}
          for arm in ("baseline", "tracecite"):
              row = {"exit_code": None, "passed": None, "dimension_recall": None, "supported_dimension_recall": None, "citation_accuracy": None}
              exit_path = result / f"pi-{arm}-exit.txt"
              if exit_path.is_file():
                  row["exit_code"] = int(exit_path.read_text().strip())
              score_path = result / f"pi-{arm}-score.json"
              if score_path.is_file():
                  score = json.loads(score_path.read_text(encoding="utf-8"))
                  row["passed"] = score.get("passed")
                  quality = score.get("quality") or {}
                  row["dimension_recall"] = quality.get("dimension_recall")
                  row["supported_dimension_recall"] = quality.get("supported_dimension_recall")
                  row["citation_accuracy"] = (quality.get("citation") or {}).get("accuracy")
              summary["arms"][arm] = row
          (result / "pi-comparison.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload real Pi benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-real-kubernetes-140268
          path: ${{ runner.temp }}/pi-real-kubernetes-140268
          if-no-files-found: warn
