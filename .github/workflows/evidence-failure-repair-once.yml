name: Evidence Failure Repair Once

on:
  push:
    branches:
      - experiment/evidence-intelligence
    paths:
      - .github/workflows/evidence-failure-repair-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/evidence-intelligence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply focused repairs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('src/tracecite/runtime/retrieval_guidance.py')
          s = p.read_text()
          old = '''    if scoped_family and current_query == scoped_family:\n        if member_family and member_family != scoped_family:\n            gap["detail"] = (\n                "The scoped sibling family has been traced, but sibling identities can also "\n                "appear in runtime evidence without the scope prefix. Search the Runtime-observed "\n                "member family once to recover those cross-entity event references."\n            )\n            gap["recommended_action"] = {\n                "operation": "search",\n                "query": member_family,\n                "purpose": "trace_sibling_member_family_references",\n            }\n            return gap\n        return _finish_family_scan(gap)\n\n    if member_family and current_query == member_family:\n        return _finish_family_scan(gap)\n'''
          new = '''    if scoped_family and current_query == scoped_family:\n        # Stop while the scope is still explicit. Broadening to an unscoped\n        # member-family query discards the very correlation component this gap\n        # exists to protect and can flood large sources with unrelated siblings.\n        return _finish_family_scan(gap)\n'''
          if old not in s:
              raise SystemExit('retrieval_guidance target block not found')
          p.write_text(s.replace(old, new))

          p = Path('tests/test_retrieval_guidance.py')
          s = p.read_text()
          old = '''def test_scoped_family_search_advances_to_unscoped_member_family() -> None:\n    guided = prioritize_actionable_retrieval(\n        _result(_identity_case("vendor.example/device-run-"))\n    )\n    action = guided.canonical_result["data"]["actionable_retrieval"]\n    assert action["query"] == "device-run-"\n    assert action["purpose"] == "trace_sibling_member_family_references"\n    assert guided.canonical_result["next_queries"][0] == "device-run-"\n\n\ndef test_member_family_search_finishes_mechanical_identity_actions_without_declaring_safety() -> None:\n    guided = prioritize_actionable_retrieval(_result(_identity_case("device-run-")))\n    gap = guided.canonical_result["missing_evidence"][0]\n    assert gap["actionable"] is False\n    assert "actionable_retrieval" not in guided.canonical_result["data"]\n    constraint = guided.canonical_result["data"]["correlation_constraints"][0]\n    assert constraint["identifier_only_correlation_safe"] is False\n    assert "remains unsafe" in gap["detail"]\n'''
          new = '''def test_scoped_family_search_finishes_without_dropping_scope() -> None:\n    guided = prioritize_actionable_retrieval(\n        _result(_identity_case("vendor.example/device-run-"))\n    )\n    gap = guided.canonical_result["missing_evidence"][0]\n    assert gap["actionable"] is False\n    assert "actionable_retrieval" not in guided.canonical_result["data"]\n    constraint = guided.canonical_result["data"]["correlation_constraints"][0]\n    assert constraint["identifier_only_correlation_safe"] is False\n    assert "remains unsafe" in gap["detail"]\n    assert "device-run-" not in guided.canonical_result["next_queries"][:1]\n'''
          if old not in s:
              raise SystemExit('retrieval_guidance test target block not found')
          p.write_text(s.replace(old, new))

          p = Path('benchmarks/agent-investigation/cases/flutter-179398/gold.json')
          gold = json.loads(p.read_text())
          concepts = {c['id']: c for c in gold['required_concepts']}
          concepts['memory-corruption']['patterns'] += [
              r'use[- ]after[- ]free',
              r'lifetime.{0,80}(bug|error|issue)',
              r'poison(ed)? pointer',
          ]
          concepts['crashed-thread-is-victim']['patterns'] += [
              r'crash(ed|ing)? thread.{0,180}not.{0,50}(corrupting|corrupter)',
              r'thread.{0,80}(not where state went wrong|red herring|unlucky thread)',
              r'(actual|original).{0,80}(destruction|corruption).{0,120}(earlier|different thread)',
          ]
          p.write_text(json.dumps(gold, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Run focused deterministic tests
        run: |
          python -m pip install -e . pytest
          pytest -q tests/test_retrieval_guidance.py
          python -m tracecite.benchmarking validate benchmarks/agent-investigation/cases/flutter-179398
          python - <<'PY'
          import json
          from pathlib import Path
          from tracecite import benchmarking
          gold = json.loads(Path('benchmarks/agent-investigation/cases/flutter-179398/gold.json').read_text())
          concepts = {item['id']: item for item in gold['required_concepts']}
          assert benchmarking._concept_hit('a use-after-free lifetime bug left a poisoned pointer', concepts['memory-corruption'])
          assert benchmarking._concept_hit('the crashed thread is not the corrupting thread; it is a downstream manifestation', concepts['crashed-thread-is-victim'])
          PY
      - name: Commit repairs and remove one-shot workflow
        run: |
          rm .github/workflows/evidence-failure-repair-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/tracecite/runtime/retrieval_guidance.py tests/test_retrieval_guidance.py benchmarks/agent-investigation/cases/flutter-179398/gold.json .github/workflows/evidence-failure-repair-once.yml
          git commit -m "fix(evidence): preserve scoped identity and rubric semantics"
          git push origin HEAD:experiment/evidence-intelligence
