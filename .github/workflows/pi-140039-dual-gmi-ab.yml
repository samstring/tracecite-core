name: Pi 140039 Dual GMI A/B

on:
  workflow_dispatch:
  push:
    branches: [experiment/evidence-intelligence]
    paths:
      - .github/workflows/pi-140039-dual-gmi-ab.yml

permissions:
  contents: read

concurrency:
  group: pi-140039-dual-gmi-ab
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GMI_BASE_URL: https://api.gmi-serving.com/v1
      NATIVE_GMI_API_KEY: ${{ secrets.GMI_API_KEY }}
      TRACECITE_GMI_API_KEY: ${{ secrets.GMI2_API_KEY }}
      NATIVE_MODEL: ${{ vars.GMI_MODEL }}
      TRACECITE_MODEL: ${{ vars.GMI2_MODEL }}
      PI_CODING_AGENT_DIR: /tmp/pi-agent-config
      PI_SKIP_VERSION_CHECK: "1"
      PI_TELEMETRY: "0"
      CASE_ID: kubernetes-140039-runc-5347-log-code
      CASE_DIR: benchmarks/agent-investigation/log-code-cases/kubernetes-140039-runc-5347
      RESULT_ROOT: /tmp/pi-140039-dual-gmi-ab
      PREP: /tmp/pi-140039-dual-gmi-ab/prepared
      WORK_ROOT: /tmp/pi-140039-dual-gmi-ab/workspace
      SOURCE_BASE: /tmp/pi-140039-dual-gmi-ab/workspace/source-base
      SOURCE_NATIVE: /tmp/pi-140039-dual-gmi-ab/workspace/source-native
      SOURCE_TRACECITE: /tmp/pi-140039-dual-gmi-ab/workspace/source-tracecite
      TRACECITE_MCP_REF: 09215adbf01bd612b3115186951b9154320c5ca5

    steps:
      - name: Checkout TraceCite Core under test
        uses: actions/checkout@v4

      - name: Checkout pinned TraceCite MCP
        uses: actions/checkout@v4
        with:
          repository: samstring/tracecite-mcp
          ref: ${{ env.TRACECITE_MCP_REF }}
          path: tracecite-mcp

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install benchmark runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.84.4
          mkdir -p "$PI_CODING_AGENT_DIR"
          pi install npm:pi-mcp-adapter@2.27.0 --approve
          python -m pip install -e ".[dev]"
          python -m pip install 'mcp>=2,<3'
          python -m pip install -e ./tracecite-mcp --no-deps

      - name: Verify dual GMI configuration and contracts
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NATIVE_GMI_API_KEY:-}" || { echo 'GMI_API_KEY is empty' >&2; exit 2; }
          test -n "${TRACECITE_GMI_API_KEY:-}" || { echo 'GMI2_API_KEY is empty' >&2; exit 2; }
          test -n "${NATIVE_MODEL:-}" || { echo 'GMI_MODEL is empty' >&2; exit 2; }
          test -n "${TRACECITE_MODEL:-}" || { echo 'GMI2_MODEL is empty' >&2; exit 2; }
          echo "native model: $NATIVE_MODEL"
          echo "tracecite model: $TRACECITE_MODEL"
          python -m pytest -q \
            tests/test_session_novelty_regressions.py \
            tests/test_pi_session_to_transcript.py \
            tests/test_benchmark_run_result.py \
            tests/test_log_code_score.py \
            tests/test_pi_mcp_benchmark_boundary.py \
            tests/test_pi_tracecite_formal_flow.py
          python scripts/check_architecture.py
          python -m tracecite.root_cause_benchmarking validate "$CASE_DIR"
          python -m pytest -q \
            tracecite-mcp/tests/test_projection.py \
            tracecite-mcp/tests/test_server.py \
            tracecite-mcp/tests/test_stdio_integration.py

      - name: Configure both GMI models for Pi
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          ids = []
          for key in ('NATIVE_MODEL', 'TRACECITE_MODEL'):
              value = os.environ[key]
              if value not in ids:
                  ids.append(value)

          models = []
          for model_id in ids:
              models.append({
                  'id': model_id,
                  'name': model_id,
                  'reasoning': False,
                  'input': ['text'],
                  'cost': {'input': 0, 'output': 0, 'cacheRead': 0, 'cacheWrite': 0},
                  'contextWindow': 1_000_000,
                  'maxTokens': 4_096,
                  'compat': {'supportsDeveloperRole': False, 'supportsReasoningEffort': False},
              })

          payload = {'providers': {'gmi': {
              'name': 'GMI OpenAI-compatible',
              'baseUrl': os.environ['GMI_BASE_URL'],
              'api': 'openai-completions',
              'models': models,
          }}}
          path = Path(os.environ['PI_CODING_AGENT_DIR']) / 'models.json'
          path.write_text(json.dumps(payload, indent=2) + '\n')
          print(f'configured {len(models)} GMI model(s)')
          PY

      - name: Prepare identical 140039 runtime evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RESULT_ROOT"
          mkdir -p "$RESULT_ROOT" "$PREP" "$WORK_ROOT/evidence"
          python -m tracecite.root_cause_benchmarking prepare "$CASE_DIR" --work-dir "$PREP" > "$RESULT_ROOT/prepare.json"
          PREPARED="$(find "$PREP" -name prepared.json -type f -print -quit)"
          test -n "$PREPARED"
          python - "$PREPARED" >> "$GITHUB_ENV" <<'PY'
          import json, os, shutil, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          inputs = data.get('inputs') or []
          if len(inputs) != 1:
              raise SystemExit(f'expected one runtime log, got {len(inputs)}')
          source = Path(inputs[0]['path']).resolve()
          target = Path(os.environ['WORK_ROOT']) / 'evidence' / source.name
          shutil.copyfile(source, target)
          print(f'RUNTIME_LOG={target.resolve()}')
          print(f'RUNTIME_LOG_BYTES={target.stat().st_size}')
          print(f'QUESTION_FILE={Path(data["question"]).resolve()}')
          PY

      - name: Checkout identical pre-fix source trees
        shell: bash
        run: |
          set -euo pipefail
          eval "$(python - <<'PY'
          import json, os, shlex
          from pathlib import Path
          source = json.loads((Path(os.environ['CASE_DIR']) / 'case.json').read_text())['source_checkout']
          print('SOURCE_REPOSITORY=' + shlex.quote(source['repository']))
          print('SOURCE_COMMIT=' + shlex.quote(source['commit']))
          PY
          )"
          echo "SOURCE_REPOSITORY=$SOURCE_REPOSITORY" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          rm -rf "$SOURCE_BASE" "$SOURCE_NATIVE" "$SOURCE_TRACECITE"
          git init -q "$SOURCE_BASE"
          git -C "$SOURCE_BASE" remote add origin "$SOURCE_REPOSITORY"
          git -C "$SOURCE_BASE" fetch --depth=1 origin "$SOURCE_COMMIT"
          git -C "$SOURCE_BASE" checkout -q --detach FETCH_HEAD
          test "$(git -C "$SOURCE_BASE" rev-parse HEAD)" = "$SOURCE_COMMIT"
          git -C "$SOURCE_BASE" remote remove origin
          cp -a "$SOURCE_BASE" "$SOURCE_NATIVE"
          cp -a "$SOURCE_BASE" "$SOURCE_TRACECITE"
          printf '%s\n' "$SOURCE_COMMIT" > "$RESULT_ROOT/source-commit.txt"
          printf '%s\n' "$TRACECITE_MCP_REF" > "$RESULT_ROOT/tracecite-mcp-ref.txt"

      - name: Run native on GMI 1 and TraceCite MCP on GMI 2
        shell: bash
        run: |
          set -euo pipefail

          run_arm() {
            arm="$1"
            if [[ "$arm" == native ]]; then
              source_root="$SOURCE_NATIVE"
              arm_model="$NATIVE_MODEL"
              arm_api_key="$NATIVE_GMI_API_KEY"
              extra=()
            else
              source_root="$SOURCE_TRACECITE"
              arm_model="$TRACECITE_MODEL"
              arm_api_key="$TRACECITE_GMI_API_KEY"
              extra=(
                --skill-dir "$GITHUB_WORKSPACE/tracecite-mcp/skills/tracecite"
                --mcp-evidence-root "$WORK_ROOT/evidence"
                --mcp-state-dir "$RESULT_ROOT/tracecite-mcp-state"
              )
            fi

            echo "starting $arm with model=$arm_model"
            set +e
            python benchmarks/agent-investigation/agent_flow_runner.py \
              --agent pi \
              --mode "$arm" \
              --source-root "$source_root" \
              --runtime-log "$RUNTIME_LOG" \
              --result-root "$RESULT_ROOT" \
              --question-file "$QUESTION_FILE" \
              --provider gmi \
              --model "$arm_model" \
              --api-key "$arm_api_key" \
              --thinking off \
              --timeout-seconds 1200 \
              --host-extension "$GITHUB_WORKSPACE/benchmarks/agent-investigation/pi_log_code_benchmark_host.ts" \
              "${extra[@]}"
            code=$?
            set -e
            echo "$arm runner exit=$code"
          }

          printf '%s\n' "native:$NATIVE_MODEL" "tracecite:$TRACECITE_MODEL" > "$RESULT_ROOT/model-routing.txt"
          run_arm native
          sleep 5
          run_arm tracecite

      - name: Convert and score both arms
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for arm in native tracecite; do
            if [[ "$arm" == native ]]; then ARM_MODEL="$NATIVE_MODEL"; else ARM_MODEL="$TRACECITE_MODEL"; fi
            SESSION="$(find "$RESULT_ROOT/pi-${arm}-session" -type f -name '*.jsonl' -print -quit 2>/dev/null || true)"
            ANSWER="$RESULT_ROOT/pi-${arm}-answer.md"
            EXIT="$RESULT_ROOT/pi-${arm}-exit.txt"
            if [[ -z "$SESSION" || ! -f "$ANSWER" || ! -f "$EXIT" ]]; then
              echo "$arm outputs incomplete; leaving comparison invalid"
              continue
            fi
            TRANSCRIPT="$RESULT_ROOT/pi-${arm}-transcript.jsonl"
            SCORE="$RESULT_ROOT/pi-${arm}-score.json"
            RUN_RESULT="$RESULT_ROOT/pi-${arm}-run-result.json"
            python benchmarks/agent-investigation/pi_session_to_transcript.py \
              "$SESSION" "$ANSWER" "$TRANSCRIPT" \
              --mode "pi-log-code-${arm}" --model "$ARM_MODEL"
            python benchmarks/agent-investigation/log_code_score.py "$CASE_DIR" "$TRANSCRIPT" > "$SCORE" || true
            if [[ -s "$SCORE" ]]; then
              python benchmarks/agent-investigation/run_result.py \
                --score "$SCORE" \
                --exit-code-file "$EXIT" \
                --stderr "$RESULT_ROOT/pi-${arm}-stderr.log" \
                --session "$SESSION" \
                --transcript "$TRANSCRIPT" \
                --output "$RUN_RESULT" || true
            fi
          done

      - name: Build and verify comparison
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ['RESULT_ROOT'])

          def read_json(name):
              p = root / name
              if not p.is_file() or not p.read_text(errors='replace').strip():
                  return None
              return json.loads(p.read_text())

          def count_jsonl(name):
              p = root / name
              return sum(1 for line in p.read_text(errors='replace').splitlines() if line.strip()) if p.is_file() else 0

          def arm_summary(result, model):
              result = result or {}
              validity = result.get('run_validity') or {}
              evaluation = ((result.get('task_result') or {}).get('primary_evaluation') or {})
              tokens = result.get('token_usage') or {}
              return {
                  'model': model,
                  'valid_for_comparison': bool(validity.get('valid_for_comparison')),
                  'validity_reason': validity.get('reason'),
                  'root_cause_accurate': evaluation.get('root_cause_accurate'),
                  'evidence_chain_complete_and_bounded': evaluation.get('evidence_chain_complete_and_bounded'),
                  'evidence_boundary_respected': evaluation.get('evidence_boundary_respected'),
                  'fresh_input_tokens': tokens.get('fresh_input_tokens'),
                  'cached_input_tokens': tokens.get('cached_input_tokens'),
                  'fresh_plus_cached_input_tokens': tokens.get('fresh_plus_cached_input_tokens'),
                  'output_tokens': tokens.get('output_tokens'),
                  'model_calls': tokens.get('model_calls'),
              }

          native_result = read_json('pi-native-run-result.json')
          trace_result = read_json('pi-tracecite-run-result.json')
          native = arm_summary(native_result, os.environ['NATIVE_MODEL'])
          tracecite = arm_summary(trace_result, os.environ['TRACECITE_MODEL'])

          mcp_accesses = count_jsonl('tracecite-tracecite-runtime-log-access.jsonl')
          forbidden_native_accesses = count_jsonl('tracecite-native-runtime-evidence-access.jsonl')

          def delta(key):
              n, t = native.get(key), tracecite.get(key)
              if not isinstance(n, int) or not isinstance(t, int):
                  return None
              return {
                  'native': n,
                  'tracecite': t,
                  'tracecite_minus_native': t - n,
                  'tracecite_reduction_pct': round((n - t) / n * 100, 1) if n else None,
              }

          report = {
              'schema_version': 1,
              'case_id': os.environ['CASE_ID'],
              'source_commit': os.environ.get('SOURCE_COMMIT'),
              'runtime_log_bytes': int(os.environ.get('RUNTIME_LOG_BYTES', '0') or 0),
              'routing': {
                  'native': {'credential': 'GMI_API_KEY', 'model_variable': 'GMI_MODEL', 'model': os.environ['NATIVE_MODEL']},
                  'tracecite': {'credential': 'GMI2_API_KEY', 'model_variable': 'GMI2_MODEL', 'model': os.environ['TRACECITE_MODEL']},
              },
              'native': native,
              'tracecite': tracecite,
              'tracecite_runtime_log_mcp_accesses': mcp_accesses,
              'tracecite_forbidden_native_log_accesses': forbidden_native_accesses,
              'tracecite_clean_mcp_channel': mcp_accesses > 0 and forbidden_native_accesses == 0,
              'token_comparison': {
                  key: delta(key)
                  for key in ('fresh_input_tokens', 'cached_input_tokens', 'fresh_plus_cached_input_tokens', 'output_tokens')
              },
          }
          (root / 'comparison.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))

          errors = []
          if not native['valid_for_comparison']:
              errors.append('native arm is not valid for comparison')
          if not tracecite['valid_for_comparison']:
              errors.append('tracecite arm is not valid for comparison')
          if mcp_accesses <= 0:
              errors.append('tracecite arm did not access runtime evidence through MCP')
          if forbidden_native_accesses > 0:
              errors.append('tracecite arm used forbidden native runtime-log access')
          if errors:
              raise SystemExit('; '.join(errors))
          PY

      - name: Upload dual GMI 140039 comparison artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-140039-dual-gmi-ab
          path: ${{ env.RESULT_ROOT }}
          if-no-files-found: warn
