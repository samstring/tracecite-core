name: Pi RCAEval MB Pilot Unbounded A/B

on:
  push:
    branches:
      - exp/retrieval-guard-session-v2
    paths:
      - .github/workflows/pi-rcaeval-mb-pilot-unbounded-ab.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-rcaeval-mb-pilot-unbounded-ab
  cancel-in-progress: false

jobs:
  run-ab:
    name: gmi2 native then TraceCite, no investigation limits
    runs-on: ubuntu-latest
    env:
      GMI_BASE_URL: https://api.gmi-serving.com/v1
      BENCH_MODEL: ${{ vars.GMI2_MODEL }}
      BENCH_API_KEY: ${{ secrets.GMI2_API_KEY }}
      PI_CODING_AGENT_DIR: /tmp/pi-agent-rcaeval-mb-unbounded
      PI_SKIP_VERSION_CHECK: "1"
      PI_TELEMETRY: "0"
      EVIDENCE_ROOT: /tmp/rcaeval-mb-unbounded/evidence
      RESULT_ROOT: /tmp/rcaeval-mb-unbounded/results

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Prepare neutral 100MB+ RCAEval evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet huggingface_hub pandas pyarrow
          mkdir -p "$EVIDENCE_ROOT" "$RESULT_ROOT" "$PI_CODING_AGENT_DIR"
          python - <<'PY'
          import json, os
          from pathlib import Path
          import pandas as pd
          from huggingface_hub import snapshot_download

          source_case = "re3tt_ts-route-service_f3_6"
          src_root = Path('/tmp/rcaeval-source-unbounded')
          out = Path(os.environ['EVIDENCE_ROOT'])
          snapshot_download(
              repo_id='phamquiluan/RCAEval', repo_type='dataset',
              allow_patterns=[f'{source_case}/*'], local_dir=src_root,
          )
          src = src_root / source_case
          metrics = pd.read_parquet(src / 'metrics.parquet')
          logs = pd.read_parquet(src / 'logs.parquet')
          traces = pd.read_parquet(src / 'traces.parquet')
          onset = int((src / 'inject_time.txt').read_text().strip())
          metrics.to_csv(out / 'metrics.csv', index=False)
          logs.to_json(out / 'logs.jsonl', orient='records', lines=True, force_ascii=False)
          traces.to_json(out / 'traces.jsonl', orient='records', lines=True, force_ascii=False)
          (out / 'incident.txt').write_text(
              'System: Train Ticket microservices\n'
              f'Known incident onset (Unix seconds): {onset}\n'
              'Telemetry covers the normal and faulty window around this onset.\n'
          )
          files=['metrics.csv','logs.jsonl','traces.jsonl','incident.txt']
          manifest={
              'format_version':1,
              'system':'Train Ticket',
              'incident_onset_unix':onset,
              'files':{f:(out/f).stat().st_size for f in files},
              'total_bytes':sum((out/f).stat().st_size for f in files),
              'rows':{'metrics':len(metrics),'logs':len(logs),'traces':len(traces)},
              'correctness':None,
              'correctness_source':'manual_review',
          }
          (out/'evidence-manifest.json').write_text(json.dumps(manifest, indent=2)+'\n')
          if manifest['total_bytes'] < 5*1024*1024:
              raise SystemExit('evidence unexpectedly below 5 MiB')
          # Ensure the encoded answer label is absent from evidence visible to the agent.
          for p in out.iterdir():
              if p.is_file() and source_case.encode() in p.read_bytes():
                  raise SystemExit(f'ground-truth case id leaked into {p.name}')
          print(json.dumps(manifest, indent=2))
          PY

      - name: Configure Pi model
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BENCH_MODEL"
          test -n "$BENCH_API_KEY"
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.84.4
          python - <<'PY'
          import json, os
          from pathlib import Path
          model=os.environ['BENCH_MODEL']
          payload={'providers':{'gmi':{
            'name':'GMI OpenAI-compatible','baseUrl':os.environ['GMI_BASE_URL'],
            'api':'openai-completions','models':[{
              'id':model,'name':model,'reasoning':False,'input':['text'],
              'cost':{'input':0,'output':0,'cacheRead':0,'cacheWrite':0},
              'contextWindow':1_000_000,'maxTokens':4_096,
              'compat':{'supportsDeveloperRole':False,'supportsReasoningEffort':False},
            }]
          }}}
          (Path(os.environ['PI_CODING_AGENT_DIR'])/'models.json').write_text(json.dumps(payload,indent=2)+'\n')
          PY

      - name: Run Native with no bounded-investigation instruction
        shell: bash
        run: |
          set -u
          mkdir -p "$RESULT_ROOT/native-session"
          cd "$EVIDENCE_ROOT"
          PROMPT="A production incident occurred in a Train Ticket microservice deployment. The supplied telemetry covers the incident window and incident.txt gives the known onset time. Determine the root-cause service and the concrete failure mechanism. Explain the causal chain from the root cause to downstream symptoms. Use only supplied evidence and cite exact evidence lines for material claims. Use only evidence files in the current working directory and do not use external knowledge."
          start=$(date +%s)
          set +e
          pi \
            --provider gmi --model "$BENCH_MODEL" --api-key "$BENCH_API_KEY" \
            --thinking off --mode text --print \
            --session-dir "$RESULT_ROOT/native-session" \
            --tools read,bash,grep,find,ls \
            --no-extensions --no-skills --no-prompt-templates --no-context-files \
            --system-prompt "$PROMPT" \
            "Investigate this incident and report the root cause." \
            > "$RESULT_ROOT/native-answer.md" 2> "$RESULT_ROOT/native-stderr.log"
          code=$?
          set -e
          echo "$code" > "$RESULT_ROOT/native-exit.txt"
          echo "$(( $(date +%s) - start ))" > "$RESULT_ROOT/native-wall-seconds.txt"

      - name: Checkout and install TraceCite after Native
        uses: actions/checkout@v4
        with:
          path: tracecite-core

      - name: Install TraceCite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e "${GITHUB_WORKSPACE}/tracecite-core[dev,diversity]"

      - name: Run TraceCite with retrieval guard disabled and no bounded instruction
        shell: bash
        run: |
          set -u
          sleep 30
          mkdir -p "$RESULT_ROOT/tracecite-session"
          export TRACECITE_EVIDENCE_ROOT="$EVIDENCE_ROOT"
          export TRACECITE_EVIDENCE_FILES="metrics.csv,logs.jsonl,traces.jsonl,incident.txt"
          export TRACECITE_LOG_ACCESS_ACTIVITY="$RESULT_ROOT/tracecite-runtime-evidence-access.jsonl"
          export TRACECITE_BLOCKED_NATIVE_EVIDENCE_ACTIVITY="$RESULT_ROOT/tracecite-blocked-native-evidence-attempts.jsonl"
          # Intentionally DO NOT set TRACECITE_NO_GROWTH_PATIENCE,
          # TRACECITE_NO_MATCH_CAUTION_AFTER, TRACECITE_MAX_RETRIEVALS, or
          # TRACECITE_RETRIEVAL_GUARD_ACTIVITY. The retrieval guard's enabled()
          # predicate is therefore false for this run.
          PROMPT="A production incident occurred in a Train Ticket microservice deployment. The supplied telemetry covers the incident window and incident.txt gives the known onset time. Determine the root-cause service and the concrete failure mechanism. Explain the causal chain from the root cause to downstream symptoms. Use only supplied evidence and cite exact evidence lines for material claims. All telemetry content must be obtained through TraceCite tools; do not use native file-access tools for the evidence."
          cd "$EVIDENCE_ROOT"
          start=$(date +%s)
          set +e
          pi \
            --provider gmi --model "$BENCH_MODEL" --api-key "$BENCH_API_KEY" \
            --thinking off --mode text --print \
            --session-dir "$RESULT_ROOT/tracecite-session" \
            --extension "$GITHUB_WORKSPACE/tracecite-core/benchmarks/agent-investigation/pi_tracecite_extension.ts" \
            --tools tracecite_search,tracecite_expand \
            --no-skills --skill "$GITHUB_WORKSPACE/tracecite-core/.pi/skills/tracecite/SKILL.md" \
            --no-prompt-templates --no-context-files \
            --system-prompt "$PROMPT" \
            "用 tracecite 调查这个 incident 并报告根因。" \
            > "$RESULT_ROOT/tracecite-answer.md" 2> "$RESULT_ROOT/tracecite-stderr.log"
          code=$?
          set -e
          echo "$code" > "$RESULT_ROOT/tracecite-exit.txt"
          echo "$(( $(date +%s) - start ))" > "$RESULT_ROOT/tracecite-wall-seconds.txt"

      - name: Convert sessions and collect objective telemetry
        if: always()
        shell: bash
        run: |
          set -u
          for arm in native tracecite; do
            SESSION="$(find "$RESULT_ROOT/${arm}-session" -type f -name '*.jsonl' -print -quit 2>/dev/null || true)"
            if [[ -n "$SESSION" && -f "$RESULT_ROOT/${arm}-answer.md" ]]; then
              python "$GITHUB_WORKSPACE/tracecite-core/benchmarks/agent-investigation/pi_session_to_transcript.py" \
                "$SESSION" "$RESULT_ROOT/${arm}-answer.md" "$RESULT_ROOT/${arm}-transcript.jsonl" \
                --mode "pi-${arm}" --model "$BENCH_MODEL" || true
            fi
          done
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RESULT_ROOT'])
          evidence=json.loads((Path(os.environ['EVIDENCE_ROOT'])/'evidence-manifest.json').read_text())
          def read_int(name):
              try:return int((root/name).read_text().strip())
              except:return None
          def usage(arm):
              totals={'input_tokens':0,'output_tokens':0,'cache_read_tokens':0,'model_calls':0,'tool_calls':0}
              p=root/f'{arm}-transcript.jsonl'
              if not p.is_file(): return totals
              for line in p.read_text(errors='replace').splitlines():
                  try:e=json.loads(line)
                  except:continue
                  if e.get('type')=='model':
                      u=e.get('usage') or {}
                      totals['input_tokens']+=int(u.get('input_tokens') or 0)
                      totals['output_tokens']+=int(u.get('output_tokens') or 0)
                      totals['cache_read_tokens']+=int(u.get('cache_read_input_tokens') or u.get('cached_input_tokens') or 0)
                      totals['model_calls']+=1
                  elif e.get('type')=='tool': totals['tool_calls']+=1
              return totals
          rows=[]
          for arm in ('native','tracecite'):
              rows.append({
                  'arm':arm,
                  'exit':read_int(f'{arm}-exit.txt'),
                  'wall_seconds':read_int(f'{arm}-wall-seconds.txt'),
                  'usage':usage(arm),
                  'correctness':None,
                  'correctness_source':'manual_review',
              })
          payload={
              'model':os.environ.get('BENCH_MODEL'),
              'benchmark':'rcaeval-mb-pilot-unbounded',
              'correctness_policy':'manual_review_only',
              'bounded_investigation_prompt':False,
              'tracecite_retrieval_guard_enabled':False,
              'per_task_timeout':None,
              'evidence':evidence,
              'rows':rows,
          }
          (root/'summary.json').write_text(json.dumps(payload,indent=2)+'\n')
          print(json.dumps(payload,indent=2))
          PY

      - name: Upload unbounded pilot results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcaeval-mb-pilot-unbounded-gmi2-results
          path: ${{ env.RESULT_ROOT }}
          if-no-files-found: error
          retention-days: 14
