name: Finalize Evidence Intelligence Before Tests

on:
  push:
    branches:
      - work/evidence-intelligence-finalize
    paths:
      - scripts/finalize_evidence_intelligence.py
      - .github/workflows/evidence-intelligence-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/evidence-intelligence-finalize
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply remaining code and evaluation-contract changes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/finalize_evidence_intelligence.py apply
          git restore --source=HEAD -- \
            .github/workflows/evidence-intelligence.yml \
            .github/workflows/pi-scale-4case-progress-once.yml
          rm -f .github/workflows/pi-evidence-runtime-ab.yml
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/evidence-runtime-refactor-plan.zh-CN.md')
          text = path.read_text(encoding='utf-8')
          marker = '\n### Pre-case A/B workflow convergence'
          if marker in text:
              text = text.split(marker, 1)[0].rstrip() + '\n'
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit implementation convergence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name tracecite-refactor-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "benchmark: finalize evidence runtime evaluation contract"
          echo "IMPL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Backfill implementation commit and push code-only changes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/finalize_evidence_intelligence.py backfill "$IMPL_SHA"
          git add docs/evidence-runtime-refactor-plan.zh-CN.md
          git commit -m "docs: record final pre-case implementation evidence"
          git push origin HEAD:work/evidence-intelligence-finalize
