name: Internal candidate limit migration

on:
  push:
    branches:
      - feature_for_agent

permissions:
  contents: write

jobs:
  migrate:
    # One-shot migration; final retry after fixture vocabulary cleanup.
    if: "${{ github.event.head_commit.message == 'chore: run internal candidate limit migration' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Apply internal candidate limit migration
        run: |
          python scripts/refactor_internal_candidate_limits_once.py
          python scripts/fix_internal_candidate_limits_once.py
          python scripts/fix_candidate_parallel_test_once.py
          python scripts/fix_candidate_full_suite_once.py

      - name: Run focused regressions
        run: |
          python -m pytest tests/test_runtime_agent_api.py tests/test_runtime_acquisition_boundary.py tests/test_evidence_routing.py tests/test_pi_tracecite_bridge.py tests/test_pi_tracecite_formal_flow.py tests/test_runtime_schema_tools.py tests/test_session_novelty_regressions.py tests/test_runtime_cli.py tests/test_stateful_cli.py tests/test_pi_source_identity_projection.py tests/test_gmi_scale_evidence_progress.py
          python scripts/check_architecture.py

      - name: Run full Core test suite
        run: python -m pytest -W error::DeprecationWarning

      - name: Commit validated migration
        run: |
          rm .github/workflows/refactor-internal-candidate-limits-on-feature.yml
          rm scripts/refactor_internal_candidate_limits_once.py
          rm scripts/fix_internal_candidate_limits_once.py
          rm scripts/fix_candidate_parallel_test_once.py
          rm scripts/fix_candidate_full_suite_once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: internalize candidate disclosure limits'
          git push origin HEAD:feature_for_agent
