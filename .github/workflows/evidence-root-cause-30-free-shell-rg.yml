name: Root Cause 30 Free Shell RG

on:
  push:
    branches:
      - experiment/evidence-intelligence
    paths:
      - .github/workflows/evidence-root-cause-30-free-shell-rg.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-root-cause-30-free-shell-rg
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - shard: "01"
            cases: "doublecmd-2264 doublecmd-2616 doublecmd-2731 doublecmd-2772 doublecmd-2777"
          - shard: "02"
            cases: "doublecmd-2809 doublecmd-2815 doublecmd-3061 flutter-179398 kubernetes-140848"
          - shard: "03"
            cases: "prometheus-18018 pulumi-20529 pulumi-14231 pulumi-21700 flutter-167887"
          - shard: "04"
            cases: "flutter-190799 otel-collector-13117 otel-contrib-24908 otel-contrib-16469 envoy-43513"
          - shard: "05"
            cases: "envoy-7154 containerd-8742 containerd-10062 containerd-4795 kubernetes-39480"
          - shard: "06"
            cases: "kubernetes-86676 argocd-25189 argocd-18020 argocd-7898 prometheus-19432"
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.TRACECITE_BENCH_BASE_URL || 'https://api.gmi-serving.com/v1' }}
      BENCH_MODEL: ${{ vars.TRACECITE_BENCH_MODEL }}
      TRACECITE_BENCH_MAX_OUTPUT_TOKENS: "1800"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TraceCite
        run: python -m pip install -e ".[dev]"
      - name: Install and verify ripgrep
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ripgrep
          fi
          command -v rg
          rg --version
      - name: Run free-shell + rg shard ${{ matrix.shard }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="/tmp/root-rg-baseline-${{ matrix.shard }}"
          OUT="/tmp/root-rg-baseline-${{ matrix.shard }}-results"
          rm -rf "$WORK" "$OUT"
          CASE_ARGS=()
          for case_id in ${{ matrix.cases }}; do
            CASE_ARGS+=(--case-id "$case_id")
          done
          python -m tracecite.root_cause_suite run \
            --repo-root "$GITHUB_WORKSPACE" \
            --work-dir "$WORK" \
            --output-dir "$OUT" \
            --mode free_shell \
            --model "$BENCH_MODEL" \
            --host "$GITHUB_WORKSPACE/benchmarks/agent-investigation/gmi_canonical_host.py" \
            --timeout-seconds 180 \
            "${CASE_ARGS[@]}"
      - name: Verify rg was actually available to the agent
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="/tmp/root-rg-baseline-${{ matrix.shard }}-results"
          if grep -R -F "No such file or directory: 'rg'" "$OUT/runs" 2>/dev/null; then
            echo "ripgrep was advertised but unavailable" >&2
            exit 1
          fi
      - name: Print shard summary
        if: always()
        run: cat /tmp/root-rg-baseline-${{ matrix.shard }}-results/batch-summary.json 2>/dev/null || true
      - name: Upload free-shell + rg shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-cause-30-free-shell-rg-${{ matrix.shard }}
          path: |
            /tmp/root-rg-baseline-${{ matrix.shard }}/suite-index.json
            /tmp/root-rg-baseline-${{ matrix.shard }}/snapshots
            /tmp/root-rg-baseline-${{ matrix.shard }}-results
          if-no-files-found: warn

  aggregate:
    needs: baseline
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TraceCite
        run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          pattern: root-cause-30-free-shell-rg-*
          path: /tmp/root-rg-artifacts
      - name: Aggregate strict and semantic metrics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/root-rg-combined/scores /tmp/root-rg-combined/failures /tmp/root-rg-combined/runs
          find /tmp/root-rg-artifacts -path '*/scores/*.json' -type f -exec cp {} /tmp/root-rg-combined/scores/ \;
          find /tmp/root-rg-artifacts -path '*/failures/*.json' -type f -exec cp {} /tmp/root-rg-combined/failures/ \;
          find /tmp/root-rg-artifacts -path '*/runs/*.jsonl' -type f -exec cp {} /tmp/root-rg-combined/runs/ \;
          python -m tracecite.root_cause_suite aggregate \
            --output-dir /tmp/root-rg-combined --mode free_shell \
            > /tmp/root-rg-combined/batch-summary.json
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/root-rg-combined')
          scores = [json.loads(p.read_text()) for p in sorted((root / 'scores').glob('*.json'))]
          failures = [json.loads(p.read_text()) for p in sorted((root / 'failures').glob('*.json'))]
          semantic_pass = []
          for score in scores:
              quality = score.get('quality') or {}
              semantic_ok = (
                  float(quality.get('dimension_recall') or 0.0) >= 0.75
                  and int(quality.get('unsupported_claim_hits') or 0) == 0
                  and int(quality.get('contradiction_hits') or 0) == 0
              )
              semantic_pass.append((score.get('case_id'), bool(semantic_ok)))
          strict = [s for s in scores if s.get('case_id') not in {
              'doublecmd-2815', 'flutter-190799', 'kubernetes-86676', 'prometheus-19432'
          }]
          reporter = [s for s in scores if s not in strict]
          payload = {
              'scores': len(scores),
              'failures': len(failures),
              'semantic_passed': sum(v for _, v in semantic_pass),
              'semantic_pass_rate_scored': round(sum(v for _, v in semantic_pass) / len(scores), 4) if scores else None,
              'strict_semantic_passed': sum(
                  float((s.get('quality') or {}).get('dimension_recall') or 0.0) >= 0.75
                  and int((s.get('quality') or {}).get('unsupported_claim_hits') or 0) == 0
                  and int((s.get('quality') or {}).get('contradiction_hits') or 0) == 0
                  for s in strict
              ),
              'strict_scored': len(strict),
              'reporter_scored': len(reporter),
              'mean_dimension_recall': round(sum(float((s.get('quality') or {}).get('dimension_recall') or 0.0) for s in scores) / len(scores), 4) if scores else None,
              'mean_citation_accuracy_raw': round(sum(float(((s.get('quality') or {}).get('citation') or {}).get('accuracy') or 0.0) for s in scores) / len(scores), 4) if scores else None,
              'reported_input_tokens': sum(int((s.get('context_cost') or {}).get('reported_input_tokens') or 0) for s in scores),
              'reported_output_tokens': sum(int((s.get('context_cost') or {}).get('reported_output_tokens') or 0) for s in scores),
              'tool_output_chars': sum(int((s.get('context_cost') or {}).get('tool_output_chars') or 0) for s in scores),
              'cumulative_attempted_context_chars': sum(int((s.get('context_cost') or {}).get('cumulative_attempted_context_chars') or 0) for s in scores),
              'peak_attempted_context_chars': max([int((s.get('context_cost') or {}).get('peak_attempted_context_chars') or 0) for s in scores] or [0]),
              'semantic_cases': dict(semantic_pass),
          }
          (root / 'semantic-summary.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          print(json.dumps(payload, indent=2, sort_keys=True))
          observed = len(scores) + len(failures)
          if observed != 30:
              raise SystemExit(f'expected 30 free-shell+rg results, got {observed}')
          PY
          cat /tmp/root-rg-combined/batch-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: root-cause-30-free-shell-rg-summary
          path: /tmp/root-rg-combined
