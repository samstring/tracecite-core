name: Search Cost V2 Canonical Source Discovery

on:
  push:
    branches:
      - experiment/evidence-intelligence-search-cost-v2
    paths:
      - .github/workflows/search-cost-v2-source-discovery.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: experiment/evidence-intelligence-search-cost-v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Expose Host-authorized evidence sources in canonical tool schema
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('benchmarks/agent-investigation/pi_tracecite_extension_impl.ts')
          text=p.read_text(encoding='utf-8')
          old='''const ACTIVITY_PATH = process.env.TRACECITE_PI_ACTIVITY ||\n  join(dirname(SESSION), "host-tool-activity.json");\nconst TRACE_TOOLS = new Set([\n'''
          new='''const ACTIVITY_PATH = process.env.TRACECITE_PI_ACTIVITY ||\n  join(dirname(SESSION), "host-tool-activity.json");\nconst AUTHORIZED_EVIDENCE_FILES = (process.env.TRACECITE_EVIDENCE_FILES || "")\n  .split(",")\n  .map((value) => value.trim())\n  .filter(Boolean);\nconst AUTHORIZED_EVIDENCE_HINT = AUTHORIZED_EVIDENCE_FILES.length > 0\n  ? ` Host-authorized evidence files: ${AUTHORIZED_EVIDENCE_FILES.join(", ")}.`\n  : "";\nconst TRACE_TOOLS = new Set([\n'''
          if old not in text: raise SystemExit('constant insertion point missing')
          text=text.replace(old,new,1)
          old='''    description: "Canonical retrieve for caller-selected local evidence. Preserves provenance, coverage, identity safety and RetrievalSession novelty. Host feedback may require investigation_goal after a convergence checkpoint; the Agent still owns hypotheses and stopping.",\n    parameters: Type.Object({\n      file: Type.String(), query: Type.Optional(Type.String()), regex: Type.Optional(Type.Boolean()),\n'''
          new='''    description: "Canonical retrieve for caller-selected local evidence. Preserves provenance, coverage, identity safety and RetrievalSession novelty. Host feedback may require investigation_goal after a convergence checkpoint; the Agent still owns hypotheses and stopping." + AUTHORIZED_EVIDENCE_HINT,\n    parameters: Type.Object({\n      file: Type.String({ description: "Evidence source path." + AUTHORIZED_EVIDENCE_HINT }), query: Type.Optional(Type.String()), regex: Type.Optional(Type.Boolean()),\n'''
          if old not in text: raise SystemExit('retrieve schema insertion point missing')
          text=text.replace(old,new,1)
          # Materialize/replay also use file paths. Put the inventory into their shared
          # file-parameter description without changing their runtime semantics.
          text=text.replace('file: Type.String(), line:', 'file: Type.String({ description: "Evidence source path." + AUTHORIZED_EVIDENCE_HINT }), line:')
          p.write_text(text,encoding='utf-8')

          skill=Path('.pi/skills/tracecite/SKILL.md')
          s=skill.read_text(encoding='utf-8')
          marker='''1. Inspect the source shape once; do not rediscover filenames or schemas with synonym searches.\n'''
          replacement='''1. Inspect the source shape once; do not rediscover filenames or schemas with synonym searches. In a controlled Host, the canonical tool schema may list `Host-authorized evidence files`; treat that inventory as source metadata and use those exact names instead of guessing paths.\n'''
          if marker not in s: raise SystemExit('skill marker missing')
          skill.write_text(s.replace(marker,replacement,1),encoding='utf-8')
          PY
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_pi_tracecite_bridge.py tests/test_pi_tracecite_formal_flow.py tests/test_pi_host_tool_activity.py tests/test_runtime_session_retrieval.py
      - name: Commit source discovery
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/search-cost-v2-source-discovery.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add benchmarks/agent-investigation/pi_tracecite_extension_impl.ts .pi/skills/tracecite/SKILL.md
          git commit -m 'expose authorized evidence sources to canonical Pi tools'
          git push origin HEAD:experiment/evidence-intelligence-search-cost-v2
