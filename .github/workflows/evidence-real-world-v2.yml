name: Real-World Inspect-First Batch

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/evidence-intelligence
    paths:
      - ".github/workflows/evidence-real-world-v2.yml"

permissions:
  contents: read

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.TRACECITE_BENCH_BASE_URL || 'https://api.gmi-serving.com/v1' }}
      BENCH_MODEL: ${{ vars.TRACECITE_BENCH_MODEL }}
      TRACECITE_BENCH_MAX_OUTPUT_TOKENS: "1800"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TraceCite
        run: python -m pip install -e ".[dev]"
      - name: Validate configuration
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY is not configured"; exit 1; }
          test -n "$BENCH_MODEL" || { echo "TRACECITE_BENCH_MODEL is not configured"; exit 1; }
          echo "Provider base URL: $OPENAI_BASE_URL"
          echo "Benchmark model: $BENCH_MODEL"
      - name: Prepare required cases
        shell: bash
        run: |
          set -euo pipefail
          cases=(
            prometheus-18018
            pulumi-20529
            doublecmd-3061
            doublecmd-2616
            doublecmd-2777
            doublecmd-2772
            doublecmd-2815
            doublecmd-2731
            doublecmd-2264
          )
          rm -rf /tmp/tracecite-rw-v2
          for case_id in "${cases[@]}"; do
            case_dir="benchmarks/agent-investigation/cases/${case_id}"
            python -m tracecite.benchmarking validate "$case_dir"
            python -m tracecite.benchmarking prepare "$case_dir" --work-dir /tmp/tracecite-rw-v2
          done
      - name: Run resilient inspect-first batch
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/tracecite-rw-v2-runs /tmp/tracecite-rw-v2-scores /tmp/tracecite-rw-v2-failures
          runs=(
            "prometheus-18018:tracecite"
            "pulumi-20529:tracecite"
            "doublecmd-3061:tracecite"
            "doublecmd-2616:tracecite"
            "doublecmd-2777:tracecite"
            "doublecmd-2772:free_shell"
            "doublecmd-2772:tracecite"
            "doublecmd-2815:free_shell"
            "doublecmd-2815:tracecite"
            "doublecmd-2731:free_shell"
            "doublecmd-2731:tracecite"
            "doublecmd-2264:free_shell"
            "doublecmd-2264:tracecite"
          )
          seed=1
          failed=0
          completed=0
          for item in "${runs[@]}"; do
            case_id="${item%%:*}"
            mode="${item##*:}"
            case_dir="benchmarks/agent-investigation/cases/${case_id}"
            manifest="/tmp/tracecite-rw-v2/${case_id}/prepared.json"
            transcript="/tmp/tracecite-rw-v2-runs/${case_id}-${mode}-${seed}.jsonl"
            score="/tmp/tracecite-rw-v2-scores/${case_id}-${mode}-${seed}.json"
            echo "== ${case_id} / ${mode} =="
            if [ "$mode" = "tracecite" ]; then
              host="$GITHUB_WORKSPACE/benchmarks/agent-investigation/gmi_raw_host_v2.py"
            else
              host="$GITHUB_WORKSPACE/benchmarks/agent-investigation/gmi_host.py"
            fi
            python benchmarks/agent-investigation/run_host.py \
              "$case_dir" "$manifest" \
              --mode "$mode" \
              --model "$BENCH_MODEL" \
              --seed "$seed" \
              --timeout-seconds 600 \
              --output "$transcript" \
              --pass-env OPENAI_API_KEY \
              --pass-env OPENAI_BASE_URL \
              --pass-env TRACECITE_BENCH_MAX_OUTPUT_TOKENS \
              -- python "$host"
            rc=$?
            if [ "$rc" -eq 0 ]; then
              python -m tracecite.benchmarking score "$case_dir" "$transcript" > "$score"
              cat "$score"
              completed=$((completed + 1))
            else
              failed=$((failed + 1))
              printf '{"case_id":"%s","mode":"%s","returncode":%d}\n' "$case_id" "$mode" "$rc" \
                > "/tmp/tracecite-rw-v2-failures/${case_id}-${mode}-${seed}.json"
              echo "FAILED ${case_id}/${mode} rc=${rc}; continuing"
            fi
          done
          if compgen -G '/tmp/tracecite-rw-v2-scores/*.json' > /dev/null; then
            python benchmarks/agent-investigation/aggregate_scores.py \
              /tmp/tracecite-rw-v2-scores/*.json \
              --output /tmp/tracecite-rw-v2-runs/aggregate.json
            cat /tmp/tracecite-rw-v2-runs/aggregate.json
          fi
          printf '{"completed":%d,"failed":%d,"requested":%d}\n' "$completed" "$failed" "${#runs[@]}" \
            > /tmp/tracecite-rw-v2-runs/batch-summary.json
          cat /tmp/tracecite-rw-v2-runs/batch-summary.json
      - name: Upload batch results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-real-world-v2
          path: |
            /tmp/tracecite-rw-v2-runs
            /tmp/tracecite-rw-v2-scores
            /tmp/tracecite-rw-v2-failures
          if-no-files-found: warn

# Temporary push trigger while validating inspect-first behavior; restore manual-only after the batch.
