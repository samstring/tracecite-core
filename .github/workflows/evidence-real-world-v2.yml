name: Real-World Complete-Inspection Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/evidence-intelligence
    paths:
      - ".github/workflows/evidence-real-world-v2.yml"

permissions:
  contents: read

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.TRACECITE_BENCH_BASE_URL || 'https://api.gmi-serving.com/v1' }}
      BENCH_MODEL: ${{ vars.TRACECITE_BENCH_MODEL }}
      TRACECITE_BENCH_MAX_OUTPUT_TOKENS: "1800"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TraceCite
        run: python -m pip install -e ".[dev]"
      - name: Validate configuration
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY is not configured"; exit 1; }
          test -n "$BENCH_MODEL" || { echo "TRACECITE_BENCH_MODEL is not configured"; exit 1; }
      - name: Prepare targeted cases
        shell: bash
        run: |
          set -euo pipefail
          cases=(doublecmd-2616 doublecmd-2731 doublecmd-2264 doublecmd-2772)
          rm -rf /tmp/tracecite-rw-gate
          for case_id in "${cases[@]}"; do
            case_dir="benchmarks/agent-investigation/cases/${case_id}"
            python -m tracecite.benchmarking validate "$case_dir"
            python -m tracecite.benchmarking prepare "$case_dir" --work-dir /tmp/tracecite-rw-gate
          done
      - name: Run targeted TraceCite smoke
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/tracecite-rw-gate-runs /tmp/tracecite-rw-gate-scores /tmp/tracecite-rw-gate-failures
          cases=(doublecmd-2616 doublecmd-2731 doublecmd-2264 doublecmd-2772)
          failed=0
          completed=0
          for case_id in "${cases[@]}"; do
            case_dir="benchmarks/agent-investigation/cases/${case_id}"
            manifest="/tmp/tracecite-rw-gate/${case_id}/prepared.json"
            transcript="/tmp/tracecite-rw-gate-runs/${case_id}-tracecite-1.jsonl"
            score="/tmp/tracecite-rw-gate-scores/${case_id}-tracecite-1.json"
            echo "== ${case_id} / tracecite =="
            if python benchmarks/agent-investigation/run_host.py \
              "$case_dir" "$manifest" \
              --mode tracecite \
              --model "$BENCH_MODEL" \
              --seed 1 \
              --timeout-seconds 600 \
              --output "$transcript" \
              --pass-env OPENAI_API_KEY \
              --pass-env OPENAI_BASE_URL \
              --pass-env TRACECITE_BENCH_MAX_OUTPUT_TOKENS \
              -- python "$GITHUB_WORKSPACE/benchmarks/agent-investigation/gmi_raw_host_v2.py"; then
              if python -m tracecite.benchmarking score "$case_dir" "$transcript" > "$score"; then
                cat "$score"
                completed=$((completed + 1))
              else
                failed=$((failed + 1))
                echo '{"stage":"score"}' > "/tmp/tracecite-rw-gate-failures/${case_id}.json"
              fi
            else
              failed=$((failed + 1))
              echo '{"stage":"host"}' > "/tmp/tracecite-rw-gate-failures/${case_id}.json"
              tail -n 4 "$transcript" || true
            fi
          done
          printf '{"completed":%d,"failed":%d,"requested":4}\n' "$completed" "$failed" \
            > /tmp/tracecite-rw-gate-runs/batch-summary.json
          cat /tmp/tracecite-rw-gate-runs/batch-summary.json
      - name: Upload targeted results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-real-world-complete-inspection-smoke
          path: |
            /tmp/tracecite-rw-gate-runs
            /tmp/tracecite-rw-gate-scores
            /tmp/tracecite-rw-gate-failures
          if-no-files-found: warn

