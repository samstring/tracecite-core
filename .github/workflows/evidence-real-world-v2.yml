name: Real-World Evidence Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.TRACECITE_BENCH_BASE_URL || 'https://api.gmi-serving.com/v1' }}
      BENCH_MODEL: ${{ vars.TRACECITE_BENCH_MODEL }}
      TRACECITE_BENCH_MAX_OUTPUT_TOKENS: "1800"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TraceCite
        run: python -m pip install -e ".[dev]"
      - name: Validate configuration
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY is not configured"; exit 1; }
          test -n "$BENCH_MODEL" || { echo "TRACECITE_BENCH_MODEL is not configured"; exit 1; }
          echo "Provider base URL: $OPENAI_BASE_URL"
          echo "Benchmark model: $BENCH_MODEL"
      - name: Prepare real-world cases
        shell: bash
        run: |
          set -euo pipefail
          cases=(
            prometheus-18018
            pulumi-20529
            doublecmd-3061
            doublecmd-2616
            doublecmd-2777
            doublecmd-2809
            doublecmd-2772
            doublecmd-2815
            doublecmd-2731
            doublecmd-2264
          )
          rm -rf /tmp/tracecite-real-world
          for case_id in "${cases[@]}"; do
            case_dir="benchmarks/agent-investigation/cases/${case_id}"
            python -m tracecite.benchmarking validate "$case_dir"
            python -m tracecite.benchmarking prepare "$case_dir" --work-dir /tmp/tracecite-real-world
          done
      - name: Run resilient free-shell vs TraceCite batch
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/tracecite-real-world-runs /tmp/tracecite-real-world-scores /tmp/tracecite-real-world-failures
          cases=(
            prometheus-18018
            pulumi-20529
            doublecmd-3061
            doublecmd-2616
            doublecmd-2777
            doublecmd-2809
            doublecmd-2772
            doublecmd-2815
            doublecmd-2731
            doublecmd-2264
          )
          modes=(free_shell tracecite)
          seed=1
          failed=0
          completed=0
          requested=$((${#cases[@]} * ${#modes[@]}))

          for case_id in "${cases[@]}"; do
            for mode in "${modes[@]}"; do
              case_dir="benchmarks/agent-investigation/cases/${case_id}"
              manifest="/tmp/tracecite-real-world/${case_id}/prepared.json"
              transcript="/tmp/tracecite-real-world-runs/${case_id}-${mode}-${seed}.jsonl"
              score="/tmp/tracecite-real-world-scores/${case_id}-${mode}-${seed}.json"
              echo "== ${case_id} / ${mode} =="

              if [ "$mode" = "tracecite" ]; then
                host="$GITHUB_WORKSPACE/benchmarks/agent-investigation/gmi_raw_host_v2.py"
              else
                host="$GITHUB_WORKSPACE/benchmarks/agent-investigation/gmi_host.py"
              fi

              if python benchmarks/agent-investigation/run_host.py \
                "$case_dir" "$manifest" \
                --mode "$mode" \
                --model "$BENCH_MODEL" \
                --seed "$seed" \
                --timeout-seconds 600 \
                --output "$transcript" \
                --pass-env OPENAI_API_KEY \
                --pass-env OPENAI_BASE_URL \
                --pass-env TRACECITE_BENCH_MAX_OUTPUT_TOKENS \
                -- python "$host"; then
                if python -m tracecite.benchmarking score "$case_dir" "$transcript" > "$score"; then
                  cat "$score"
                  completed=$((completed + 1))
                else
                  failed=$((failed + 1))
                  printf '{"case_id":"%s","mode":"%s","stage":"score"}\n' "$case_id" "$mode" \
                    > "/tmp/tracecite-real-world-failures/${case_id}-${mode}-${seed}.json"
                  echo "FAILED scoring ${case_id}/${mode}; continuing"
                fi
              else
                rc=$?
                failed=$((failed + 1))
                printf '{"case_id":"%s","mode":"%s","stage":"host","returncode":%d}\n' \
                  "$case_id" "$mode" "$rc" \
                  > "/tmp/tracecite-real-world-failures/${case_id}-${mode}-${seed}.json"
                echo "FAILED host ${case_id}/${mode} rc=${rc}; continuing"
                tail -n 4 "$transcript" || true
              fi
            done
          done

          if compgen -G '/tmp/tracecite-real-world-scores/*.json' > /dev/null; then
            python benchmarks/agent-investigation/aggregate_scores.py \
              /tmp/tracecite-real-world-scores/*.json \
              --output /tmp/tracecite-real-world-runs/aggregate.json || true
            cat /tmp/tracecite-real-world-runs/aggregate.json 2>/dev/null || true
          fi

          printf '{"completed":%d,"failed":%d,"requested":%d}\n' "$completed" "$failed" "$requested" \
            > /tmp/tracecite-real-world-runs/batch-summary.json
          cat /tmp/tracecite-real-world-runs/batch-summary.json
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-real-world-benchmark
          path: |
            /tmp/tracecite-real-world-runs
            /tmp/tracecite-real-world-scores
            /tmp/tracecite-real-world-failures
          if-no-files-found: warn
