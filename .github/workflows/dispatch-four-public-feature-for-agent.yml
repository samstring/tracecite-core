name: Dispatch Four Public A/B on feature_for_agent

on:
  push:
    branches:
      - feature_for_agent
    paths:
      - .github/workflows/dispatch-four-public-feature-for-agent.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch four-public native vs TraceCite benchmark
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pi-agent-four-public-cases-ab.yml/dispatches" \
            -d '{"ref":"feature_for_agent"}'
