name: Trigger Dual GMI 140848 Rerun

on:
  push:
    branches:
      - experiment/evidence-intelligence
    paths:
      - .github/workflows/trigger-dual-gmi-140848-rerun.yml

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical 140848 A/B
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pi-dual-gmi-parallel-ab.yml/dispatches" \
            -d '{"ref":"experiment/evidence-intelligence","inputs":{"case_key":"140848"}}'
