name: Pi Scale 4-Case Progress A/B Once

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/evidence-intelligence
    paths:
      - .github/workflows/pi-scale-4case-progress-once.yml

permissions:
  contents: read
  actions: write

jobs:
  cancel-old-five-case:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel old five-case run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/33303359908/cancel" || true

  compare:
    needs: cancel-old-five-case
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - case_id: kubernetes-140039-runc-5347-scale
            case_dir: benchmarks/agent-investigation/scale-cases/kubernetes-140039-runc-5347
            arm_order: native tracecite
          - case_id: kubernetes-139417-scale
            case_dir: benchmarks/agent-investigation/scale-cases/kubernetes-139417
            arm_order: tracecite native
          - case_id: kubernetes-140848-scale
            case_dir: benchmarks/agent-investigation/scale-cases/kubernetes-140848
            arm_order: native tracecite
          - case_id: kubernetes-140268
            case_dir: benchmarks/agent-investigation/scale-cases/kubernetes-140268
            arm_order: tracecite native
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.TRACECITE_BENCH_BASE_URL || 'https://api.gmi-serving.com/v1' }}
      BENCH_MODEL: ${{ vars.TRACECITE_BENCH_MODEL }}
      PI_CODING_AGENT_DIR: /tmp/pi-agent-config
      PI_SKIP_VERSION_CHECK: "1"
      PI_TELEMETRY: "0"
      CASE_ID: ${{ matrix.case_id }}
      CASE_DIR: ${{ matrix.case_dir }}
      ARM_ORDER: ${{ matrix.arm_order }}
      RESULT_ROOT: /tmp/pi-progress-once/${{ matrix.case_id }}
      PREP: /tmp/pi-progress-once/${{ matrix.case_id }}/prepared

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Pi and TraceCite
        shell: bash
        run: |
          set -euo pipefail
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.84.4
          python -m pip install -e ".[dev]"

      - name: Verify telemetry and support-aware scoring
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_retrieval_telemetry.py \
            tests/test_session_novelty_regressions.py \
            tests/test_pi_ab_runtime.py \
            tests/test_root_cause_benchmarking.py
          python benchmarks/agent-investigation/support_level_score.py --self-test

      - name: Configure model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PI_CODING_AGENT_DIR"
          python - <<'PY'
          import json, os
          from pathlib import Path
          model = os.environ['BENCH_MODEL']
          if not model:
              raise SystemExit('BENCH_MODEL is empty')
          payload = {'providers': {'gmi': {
              'name': 'GMI OpenAI-compatible',
              'baseUrl': os.environ['OPENAI_BASE_URL'],
              'api': 'openai-completions',
              'models': [{
                  'id': model,
                  'name': model,
                  'reasoning': False,
                  'input': ['text'],
                  'cost': {'input': 0, 'output': 0, 'cacheRead': 0, 'cacheWrite': 0},
                  'contextWindow': 1_000_000,
                  'maxTokens': 4_096,
                  'compat': {'supportsDeveloperRole': False, 'supportsReasoningEffort': False},
              }],
          }}}
          (Path(os.environ['PI_CODING_AGENT_DIR']) / 'models.json').write_text(json.dumps(payload, indent=2) + '\n')
          PY

      - name: Prepare case
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RESULT_ROOT"
          mkdir -p "$RESULT_ROOT" "$PREP"
          python -m tracecite.root_cause_benchmarking validate "$CASE_DIR" > "$RESULT_ROOT/validate.json"
          python -m tracecite.root_cause_benchmarking prepare "$CASE_DIR" --work-dir "$PREP" > "$RESULT_ROOT/prepare.json"
          PREPARED="$(find "$PREP" -name prepared.json -type f -print -quit)"
          test -n "$PREPARED"
          python - "$PREPARED" >> "$GITHUB_ENV" <<'PY'
          import json, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          inputs = data.get('inputs') or []
          if len(inputs) != 1:
              raise SystemExit(f'expected one input, got {len(inputs)}')
          f = Path(inputs[0]['path']).resolve()
          print(f'INPUT_ROOT={f.parent}')
          print(f'INPUT_FILE={f.name}')
          print(f'INPUT_BYTES={f.stat().st_size}')
          print(f'QUESTION_FILE={Path(data["question"]).resolve()}')
          PY

      - name: Run one paired A/B
        shell: bash
        run: |
          set -euo pipefail
          QUESTION="$(cat "$QUESTION_FILE")"
          BASE_PROMPT='You are a real coding agent investigating supplied runtime evidence. Use only evidence from files in the current working directory; do not use external knowledge. You own hypotheses, causal reasoning, tool choice, investigation order, conclusions, and when to stop. Keep exploration bounded. Every material factual claim must cite exact line numbers you actually observed. Distinguish direct observation from inference and explicitly state when the supplied evidence is insufficient.'

          run_arm() {
            arm="$1"
            mkdir -p "$RESULT_ROOT/pi-${arm}-session"
            cd "$INPUT_ROOT"
            set +e
            if [[ "$arm" == native ]]; then
              timeout -k 30s 600s pi \
                --provider gmi --model "$BENCH_MODEL" --api-key "$OPENAI_API_KEY" \
                --thinking off --mode text --print \
                --session-dir "$RESULT_ROOT/pi-native-session" \
                --tools read,bash,grep,find,ls \
                --no-extensions --no-skills --no-prompt-templates --no-context-files \
                --system-prompt "$BASE_PROMPT" "$QUESTION" \
                > "$RESULT_ROOT/pi-native-answer.md" 2> "$RESULT_ROOT/pi-native-stderr.log"
            else
              TRACE_PROMPT="$BASE_PROMPT TraceCite tools and the TraceCite skill are available. You must use tracecite_search at least once. TraceCite only provides evidence/retrieval semantics and mechanical session_progress; it does not choose hypotheses, investigation targets, causal conclusions, evidence sufficiency, or stopping for you."
              TRACECITE_PI_SESSION="$RESULT_ROOT/tracecite-retrieval-session.json" \
              timeout -k 30s 600s pi \
                --provider gmi --model "$BENCH_MODEL" --api-key "$OPENAI_API_KEY" \
                --thinking off --mode text --print \
                --session-dir "$RESULT_ROOT/pi-tracecite-session" \
                --extension "$GITHUB_WORKSPACE/benchmarks/agent-investigation/pi_tracecite_extension_progress.ts" \
                --tools read,bash,grep,find,ls,tracecite_search,tracecite_expand \
                --no-skills --skill "$GITHUB_WORKSPACE/.pi/skills/tracecite/SKILL.md" \
                --no-prompt-templates --no-context-files \
                --system-prompt "$TRACE_PROMPT" "$QUESTION" \
                > "$RESULT_ROOT/pi-tracecite-answer.md" 2> "$RESULT_ROOT/pi-tracecite-stderr.log"
            fi
            code=$?
            set -e
            echo "$code" > "$RESULT_ROOT/pi-${arm}-exit.txt"
          }

          first="${ARM_ORDER%% *}"
          second="${ARM_ORDER##* }"
          echo "$ARM_ORDER" > "$RESULT_ROOT/arm-order.txt"
          run_arm "$first"
          sleep 5
          run_arm "$second"

      - name: Convert and score
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for arm in native tracecite; do
            SESSION="$(find "$RESULT_ROOT/pi-${arm}-session" -type f -name '*.jsonl' -print -quit 2>/dev/null || true)"
            ANSWER="$RESULT_ROOT/pi-${arm}-answer.md"
            if [[ -z "$SESSION" || ! -f "$ANSWER" ]]; then
              continue
            fi
            python benchmarks/agent-investigation/pi_session_to_transcript.py \
              "$SESSION" "$ANSWER" "$RESULT_ROOT/pi-${arm}-transcript.jsonl" \
              --mode "pi-${arm}" --model "$BENCH_MODEL"
            python -m tracecite.root_cause_benchmarking score \
              "$CASE_DIR" "$RESULT_ROOT/pi-${arm}-transcript.jsonl" \
              > "$RESULT_ROOT/pi-${arm}-legacy-score.json" || true
            if [[ -f "$RESULT_ROOT/pi-${arm}-legacy-score.json" ]]; then
              python benchmarks/agent-investigation/support_level_score.py \
                --gold "$CASE_DIR/gold.json" \
                --answer "$ANSWER" \
                --score "$RESULT_ROOT/pi-${arm}-legacy-score.json" \
                > "$RESULT_ROOT/pi-${arm}-score.json"
            fi
          done

      - name: Summarize comparison
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from collections import Counter
          from pathlib import Path

          root = Path(os.environ['RESULT_ROOT'])
          provider_patterns = (
              ('provider_rate_limited', re.compile(r'\b429\b|rate\s*limit(?:ed)?|overload(?:ed)?', re.I)),
              ('provider_quota_exhausted', re.compile(r'\b402\b|insufficient\s+balance|quota\s+(?:exhausted|exceeded)', re.I)),
              ('provider_unavailable', re.compile(r'\b50[234]\b|service\s+unavailable|bad\s+gateway|gateway\s+timeout', re.I)),
          )

          def arm(name):
              score_path = root / f'pi-{name}-score.json'
              score = json.loads(score_path.read_text()) if score_path.is_file() else {}
              quality = score.get('quality') or {}
              cost = score.get('context_cost') or {}
              transcript = root / f'pi-{name}-transcript.jsonl'
              transcript_text = transcript.read_text(errors='replace') if transcript.is_file() else ''
              stderr = (root / f'pi-{name}-stderr.log').read_text(errors='replace') if (root / f'pi-{name}-stderr.log').is_file() else ''
              session_text = ''
              session_dir = root / f'pi-{name}-session'
              if session_dir.is_dir():
                  for p in session_dir.rglob('*.jsonl'):
                      session_text += '\n' + p.read_text(errors='replace')
              diagnostics = '\n'.join((stderr, transcript_text, session_text))
              provider_failure = None
              for kind, pattern in provider_patterns:
                  if pattern.search(diagnostics):
                      provider_failure = kind
                      break
              exit_path = root / f'pi-{name}-exit.txt'
              exit_code = int(exit_path.read_text().strip()) if exit_path.is_file() else None
              tools = Counter()
              if transcript.is_file():
                  for line in transcript_text.splitlines():
                      try:
                          event = json.loads(line)
                      except Exception:
                          continue
                      if event.get('type') == 'tool':
                          tools[str(event.get('name') or event.get('tool') or 'unknown')] += 1
              return {
                  'exit_code': exit_code,
                  'provider_failure': provider_failure,
                  'valid_for_clean_comparison': exit_code == 0 and provider_failure is None,
                  'answer_success': score.get('support_aware_passed'),
                  'legacy_passed': score.get('legacy_passed'),
                  'dimension_recall': quality.get('dimension_recall'),
                  'supported_dimension_recall': quality.get('supported_dimension_recall'),
                  'evidence_boundary_recall': quality.get('evidence_boundary_recall'),
                  'support_level_accuracy': quality.get('support_level_accuracy'),
                  'unsupported_dimension_overreach_hits': quality.get('unsupported_dimension_overreach_hits'),
                  'model_calls': cost.get('model_calls'),
                  'tool_calls': cost.get('tool_calls'),
                  'reported_input_tokens': cost.get('reported_input_tokens'),
                  'reported_cache_read_input_tokens': cost.get('reported_cache_read_input_tokens'),
                  'reported_output_tokens': cost.get('reported_output_tokens'),
                  'tool_output_chars': cost.get('tool_output_chars'),
                  'tool_names': dict(sorted(tools.items())),
              }

          telemetry = None
          for p in root.rglob('*.telemetry.json'):
              try:
                  telemetry = json.loads(p.read_text())
              except Exception:
                  pass
              if telemetry is not None:
                  break
          report = {
              'schema_version': 1,
              'case_id': os.environ['CASE_ID'],
              'input_bytes': int(os.environ.get('INPUT_BYTES') or 0),
              'arm_order': (root / 'arm-order.txt').read_text().strip() if (root / 'arm-order.txt').is_file() else None,
              'native': arm('native'),
              'tracecite': arm('tracecite'),
              'tracecite_session_telemetry': telemetry,
          }
          report['comparison_valid'] = report['native']['valid_for_clean_comparison'] and report['tracecite']['valid_for_clean_comparison']
          (root / 'comparison.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-progress-once-${{ matrix.case_id }}
          path: ${{ env.RESULT_ROOT }}
          if-no-files-found: warn
