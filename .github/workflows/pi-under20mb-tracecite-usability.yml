name: Pi Under-20MB TraceCite Usability

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/evidence-intelligence
    paths:
      - .github/workflows/pi-under20mb-tracecite-usability.yml
      - benchmarks/agent-investigation/pi_tracecite_bridge.py
      - benchmarks/agent-investigation/pi_tracecite_extension.ts
      - src/tracecite/runtime/repeated_evidence.py
      - tests/test_pi_tracecite_bridge.py
      - tests/test_session_novelty_regressions.py

permissions:
  contents: read

jobs:
  tracecite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - case_id: kubernetes-139417-scale
            case_dir: benchmarks/agent-investigation/scale-cases/kubernetes-139417
          - case_id: kubernetes-140848-scale
            case_dir: benchmarks/agent-investigation/scale-cases/kubernetes-140848
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.TRACECITE_BENCH_BASE_URL || 'https://api.gmi-serving.com/v1' }}
      BENCH_MODEL: ${{ vars.TRACECITE_BENCH_MODEL }}
      PI_CODING_AGENT_DIR: /tmp/pi-agent-config
      PI_SKIP_VERSION_CHECK: "1"
      PI_TELEMETRY: "0"
      CASE_ID: ${{ matrix.case_id }}
      CASE_DIR: ${{ matrix.case_dir }}
      RESULT: /tmp/pi-tracecite-usability/${{ matrix.case_id }}
      PREP: /tmp/pi-tracecite-usability/${{ matrix.case_id }}/prepared

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Pi and TraceCite
        shell: bash
        run: |
          set -euo pipefail
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.84.4
          python -m pip install -e ".[dev]"

      - name: Verify repeated-evidence semantics
        run: |
          python -m pytest -q \
            tests/test_pi_tracecite_bridge.py \
            tests/test_session_novelty_regressions.py \
            tests/test_retrieval_guidance.py

      - name: Configure model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PI_CODING_AGENT_DIR"
          python - <<'PY'
          import json, os
          from pathlib import Path
          model = os.environ['BENCH_MODEL']
          if not model:
              raise SystemExit('BENCH_MODEL is empty')
          payload = {'providers': {'gmi': {
              'name': 'GMI OpenAI-compatible',
              'baseUrl': os.environ['OPENAI_BASE_URL'],
              'api': 'openai-completions',
              'models': [{
                  'id': model,
                  'name': model,
                  'reasoning': False,
                  'input': ['text'],
                  'cost': {'input': 0, 'output': 0, 'cacheRead': 0, 'cacheWrite': 0},
                  'contextWindow': 1_000_000,
                  'maxTokens': 4_096,
                  'compat': {'supportsDeveloperRole': False, 'supportsReasoningEffort': False},
              }],
          }}}
          (Path(os.environ['PI_CODING_AGENT_DIR']) / 'models.json').write_text(json.dumps(payload, indent=2) + '\n')
          PY

      - name: Prepare case
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RESULT"
          mkdir -p "$RESULT" "$PREP"
          python -m tracecite.root_cause_benchmarking validate "$CASE_DIR" > "$RESULT/validate.json"
          python -m tracecite.root_cause_benchmarking prepare "$CASE_DIR" --work-dir "$PREP" > "$RESULT/prepare.json"
          PREPARED="$(find "$PREP" -name prepared.json -type f -print -quit)"
          test -n "$PREPARED"
          python - "$PREPARED" >> "$GITHUB_ENV" <<'PY'
          import json, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          inputs = data.get('inputs') or []
          if len(inputs) != 1:
              raise SystemExit(f'expected one input, got {len(inputs)}')
          f = Path(inputs[0]['path']).resolve()
          print(f'INPUT_ROOT={f.parent}')
          print(f'INPUT_FILE={f.name}')
          print(f'INPUT_BYTES={f.stat().st_size}')
          print(f'QUESTION_FILE={Path(data["question"]).resolve()}')
          PY

      - name: Run TraceCite Pi
        shell: bash
        run: |
          set -euo pipefail
          QUESTION="$(cat "$QUESTION_FILE")"
          BASE_PROMPT='You are a real coding agent investigating supplied runtime evidence. Use only evidence from files in the current working directory; do not use external knowledge. You own hypotheses, causal reasoning, tool choice, investigation order, conclusions, and when to stop. Keep exploration bounded. Every material factual claim must cite exact line numbers you actually observed. Distinguish direct observation from inference and explicitly state when the supplied evidence is insufficient.'
          TRACE_PROMPT="$BASE_PROMPT TraceCite tools and the TraceCite skill are available. You must use tracecite_search at least once. TraceCite only provides evidence/retrieval semantics; it does not choose hypotheses, investigation targets, causal conclusions, or stopping for you."
          mkdir -p "$RESULT/pi-tracecite-session"
          cd "$INPUT_ROOT"
          set +e
          timeout -k 30s 600s pi \
            --provider gmi --model "$BENCH_MODEL" --api-key "$OPENAI_API_KEY" \
            --thinking off --mode text --print \
            --session-dir "$RESULT/pi-tracecite-session" \
            --extension "$GITHUB_WORKSPACE/benchmarks/agent-investigation/pi_tracecite_extension.ts" \
            --tools read,bash,grep,find,ls,tracecite_search,tracecite_expand \
            --no-skills --skill "$GITHUB_WORKSPACE/.pi/skills/tracecite/SKILL.md" \
            --no-prompt-templates --no-context-files \
            --system-prompt "$TRACE_PROMPT" "$QUESTION" \
            > "$RESULT/pi-tracecite-answer.md" 2> "$RESULT/pi-tracecite-stderr.log"
          code=$?
          set -e
          echo "$code" > "$RESULT/pi-tracecite-exit.txt"

      - name: Score and summarize usability
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          SESSION="$(find "$RESULT/pi-tracecite-session" -type f -name '*.jsonl' -print -quit 2>/dev/null || true)"
          if [[ -n "$SESSION" && -f "$RESULT/pi-tracecite-answer.md" ]]; then
            python benchmarks/agent-investigation/pi_session_to_transcript.py \
              "$SESSION" "$RESULT/pi-tracecite-answer.md" "$RESULT/pi-tracecite-transcript.jsonl" \
              --mode pi-tracecite --model "$BENCH_MODEL"
            python -m tracecite.root_cause_benchmarking score \
              "$CASE_DIR" "$RESULT/pi-tracecite-transcript.jsonl" \
              > "$RESULT/pi-tracecite-score.json" || true
          fi

          python - <<'PY'
          import json, os, sys
          from collections import Counter
          from pathlib import Path

          sys.path.insert(0, str(Path('benchmarks/agent-investigation').resolve()))
          from pi_ab_runtime import classify_answer_success, classify_arm_validity

          root = Path(os.environ['RESULT'])
          case_dir = Path(os.environ['CASE_DIR'])
          score_path = root / 'pi-tracecite-score.json'
          transcript_path = root / 'pi-tracecite-transcript.jsonl'
          answer_path = root / 'pi-tracecite-answer.md'
          exit_path = root / 'pi-tracecite-exit.txt'
          stderr_path = root / 'pi-tracecite-stderr.log'

          score = json.loads(score_path.read_text()) if score_path.is_file() else {}
          quality = score.get('quality') or {}
          cost = score.get('context_cost') or {}
          answer = answer_path.read_text(errors='replace') if answer_path.is_file() else ''
          gold = json.loads((case_dir / 'gold.json').read_text())
          exit_code = int(exit_path.read_text().strip()) if exit_path.is_file() else None
          stderr = stderr_path.read_text(errors='replace') if stderr_path.is_file() else ''
          validity = classify_arm_validity(exit_code, stderr)

          tools = Counter()
          search_calls = 0
          searches_with_repeated = 0
          searches_with_existing_refs = 0
          repeated_ref_count = 0
          repeated_ref_missing = 0
          no_new_searches = 0
          if transcript_path.is_file():
              for line in transcript_path.read_text(errors='replace').splitlines():
                  if not line.strip():
                      continue
                  event = json.loads(line)
                  if event.get('type') != 'tool':
                      continue
                  name = str(event.get('name') or 'unknown')
                  tools[name] += 1
                  if name != 'tracecite_search':
                      continue
                  search_calls += 1
                  try:
                      payload = json.loads(str(event.get('output') or '{}'))
                  except json.JSONDecodeError:
                      continue
                  coverage = payload.get('coverage') or {}
                  repeated = int(coverage.get('repeated_evidence') or 0)
                  new = int(coverage.get('new_evidence') or 0)
                  refs = payload.get('matched_existing_evidence') or []
                  if repeated > 0:
                      searches_with_repeated += 1
                      if refs:
                          searches_with_existing_refs += 1
                          repeated_ref_count += len(refs)
                      else:
                          repeated_ref_missing += 1
                  if new == 0:
                      no_new_searches += 1

          answer_success = (
              classify_answer_success(score, gold, answer)
              if validity.valid_for_comparison else None
          )
          trace_used = tools.get('tracecite_search', 0) >= 1
          report = {
              'schema_version': 1,
              'case_id': os.environ['CASE_ID'],
              'input_bytes': int(os.environ.get('INPUT_BYTES') or 0),
              'valid_for_evaluation': validity.valid_for_comparison and trace_used,
              'infrastructure_invalid': validity.infrastructure_invalid,
              'failure_kind': validity.failure_kind,
              'answer_success': answer_success,
              'dimension_recall': quality.get('dimension_recall'),
              'model_calls': cost.get('model_calls'),
              'tool_calls': cost.get('tool_calls'),
              'reported_input_tokens': cost.get('reported_input_tokens'),
              'reported_cache_read_input_tokens': cost.get('reported_cache_read_input_tokens'),
              'reported_output_tokens': cost.get('reported_output_tokens'),
              'tool_output_chars': cost.get('tool_output_chars'),
              'tool_names': dict(sorted(tools.items())),
              'search_calls': search_calls,
              'no_new_searches': no_new_searches,
              'searches_with_repeated_evidence': searches_with_repeated,
              'searches_with_matched_existing_refs': searches_with_existing_refs,
              'matched_existing_ref_count': repeated_ref_count,
              'repeated_ref_projection_gaps': repeated_ref_missing,
              'repeated_ref_projection_ok': repeated_ref_missing == 0,
              'stderr_tail': stderr[-500:] if stderr else '',
          }
          (root / 'usability.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          print(json.dumps(report, indent=2, sort_keys=True))
          if not report['valid_for_evaluation']:
              raise SystemExit('TraceCite usability run invalid; inspect provider/tool validity')
          PY

      - name: Upload usability artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-tracecite-usability-${{ matrix.case_id }}
          path: /tmp/pi-tracecite-usability/${{ matrix.case_id }}
          if-no-files-found: warn
