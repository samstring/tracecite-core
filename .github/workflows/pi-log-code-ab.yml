name: Pi Log + Full Code A/B

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "standard = 140039 + 140848; 140268 = hard case only; all = all runnable cases"
        required: true
        default: standard
        type: choice
        options: [standard, 140268, all]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - id: matrix
        env:
          SCOPE: ${{ inputs.scope }}
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          cases = {
              "140039": {
                  "case_id": "kubernetes-140039-runc-5347-log-code",
                  "case_dir": "benchmarks/agent-investigation/log-code-cases/kubernetes-140039-runc-5347",
                  "arm_order": "native tracecite",
              },
              "140848": {
                  "case_id": "kubernetes-140848-log-code",
                  "case_dir": "benchmarks/agent-investigation/log-code-cases/kubernetes-140848",
                  "arm_order": "native tracecite",
              },
              "140268": {
                  "case_id": "kubernetes-140268-log-code",
                  "case_dir": "benchmarks/agent-investigation/log-code-cases/kubernetes-140268",
                  "arm_order": "tracecite native",
              },
          }
          scope = os.environ['SCOPE']
          selected = (
              [cases['140039'], cases['140848']] if scope == 'standard' else
              [cases['140268']] if scope == '140268' else
              [cases['140039'], cases['140848'], cases['140268']] if scope == 'all' else None
          )
          if selected is None:
              raise SystemExit(f'unknown scope: {scope}')
          print('value=' + json.dumps({'include': selected}, separators=(',', ':')))
          PY

  compare:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.TRACECITE_BENCH_BASE_URL || 'https://api.gmi-serving.com/v1' }}
      BENCH_MODEL: ${{ vars.TRACECITE_BENCH_MODEL }}
      PI_CODING_AGENT_DIR: /tmp/pi-agent-config
      PI_SKIP_VERSION_CHECK: "1"
      PI_TELEMETRY: "0"
      CASE_ID: ${{ matrix.case_id }}
      CASE_DIR: ${{ matrix.case_dir }}
      RESULT_ROOT: /tmp/pi-log-code-ab/${{ matrix.case_id }}/r1
      PREP: /tmp/pi-log-code-ab/${{ matrix.case_id }}/r1/prepared
      WORK_ROOT: /tmp/pi-log-code-ab/${{ matrix.case_id }}/r1/workspace
      SOURCE_BASE: /tmp/pi-log-code-ab/${{ matrix.case_id }}/r1/workspace/source-base
      SOURCE_NATIVE: /tmp/pi-log-code-ab/${{ matrix.case_id }}/r1/workspace/source-native
      SOURCE_TRACECITE: /tmp/pi-log-code-ab/${{ matrix.case_id }}/r1/workspace/source-tracecite
      ARM_ORDER: ${{ matrix.arm_order }}
      TRACECITE_MCP_REF: 09215adbf01bd612b3115186951b9154320c5ca5

    steps:
      - name: Checkout TraceCite Core under test
        uses: actions/checkout@v4

      - name: Checkout pinned TraceCite MCP
        uses: actions/checkout@v4
        with:
          repository: samstring/tracecite-mcp
          ref: ${{ env.TRACECITE_MCP_REF }}
          path: tracecite-mcp

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Pi, current Core, MCP, and adapter
        shell: bash
        run: |
          set -euo pipefail
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.84.4
          mkdir -p "$PI_CODING_AGENT_DIR"
          pi install npm:pi-mcp-adapter@2.27.0 --approve
          python -m pip install -e ".[dev]"
          python -m pip install 'mcp>=2,<3'
          python -m pip install -e ./tracecite-mcp --no-deps
          python - <<'PY'
          import inspect
          from pathlib import Path
          import tracecite, tracecite_mcp
          root = Path.cwd().resolve()
          core_path = Path(inspect.getfile(tracecite)).resolve()
          mcp_path = Path(inspect.getfile(tracecite_mcp)).resolve()
          if root not in core_path.parents:
              raise SystemExit(f'MCP did not resolve current Core checkout: {core_path}')
          if root / 'tracecite-mcp' not in mcp_path.parents:
              raise SystemExit(f'wrong TraceCite MCP checkout imported: {mcp_path}')
          print(f'core={core_path}')
          print(f'mcp={mcp_path}')
          PY

      - name: Verify formal runner contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_session_novelty_regressions.py \
            tests/test_pi_session_to_transcript.py \
            tests/test_root_cause_benchmarking.py \
            tests/test_support_aware_root_cause_benchmarking.py \
            tests/test_benchmark_run_result.py \
            tests/test_log_code_score.py \
            tests/test_pi_mcp_benchmark_boundary.py \
            tests/test_pi_tracecite_formal_flow.py
          python scripts/check_architecture.py
          python -m tracecite.root_cause_benchmarking validate "$CASE_DIR"
          python -m pytest -q tracecite-mcp/tests/test_projection.py tracecite-mcp/tests/test_server.py tracecite-mcp/tests/test_stdio_integration.py

      - name: Configure pinned benchmark model
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}" || { echo 'OPENAI_API_KEY is empty' >&2; exit 2; }
          test -n "${BENCH_MODEL:-}" || { echo 'TRACECITE_BENCH_MODEL is empty' >&2; exit 2; }
          mkdir -p "$PI_CODING_AGENT_DIR"
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {'providers': {'gmi': {
              'name': 'GMI OpenAI-compatible',
              'baseUrl': os.environ['OPENAI_BASE_URL'],
              'api': 'openai-completions',
              'models': [{
                  'id': os.environ['BENCH_MODEL'],
                  'name': os.environ['BENCH_MODEL'],
                  'reasoning': False,
                  'input': ['text'],
                  'cost': {'input': 0, 'output': 0, 'cacheRead': 0, 'cacheWrite': 0},
                  'contextWindow': 1_000_000,
                  'maxTokens': 4_096,
                  'compat': {'supportsDeveloperRole': False, 'supportsReasoningEffort': False},
              }],
          }}}
          (Path(os.environ['PI_CODING_AGENT_DIR']) / 'models.json').write_text(json.dumps(payload, indent=2) + '\n')
          PY

      - name: Prepare failing runtime log
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RESULT_ROOT"
          mkdir -p "$RESULT_ROOT" "$PREP" "$WORK_ROOT/evidence"
          python -m tracecite.root_cause_benchmarking prepare "$CASE_DIR" --work-dir "$PREP" > "$RESULT_ROOT/prepare.json"
          PREPARED="$(find "$PREP" -name prepared.json -type f -print -quit)"
          test -n "$PREPARED"
          python - "$PREPARED" >> "$GITHUB_ENV" <<'PY'
          import json, os, shutil, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          inputs = data.get('inputs') or []
          if len(inputs) != 1:
              raise SystemExit(f'expected exactly one runtime log input, got {len(inputs)}')
          source = Path(inputs[0]['path']).resolve()
          target = Path(os.environ['WORK_ROOT']) / 'evidence' / source.name
          shutil.copyfile(source, target)
          print(f'RUNTIME_LOG={target.resolve()}')
          print(f'RUNTIME_LOG_BYTES={target.stat().st_size}')
          print(f'QUESTION_FILE={Path(data["question"]).resolve()}')
          PY

      - name: Checkout isolated pre-fix source trees
        shell: bash
        run: |
          set -euo pipefail
          eval "$(python - <<'PY'
          import json, os, shlex
          from pathlib import Path
          source = json.loads((Path(os.environ['CASE_DIR']) / 'case.json').read_text())['source_checkout']
          print('SOURCE_REPOSITORY=' + shlex.quote(source['repository']))
          print('SOURCE_COMMIT=' + shlex.quote(source['commit']))
          PY
          )"
          echo "SOURCE_REPOSITORY=$SOURCE_REPOSITORY" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          rm -rf "$SOURCE_BASE" "$SOURCE_NATIVE" "$SOURCE_TRACECITE"
          git init -q "$SOURCE_BASE"
          git -C "$SOURCE_BASE" remote add origin "$SOURCE_REPOSITORY"
          git -C "$SOURCE_BASE" fetch --depth=1 origin "$SOURCE_COMMIT"
          git -C "$SOURCE_BASE" checkout -q --detach FETCH_HEAD
          test "$(git -C "$SOURCE_BASE" rev-parse HEAD)" = "$SOURCE_COMMIT"
          git -C "$SOURCE_BASE" remote remove origin
          cp -a "$SOURCE_BASE" "$SOURCE_NATIVE"
          cp -a "$SOURCE_BASE" "$SOURCE_TRACECITE"
          printf '%s\n' "$SOURCE_COMMIT" > "$RESULT_ROOT/source-commit.txt"
          printf '%s\n' "$TRACECITE_MCP_REF" > "$RESULT_ROOT/tracecite-mcp-ref.txt"

      - name: Run paired formal Agent flows
        shell: bash
        run: |
          set -euo pipefail
          run_arm() {
            arm="$1"
            if [[ "$arm" == native ]]; then
              source_root="$SOURCE_NATIVE"
              extra=()
            else
              source_root="$SOURCE_TRACECITE"
              extra=(
                --skill-dir "$GITHUB_WORKSPACE/tracecite-mcp/skills/tracecite"
                --mcp-evidence-root "$WORK_ROOT/evidence"
                --mcp-state-dir "$RESULT_ROOT/tracecite-mcp-state"
              )
            fi
            set +e
            python benchmarks/agent-investigation/agent_flow_runner.py \
              --agent pi \
              --mode "$arm" \
              --source-root "$source_root" \
              --runtime-log "$RUNTIME_LOG" \
              --result-root "$RESULT_ROOT" \
              --question-file "$QUESTION_FILE" \
              --provider gmi \
              --model "$BENCH_MODEL" \
              --api-key "$OPENAI_API_KEY" \
              --thinking off \
              --timeout-seconds 1200 \
              --host-extension "$GITHUB_WORKSPACE/benchmarks/agent-investigation/pi_log_code_benchmark_host.ts" \
              "${extra[@]}"
            code=$?
            set -e
            echo "$arm runner exit=$code"
          }

          echo "$ARM_ORDER" > "$RESULT_ROOT/arm-order.txt"
          first="${ARM_ORDER%% *}"
          second="${ARM_ORDER##* }"
          run_arm "$first"
          sleep 5
          run_arm "$second"

      - name: Convert and score
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for arm in native tracecite; do
            SESSION="$(find "$RESULT_ROOT/pi-${arm}-session" -type f -name '*.jsonl' -print -quit 2>/dev/null || true)"
            ANSWER="$RESULT_ROOT/pi-${arm}-answer.md"
            EXIT="$RESULT_ROOT/pi-${arm}-exit.txt"
            if [[ -z "$SESSION" || ! -f "$ANSWER" || ! -f "$EXIT" ]]; then
              continue
            fi
            TRANSCRIPT="$RESULT_ROOT/pi-${arm}-transcript.jsonl"
            SCORE="$RESULT_ROOT/pi-${arm}-score.json"
            RUN_RESULT="$RESULT_ROOT/pi-${arm}-run-result.json"
            python benchmarks/agent-investigation/pi_session_to_transcript.py \
              "$SESSION" "$ANSWER" "$TRANSCRIPT" \
              --mode "pi-log-code-${arm}" --model "$BENCH_MODEL"
            python benchmarks/agent-investigation/log_code_score.py "$CASE_DIR" "$TRANSCRIPT" > "$SCORE" || true
            if [[ -f "$SCORE" ]]; then
              python benchmarks/agent-investigation/run_result.py \
                --score "$SCORE" \
                --exit-code-file "$EXIT" \
                --stderr "$RESULT_ROOT/pi-${arm}-stderr.log" \
                --session "$SESSION" \
                --transcript "$TRANSCRIPT" \
                --output "$RUN_RESULT" || true
            fi
          done

      - name: Summarize comparison
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RESULT_ROOT'])

          def read_json(name):
              p = root / name
              return json.loads(p.read_text()) if p.is_file() else None
          def count_jsonl(name):
              p = root / name
              return sum(1 for line in p.read_text().splitlines() if line.strip()) if p.is_file() else 0
          def valid(value):
              return bool(value and (value.get('run_validity') or {}).get('valid_for_comparison'))
          def primary(value):
              if not value:
                  return None
              evaluation = ((value.get('task_result') or {}).get('primary_evaluation') or {})
              tokens = value.get('token_usage') or {}
              validity = value.get('run_validity') or {}
              return {
                  'valid_for_comparison': bool(validity.get('valid_for_comparison')),
                  'validity_reason': validity.get('reason'),
                  'root_cause_accurate': evaluation.get('root_cause_accurate'),
                  'evidence_chain_complete_and_bounded': evaluation.get('evidence_chain_complete_and_bounded'),
                  'evidence_boundary_respected': evaluation.get('evidence_boundary_respected'),
                  'fresh_input_tokens': tokens.get('fresh_input_tokens'),
                  'cached_input_tokens': tokens.get('cached_input_tokens'),
                  'fresh_plus_cached_input_tokens': tokens.get('fresh_plus_cached_input_tokens'),
                  'output_tokens': tokens.get('output_tokens'),
                  'model_calls': tokens.get('model_calls'),
              }
          def token_delta(n, t):
              if not isinstance(n, int) or not isinstance(t, int): return None
              return {
                  'native': n,
                  'tracecite': t,
                  'tracecite_minus_native': t - n,
                  'tracecite_reduction_pct': round((n - t) / n * 100, 1) if n > 0 else None,
              }

          native = read_json('pi-native-run-result.json')
          tracecite = read_json('pi-tracecite-run-result.json')
          native_primary = primary(native)
          trace_primary = primary(tracecite)
          trace_mcp_calls = count_jsonl('tracecite-tracecite-runtime-log-access.jsonl')
          trace_native_calls = count_jsonl('tracecite-native-runtime-evidence-access.jsonl')
          clean_channel = trace_mcp_calls > 0 and trace_native_calls == 0
          clean_pair = valid(native) and valid(tracecite) and trace_mcp_calls > 0
          token_comparison = None
          if clean_pair and native_primary and trace_primary:
              token_comparison = {
                  key: token_delta(native_primary.get(key), trace_primary.get(key))
                  for key in ('fresh_input_tokens', 'cached_input_tokens', 'fresh_plus_cached_input_tokens', 'output_tokens')
              }

          report = {
              'schema_version': 5,
              'case_id': os.environ['CASE_ID'],
              'tracecite_integration': 'formal-agent-runner-explicit-skill-standard-mcp',
              'tracecite_mcp_ref': os.environ['TRACECITE_MCP_REF'],
              'agent_native_capabilities': 'unrestricted-default-for-both-arms',
              'isolated_source_trees': True,
              'primary_comparison': {
                  'clean_pair': clean_pair,
                  'native': native_primary,
                  'tracecite': trace_primary,
                  'token_comparison': token_comparison,
              },
              'tracecite_channel': {
                  'mcp_runtime_evidence_accesses': trace_mcp_calls,
                  'native_runtime_evidence_accesses': trace_native_calls,
                  'clean': clean_channel,
              },
              'native': native,
              'tracecite': tracecite,
          }
          (root / 'comparison.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-log-code-ab-${{ matrix.case_id }}-r1
          path: ${{ env.RESULT_ROOT }}
          if-no-files-found: warn
