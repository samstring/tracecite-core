name: Root Cause 30 Real GitHub

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-root-cause-30-real
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - shard: "01"
            cases: "doublecmd-2264 doublecmd-2616 doublecmd-2731 doublecmd-2772 doublecmd-2777"
          - shard: "02"
            cases: "doublecmd-2809 doublecmd-2815 doublecmd-3061 flutter-179398 kubernetes-140848"
          - shard: "03"
            cases: "prometheus-18018 pulumi-20529 pulumi-14231 pulumi-21700 flutter-167887"
          - shard: "04"
            cases: "flutter-190799 otel-collector-13117 otel-contrib-24908 otel-contrib-16469 envoy-43513"
          - shard: "05"
            cases: "envoy-7154 containerd-8742 containerd-10062 containerd-4795 kubernetes-39480"
          - shard: "06"
            cases: "kubernetes-86676 argocd-25189 argocd-18020 argocd-7898 prometheus-19432"
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.TRACECITE_BENCH_BASE_URL || 'https://api.gmi-serving.com/v1' }}
      BENCH_MODEL: ${{ vars.TRACECITE_BENCH_MODEL }}
      TRACECITE_BENCH_MAX_OUTPUT_TOKENS: "1800"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TraceCite
        run: python -m pip install -e ".[dev]"
      - name: Validate configuration
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY is not configured"; exit 1; }
          test -n "$BENCH_MODEL" || { echo "TRACECITE_BENCH_MODEL is not configured"; exit 1; }
      - name: Run TraceCite shard ${{ matrix.shard }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="/tmp/root-candidate-${{ matrix.shard }}"
          OUT="/tmp/root-candidate-${{ matrix.shard }}-results"
          CASE_ARGS=()
          for case_id in ${{ matrix.cases }}; do CASE_ARGS+=(--case-id "$case_id"); done
          python -m tracecite.root_cause_suite run \
            --repo-root "$GITHUB_WORKSPACE" \
            --work-dir "$WORK" \
            --output-dir "$OUT" \
            --mode tracecite \
            --model "$BENCH_MODEL" \
            --host "$GITHUB_WORKSPACE/benchmarks/agent-investigation/gmi_canonical_host.py" \
            --timeout-seconds 180 \
            "${CASE_ARGS[@]}"
      - name: Upload TraceCite shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-cause-30-tracecite-${{ matrix.shard }}
          path: |
            /tmp/root-candidate-${{ matrix.shard }}/suite-index.json
            /tmp/root-candidate-${{ matrix.shard }}/snapshots
            /tmp/root-candidate-${{ matrix.shard }}-results
          if-no-files-found: warn

  baseline:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - shard: "01"
            cases: "doublecmd-2264 doublecmd-2616 doublecmd-2731 doublecmd-2772 doublecmd-2777"
          - shard: "02"
            cases: "doublecmd-2809 doublecmd-2815 doublecmd-3061 flutter-179398 kubernetes-140848"
          - shard: "03"
            cases: "prometheus-18018 pulumi-20529 pulumi-14231 pulumi-21700 flutter-167887"
          - shard: "04"
            cases: "flutter-190799 otel-collector-13117 otel-contrib-24908 otel-contrib-16469 envoy-43513"
          - shard: "05"
            cases: "envoy-7154 containerd-8742 containerd-10062 containerd-4795 kubernetes-39480"
          - shard: "06"
            cases: "kubernetes-86676 argocd-25189 argocd-18020 argocd-7898 prometheus-19432"
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.TRACECITE_BENCH_BASE_URL || 'https://api.gmi-serving.com/v1' }}
      BENCH_MODEL: ${{ vars.TRACECITE_BENCH_MODEL }}
      TRACECITE_BENCH_MAX_OUTPUT_TOKENS: "1800"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TraceCite
        run: python -m pip install -e ".[dev]"
      - name: Install and verify ripgrep
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ripgrep
          command -v rg
          rg --version
      - name: Run free-shell + rg shard ${{ matrix.shard }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="/tmp/root-baseline-${{ matrix.shard }}"
          OUT="/tmp/root-baseline-${{ matrix.shard }}-results"
          CASE_ARGS=()
          for case_id in ${{ matrix.cases }}; do CASE_ARGS+=(--case-id "$case_id"); done
          python -m tracecite.root_cause_suite run \
            --repo-root "$GITHUB_WORKSPACE" \
            --work-dir "$WORK" \
            --output-dir "$OUT" \
            --mode free_shell \
            --model "$BENCH_MODEL" \
            --host "$GITHUB_WORKSPACE/benchmarks/agent-investigation/gmi_canonical_host.py" \
            --timeout-seconds 180 \
            "${CASE_ARGS[@]}"
      - name: Reject missing-rg transcripts
        shell: bash
        run: |
          if grep -R -F "No such file or directory: 'rg'" "/tmp/root-baseline-${{ matrix.shard }}-results"; then
            echo "free-shell baseline did not have a usable rg binary" >&2
            exit 1
          fi
      - name: Upload free-shell shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-cause-30-free-shell-rg-${{ matrix.shard }}
          path: |
            /tmp/root-baseline-${{ matrix.shard }}/suite-index.json
            /tmp/root-baseline-${{ matrix.shard }}/snapshots
            /tmp/root-baseline-${{ matrix.shard }}-results
          if-no-files-found: warn

  aggregate:
    needs: [candidate, baseline]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TraceCite
        run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          pattern: root-cause-30-tracecite-*
          path: /tmp/root-candidate-artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: root-cause-30-free-shell-rg-*
          path: /tmp/root-baseline-artifacts
      - name: Aggregate both modes
        shell: bash
        run: |
          set -euo pipefail
          for mode in tracecite free_shell; do
            if [ "$mode" = tracecite ]; then SRC=/tmp/root-candidate-artifacts; OUT=/tmp/root-summary/tracecite; else SRC=/tmp/root-baseline-artifacts; OUT=/tmp/root-summary/free_shell; fi
            mkdir -p "$OUT/scores" "$OUT/failures"
            find "$SRC" -path '*/scores/*.json' -type f -exec cp {} "$OUT/scores/" \;
            find "$SRC" -path '*/failures/*.json' -type f -exec cp {} "$OUT/failures/" \;
            python -m tracecite.root_cause_suite aggregate --output-dir "$OUT" --mode "$mode" > "$OUT/batch-summary.json"
            cat "$OUT/batch-summary.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: root-cause-30-paired-summary
          path: /tmp/root-summary
