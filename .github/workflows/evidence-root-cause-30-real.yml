name: Root Cause 30 Real GitHub

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/evidence-intelligence
    paths:
      - .github/workflows/evidence-root-cause-30-real.yml
      - src/tracecite/root_cause_suite.py
      - src/tracecite/root_cause_benchmarking.py
      - src/tracecite/runtime/retrieve_contract.py
      - src/tracecite/runtime/__init__.py
      - benchmarks/agent-investigation/gmi_canonical_host.py
      - benchmarks/agent-investigation/run_host.py
      - tests/test_root_cause_suite.py
      - tests/test_runtime_agent_api.py
      - tests/test_gmi_canonical_host.py

permissions:
  contents: read

concurrency:
  group: evidence-root-cause-30-real
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.TRACECITE_BENCH_BASE_URL || 'https://api.gmi-serving.com/v1' }}
      BENCH_MODEL: ${{ vars.TRACECITE_BENCH_MODEL }}
      TRACECITE_BENCH_MAX_OUTPUT_TOKENS: "1800"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TraceCite
        run: python -m pip install -e ".[dev]"
      - name: Validate configuration
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY is not configured"; exit 1; }
          test -n "$BENCH_MODEL" || { echo "TRACECITE_BENCH_MODEL is not configured"; exit 1; }
      - name: Run canonical smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/root-smoke /tmp/root-smoke-results
          python -m tracecite.root_cause_suite run \
            --repo-root "$GITHUB_WORKSPACE" \
            --work-dir /tmp/root-smoke \
            --output-dir /tmp/root-smoke-results \
            --mode tracecite \
            --model "$BENCH_MODEL" \
            --host "$GITHUB_WORKSPACE/benchmarks/agent-investigation/gmi_canonical_host.py" \
            --timeout-seconds 180 \
            --case-id prometheus-19432
      - name: Require completed smoke
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('/tmp/root-smoke-results/batch-summary.json')
          summary = json.loads(path.read_text())
          print(json.dumps(summary, indent=2, sort_keys=True))
          if int(summary.get('completed', 0)) != 1:
              raise SystemExit('root-cause smoke did not produce a scored result')
          PY
      - name: Upload smoke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-cause-30-smoke
          path: |
            /tmp/root-smoke/suite-index.json
            /tmp/root-smoke/snapshots
            /tmp/root-smoke-results
          if-no-files-found: warn

  candidate:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - shard: "01"
            cases: "doublecmd-2264 doublecmd-2616 doublecmd-2731 doublecmd-2772 doublecmd-2777"
          - shard: "02"
            cases: "doublecmd-2809 doublecmd-2815 doublecmd-3061 flutter-179398 kubernetes-140848"
          - shard: "03"
            cases: "prometheus-18018 pulumi-20529 pulumi-14231 pulumi-21700 flutter-167887"
          - shard: "04"
            cases: "flutter-190799 otel-collector-13117 otel-contrib-24908 otel-contrib-16469 envoy-43513"
          - shard: "05"
            cases: "envoy-7154 containerd-8742 containerd-10062 containerd-4795 kubernetes-39480"
          - shard: "06"
            cases: "kubernetes-86676 argocd-25189 argocd-18020 argocd-7898 prometheus-19432"
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.TRACECITE_BENCH_BASE_URL || 'https://api.gmi-serving.com/v1' }}
      BENCH_MODEL: ${{ vars.TRACECITE_BENCH_MODEL }}
      TRACECITE_BENCH_MAX_OUTPUT_TOKENS: "1800"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TraceCite
        run: python -m pip install -e ".[dev]"
      - name: Run TraceCite shard ${{ matrix.shard }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="/tmp/root-candidate-${{ matrix.shard }}"
          OUT="/tmp/root-candidate-${{ matrix.shard }}-results"
          rm -rf "$WORK" "$OUT"
          CASE_ARGS=()
          for case_id in ${{ matrix.cases }}; do
            CASE_ARGS+=(--case-id "$case_id")
          done
          python -m tracecite.root_cause_suite run \
            --repo-root "$GITHUB_WORKSPACE" \
            --work-dir "$WORK" \
            --output-dir "$OUT" \
            --mode tracecite \
            --model "$BENCH_MODEL" \
            --host "$GITHUB_WORKSPACE/benchmarks/agent-investigation/gmi_canonical_host.py" \
            --timeout-seconds 180 \
            "${CASE_ARGS[@]}"
      - name: Print shard summary
        if: always()
        run: cat /tmp/root-candidate-${{ matrix.shard }}-results/batch-summary.json 2>/dev/null || true
      - name: Upload TraceCite shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-cause-30-tracecite-${{ matrix.shard }}
          path: |
            /tmp/root-candidate-${{ matrix.shard }}/suite-index.json
            /tmp/root-candidate-${{ matrix.shard }}/snapshots
            /tmp/root-candidate-${{ matrix.shard }}-results
          if-no-files-found: warn

  candidate-aggregate:
    needs: candidate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TraceCite
        run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          pattern: root-cause-30-tracecite-*
          path: /tmp/root-candidate-artifacts
      - name: Aggregate TraceCite results
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/root-candidate-combined/scores /tmp/root-candidate-combined/failures
          find /tmp/root-candidate-artifacts -path '*/scores/*.json' -type f -exec cp {} /tmp/root-candidate-combined/scores/ \;
          find /tmp/root-candidate-artifacts -path '*/failures/*.json' -type f -exec cp {} /tmp/root-candidate-combined/failures/ \;
          python -m tracecite.root_cause_suite aggregate \
            --output-dir /tmp/root-candidate-combined --mode tracecite \
            > /tmp/root-candidate-combined/batch-summary.json
          cat /tmp/root-candidate-combined/batch-summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('/tmp/root-candidate-combined/batch-summary.json').read_text())
          observed = int(summary.get('scores', 0)) + int(summary.get('failures', 0))
          if observed != 30:
              raise SystemExit(f'expected 30 TraceCite case results, got {observed}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: root-cause-30-tracecite-summary
          path: /tmp/root-candidate-combined

  baseline:
    needs: candidate-aggregate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - shard: "01"
            cases: "doublecmd-2264 doublecmd-2616 doublecmd-2731 doublecmd-2772 doublecmd-2777"
          - shard: "02"
            cases: "doublecmd-2809 doublecmd-2815 doublecmd-3061 flutter-179398 kubernetes-140848"
          - shard: "03"
            cases: "prometheus-18018 pulumi-20529 pulumi-14231 pulumi-21700 flutter-167887"
          - shard: "04"
            cases: "flutter-190799 otel-collector-13117 otel-contrib-24908 otel-contrib-16469 envoy-43513"
          - shard: "05"
            cases: "envoy-7154 containerd-8742 containerd-10062 containerd-4795 kubernetes-39480"
          - shard: "06"
            cases: "kubernetes-86676 argocd-25189 argocd-18020 argocd-7898 prometheus-19432"
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.TRACECITE_BENCH_BASE_URL || 'https://api.gmi-serving.com/v1' }}
      BENCH_MODEL: ${{ vars.TRACECITE_BENCH_MODEL }}
      TRACECITE_BENCH_MAX_OUTPUT_TOKENS: "1800"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TraceCite
        run: python -m pip install -e ".[dev]"
      - name: Run free-shell shard ${{ matrix.shard }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="/tmp/root-baseline-${{ matrix.shard }}"
          OUT="/tmp/root-baseline-${{ matrix.shard }}-results"
          rm -rf "$WORK" "$OUT"
          CASE_ARGS=()
          for case_id in ${{ matrix.cases }}; do
            CASE_ARGS+=(--case-id "$case_id")
          done
          python -m tracecite.root_cause_suite run \
            --repo-root "$GITHUB_WORKSPACE" \
            --work-dir "$WORK" \
            --output-dir "$OUT" \
            --mode free_shell \
            --model "$BENCH_MODEL" \
            --host "$GITHUB_WORKSPACE/benchmarks/agent-investigation/gmi_canonical_host.py" \
            --timeout-seconds 180 \
            "${CASE_ARGS[@]}"
      - name: Print shard summary
        if: always()
        run: cat /tmp/root-baseline-${{ matrix.shard }}-results/batch-summary.json 2>/dev/null || true
      - name: Upload free-shell shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-cause-30-free-shell-${{ matrix.shard }}
          path: |
            /tmp/root-baseline-${{ matrix.shard }}/suite-index.json
            /tmp/root-baseline-${{ matrix.shard }}/snapshots
            /tmp/root-baseline-${{ matrix.shard }}-results
          if-no-files-found: warn

  baseline-aggregate:
    needs: baseline
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TraceCite
        run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          pattern: root-cause-30-free-shell-*
          path: /tmp/root-baseline-artifacts
      - name: Aggregate free-shell results
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/root-baseline-combined/scores /tmp/root-baseline-combined/failures
          find /tmp/root-baseline-artifacts -path '*/scores/*.json' -type f -exec cp {} /tmp/root-baseline-combined/scores/ \;
          find /tmp/root-baseline-artifacts -path '*/failures/*.json' -type f -exec cp {} /tmp/root-baseline-combined/failures/ \;
          python -m tracecite.root_cause_suite aggregate \
            --output-dir /tmp/root-baseline-combined --mode free_shell \
            > /tmp/root-baseline-combined/batch-summary.json
          cat /tmp/root-baseline-combined/batch-summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('/tmp/root-baseline-combined/batch-summary.json').read_text())
          observed = int(summary.get('scores', 0)) + int(summary.get('failures', 0))
          if observed != 30:
              raise SystemExit(f'expected 30 free-shell case results, got {observed}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: root-cause-30-free-shell-summary
          path: /tmp/root-baseline-combined

  compare:
    needs: [candidate-aggregate, baseline-aggregate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: root-cause-30-tracecite-summary
          path: /tmp/root-compare/tracecite-summary
      - uses: actions/download-artifact@v4
        with:
          name: root-cause-30-free-shell-summary
          path: /tmp/root-compare/free-shell-summary
      - uses: actions/download-artifact@v4
        with:
          pattern: root-cause-30-tracecite-*
          path: /tmp/root-compare/tracecite-shards
      - uses: actions/download-artifact@v4
        with:
          pattern: root-cause-30-free-shell-*
          path: /tmp/root-compare/free-shell-shards
      - name: Build paired comparison
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/root-compare/output
          python - <<'PY'
          import json
          from pathlib import Path

          def load_summary(root):
              return json.loads((Path(root) / 'batch-summary.json').read_text())

          def transcript_metrics(root, mode):
              root = Path(root)
              metrics = {
                  'runs': 0,
                  'model_calls': 0,
                  'tool_calls': 0,
                  'tool_output_chars': 0,
                  'reported_input_tokens': 0,
                  'reported_output_tokens': 0,
                  'reported_cached_input_tokens': 0,
                  'attempted_context_requests': 0,
                  'cumulative_attempted_context_chars': 0,
                  'peak_attempted_context_chars': 0,
                  'host_errors': {},
              }
              for path in root.rglob(f'*-{mode}.jsonl'):
                  metrics['runs'] += 1
                  for line in path.read_text(encoding='utf-8').splitlines():
                      if not line.strip():
                          continue
                      try:
                          event = json.loads(line)
                      except json.JSONDecodeError:
                          continue
                      kind = event.get('type')
                      if kind == 'model':
                          metrics['model_calls'] += 1
                          usage = event.get('usage') or {}
                          metrics['reported_input_tokens'] += int(usage.get('input_tokens') or 0)
                          metrics['reported_output_tokens'] += int(usage.get('output_tokens') or 0)
                          metrics['reported_cached_input_tokens'] += int(usage.get('cached_input_tokens') or 0)
                      elif kind == 'tool':
                          metrics['tool_calls'] += 1
                          output = event.get('output', '')
                          if not isinstance(output, str):
                              output = json.dumps(output, ensure_ascii=False, sort_keys=True)
                          metrics['tool_output_chars'] += len(output)
                      elif kind == 'request_context':
                          chars = int(event.get('serialized_chars') or 0)
                          metrics['attempted_context_requests'] += 1
                          metrics['cumulative_attempted_context_chars'] += chars
                          metrics['peak_attempted_context_chars'] = max(metrics['peak_attempted_context_chars'], chars)
                      elif kind == 'host_error':
                          reason = str(event.get('failure_reason') or event.get('error') or 'host_error')
                          metrics['host_errors'][reason] = metrics['host_errors'].get(reason, 0) + 1
              return metrics

          tc = load_summary('/tmp/root-compare/tracecite-summary')
          fs = load_summary('/tmp/root-compare/free-shell-summary')
          tc_metrics = transcript_metrics('/tmp/root-compare/tracecite-shards', 'tracecite')
          fs_metrics = transcript_metrics('/tmp/root-compare/free-shell-shards', 'free_shell')

          def pass_rate(summary):
              scores = int(summary.get('scores', 0))
              return (int(summary.get('score_passed', 0)) / scores) if scores else None

          comparison = {
              'suite': 'github-root-cause-30',
              'tracecite': {'quality': tc, 'all_transcripts': tc_metrics, 'pass_rate_scored': pass_rate(tc)},
              'free_shell': {'quality': fs, 'all_transcripts': fs_metrics, 'pass_rate_scored': pass_rate(fs)},
              'paired': {
                  'score_pass_delta': int(tc.get('score_passed', 0)) - int(fs.get('score_passed', 0)),
                  'reported_input_token_ratio_tracecite_over_free_shell': (
                      tc_metrics['reported_input_tokens'] / fs_metrics['reported_input_tokens']
                      if fs_metrics['reported_input_tokens'] else None
                  ),
                  'tool_output_char_ratio_tracecite_over_free_shell': (
                      tc_metrics['tool_output_chars'] / fs_metrics['tool_output_chars']
                      if fs_metrics['tool_output_chars'] else None
                  ),
                  'attempted_context_char_ratio_tracecite_over_free_shell': (
                      tc_metrics['cumulative_attempted_context_chars'] / fs_metrics['cumulative_attempted_context_chars']
                      if fs_metrics['cumulative_attempted_context_chars'] else None
                  ),
              },
          }
          out = Path('/tmp/root-compare/output/comparison.json')
          out.write_text(json.dumps(comparison, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(out.read_text())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: root-cause-30-paired-comparison
          path: /tmp/root-compare/output
