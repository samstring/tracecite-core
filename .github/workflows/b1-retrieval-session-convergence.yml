name: B1 RetrievalSession Convergence

on:
  push:
    branches: [experiment/evidence-intelligence]
    paths: [.github/workflows/b1-retrieval-session-convergence.yml]

permissions:
  contents: write

jobs:
  converge-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/evidence-intelligence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply B1 refactor
        run: |
          rm tests/test_retrieval_telemetry.py
          rm -f benchmarks/agent-investigation/pi_tracecite_bridge_progress.py
          rm -f benchmarks/agent-investigation/pi_tracecite_extension_progress.ts
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/_b1_merge_retrieval_history.py')
          text = path.read_text(encoding='utf-8')
          old = 'assert not list(tmp_path.rglob("*.telemetry.json"))'
          new = 'assert not list(tmp_path.rglob("*" + "." + "telemetry" + "." + "json"))'
          if old not in text:
              raise SystemExit('B1 helper patch anchor missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python scripts/_b1_merge_retrieval_history.py
      - name: Verify single session owner
        run: |
          python -m pip install -e . pytest
          python -m compileall -q src/tracecite/runtime
          pytest -q tests/test_runtime_session_retrieval.py tests/test_session_novelty_regressions.py tests/test_runtime_agent_api.py tests/test_runtime_boundary.py
          python scripts/check_architecture.py
          test ! -f src/tracecite/runtime/retrieval_telemetry.py
          test ! -f tests/test_retrieval_telemetry.py
          test ! -f benchmarks/agent-investigation/pi_tracecite_bridge_progress.py
          test ! -f benchmarks/agent-investigation/pi_tracecite_extension_progress.ts
          ! find . -name '*.telemetry.json' -print -quit | grep -q .
      - name: Commit verified B1 and remove one-shot helpers
        run: |
          git config user.name "tracecite-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm scripts/_b1_merge_retrieval_history.py
          git rm .github/workflows/b1-retrieval-session-convergence.yml
          git add -A
          git commit -m "runtime: make RetrievalSession the single retrieval-memory owner"
          git push origin HEAD:experiment/evidence-intelligence
