name: Evidence No-Harm Regression

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/evidence-intelligence
    paths:
      - .github/workflows/evidence-no-harm-regression.yml
      - src/tracecite/runtime/evidence_routing.py
      - src/tracecite/runtime/retrieve_contract.py
      - src/tracecite/runtime/evidence_ambiguity.py
      - src/tracecite/integrations/agent_projection.py
      - benchmarks/agent-investigation/gmi_canonical_host.py
      - benchmarks/agent-investigation/run_paired_retry.py

permissions:
  contents: read

concurrency:
  group: evidence-no-harm-regression
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        case:
          - id: flutter-179398
            dir: benchmarks/agent-investigation/cases/flutter-179398
            scorer: legacy
            tracecite_must_pass: true
          - id: mobile-payment-runtime-evidence
            dir: benchmarks/agent-investigation/cases/mobile-payment-runtime-evidence
            scorer: legacy
            tracecite_must_pass: true
          - id: kubernetes-140268-scale
            dir: benchmarks/agent-investigation/scale-cases/kubernetes-140268
            scorer: root
            tracecite_must_pass: true
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.TRACECITE_BENCH_BASE_URL || 'https://api.gmi-serving.com/v1' }}
      BENCH_MODEL: ${{ vars.TRACECITE_BENCH_MODEL }}
      TRACECITE_BENCH_MAX_OUTPUT_TOKENS: "1800"
      TRACECITE_BENCH_MAX_ROUNDS: "12"
      TRACECITE_BENCH_NO_GROWTH_ROUNDS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TraceCite
        run: python -m pip install -e ".[dev]"
      - name: Install and verify ripgrep
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ripgrep
          fi
          rg --version
      - name: Prepare immutable evidence once for the pair
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/tmp/no-harm-${{ matrix.case.id }}"
          PREP="$ROOT/prepared"
          RESULT="$ROOT/result"
          rm -rf "$ROOT"
          mkdir -p "$PREP" "$RESULT"
          python -m tracecite.benchmarking validate "${{ matrix.case.dir }}" > "$RESULT/validate.json"
          python -m tracecite.benchmarking prepare "${{ matrix.case.dir }}" \
            --work-dir "$PREP" > "$RESULT/prepare.json"
          PREPARED="$(find "$PREP" -name prepared.json -type f -print -quit)"
          test -n "$PREPARED"
          echo "PAIR_RESULT=$RESULT" >> "$GITHUB_ENV"
          echo "PREPARED=$PREPARED" >> "$GITHUB_ENV"
      - name: Run focused pair with provider retry
        shell: bash
        run: |
          set -euo pipefail
          python benchmarks/agent-investigation/run_paired_retry.py \
            "${{ matrix.case.dir }}" "$PREPARED" \
            --case-id "${{ matrix.case.id }}" \
            --scorer "${{ matrix.case.scorer }}" \
            --model "$BENCH_MODEL" \
            --result-dir "$PAIR_RESULT" \
            --retry-delay-seconds 120 \
            --timeout-seconds 900
      - name: Enforce focused correctness
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['PAIR_RESULT'])
          pair = json.loads((root / 'pair.json').read_text())
          rows = {row['mode']: row for row in pair['outcomes']}
          shell = rows['free_shell']
          trace = rows['tracecite']
          if shell.get('passed') is True and trace.get('passed') is not True:
              raise SystemExit(
                  f"no-harm regression: shell passed but TraceCite did not: {trace}"
              )
          if trace.get('passed') is not True:
              raise SystemExit(
                  f"focused regression unresolved: TraceCite must pass this case: {trace}"
              )
          print(json.dumps({
              'case_id': trace.get('case_id'),
              'shell_passed': shell.get('passed'),
              'tracecite_passed': trace.get('passed'),
              'shell_quality': shell.get('primary_quality'),
              'tracecite_quality': trace.get('primary_quality'),
              'shell_input_tokens': (shell.get('context_cost') or {}).get('reported_input_tokens'),
              'tracecite_input_tokens': (trace.get('context_cost') or {}).get('reported_input_tokens'),
          }, indent=2, sort_keys=True))
          PY
      - name: Upload focused result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: no-harm-${{ matrix.case.id }}
          path: /tmp/no-harm-${{ matrix.case.id }}/result
          if-no-files-found: warn
