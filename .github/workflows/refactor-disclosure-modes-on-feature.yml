name: Disclosure mode migration

on:
  push:
    branches:
      - feature_for_agent

permissions:
  contents: write

jobs:
  migrate:
    if: "${{ github.event.head_commit.message == 'chore: run disclosure mode migration' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Apply disclosure mode migration
        run: |
          python scripts/refactor_disclosure_modes_once.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_evidence_routing.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    assert payload["data"]["routing"]["next_mode"] == "progressive"\n',
              '    assert "next_mode" not in payload["data"]["routing"]\n',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run focused regressions
        run: |
          python -m pytest tests/test_evidence_routing.py tests/test_retrieval_guidance.py tests/test_runtime_schema_tools.py tests/test_session_novelty_regressions.py
          python scripts/check_architecture.py

      - name: Run full Core test suite
        run: python -m pytest -W error::DeprecationWarning

      - name: Commit validated migration
        run: |
          rm .github/workflows/refactor-disclosure-modes-on-feature.yml
          rm scripts/refactor_disclosure_modes_once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: collapse disclosure modes into direct and progressive'
          git push origin HEAD:feature_for_agent
