name: Pi RCAEval MB Source Prep Experiment A/B

on:
  push:
    branches:
      - exp/rcaeval-source-cache-v1
    paths:
      - .github/workflows/pi-rcaeval-mb-source-prep-experiment-ab.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-rcaeval-mb-source-prep-experiment-ab
  cancel-in-progress: false

jobs:
  prepare-evidence:
    name: prepare neutral 100MB+ evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and neutralize RCAEval case
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet huggingface_hub pandas pyarrow
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from huggingface_hub import snapshot_download

          source_case = "re3tt_ts-route-service_f3_6"
          srcroot = Path('/tmp/rcaeval-source')
          out = Path('/tmp/rcaeval-neutral-evidence')
          out.mkdir(parents=True, exist_ok=True)
          snapshot_download(repo_id='phamquiluan/RCAEval', repo_type='dataset', allow_patterns=[f'{source_case}/*'], local_dir=srcroot)
          src = srcroot / source_case
          metrics = pd.read_parquet(src / 'metrics.parquet')
          logs = pd.read_parquet(src / 'logs.parquet')
          traces = pd.read_parquet(src / 'traces.parquet')
          onset = int((src / 'inject_time.txt').read_text().strip())
          metrics.to_csv(out / 'metrics.csv', index=False)
          logs.to_json(out / 'logs.jsonl', orient='records', lines=True, force_ascii=False)
          traces.to_json(out / 'traces.jsonl', orient='records', lines=True, force_ascii=False)
          (out / 'incident.txt').write_text(
              'System: Train Ticket microservices\n'
              f'Known incident onset (Unix seconds): {onset}\n'
              'Telemetry covers the normal and faulty window around this onset.\n',
              encoding='utf-8')
          files=['metrics.csv','logs.jsonl','traces.jsonl','incident.txt']
          manifest={
              'system':'Train Ticket','incident_onset_unix':onset,
              'files':{p:(out/p).stat().st_size for p in files},
              'rows':{'metrics':len(metrics),'logs':len(logs),'traces':len(traces)},
              'metric_series':max(0,len(metrics.columns)-1),
              'correctness':None,'correctness_source':'manual_review'}
          manifest['total_bytes']=sum(manifest['files'].values())
          (out/'evidence-manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          print(json.dumps(manifest,indent=2,sort_keys=True))
          assert manifest['total_bytes'] >= 5*1024*1024
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rcaeval-source-prep-neutral-evidence
          path: /tmp/rcaeval-neutral-evidence
          retention-days: 7

  run-ab:
    name: ${{ matrix.slot }} native then TraceCite
    needs: prepare-evidence
    strategy:
      fail-fast: false
      matrix:
        slot: [gmi1, gmi2]
    runs-on: ubuntu-latest
    env:
      GMI_BASE_URL: https://api.gmi-serving.com/v1
      PI_CODING_AGENT_DIR: /tmp/pi-agent-rcaeval-source-prep-${{ matrix.slot }}
      PI_SKIP_VERSION_CHECK: "1"
      PI_TELEMETRY: "0"
      EVIDENCE_ROOT: /tmp/rcaeval-source-prep/evidence
      RESULT_ROOT: /tmp/rcaeval-source-prep/results
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Select model slot
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.slot }}" == "gmi1" ]]; then
            echo 'BENCH_MODEL=${{ vars.GMI1_MODEL }}' >> "$GITHUB_ENV"
            echo 'BENCH_API_KEY=${{ secrets.GMI1_API_KEY }}' >> "$GITHUB_ENV"
          else
            echo 'BENCH_MODEL=${{ vars.GMI2_MODEL }}' >> "$GITHUB_ENV"
            echo 'BENCH_API_KEY=${{ secrets.GMI2_API_KEY }}' >> "$GITHUB_ENV"
          fi
      - name: Install Pi and configure model
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BENCH_MODEL"; test -n "$BENCH_API_KEY"
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.84.4
          mkdir -p "$PI_CODING_AGENT_DIR" "$RESULT_ROOT" "$EVIDENCE_ROOT"
          python - <<'PY'
          import json, os
          from pathlib import Path
          m=os.environ['BENCH_MODEL']
          p={'providers':{'gmi':{'name':'GMI OpenAI-compatible','baseUrl':os.environ['GMI_BASE_URL'],'api':'openai-completions','models':[{'id':m,'name':m,'reasoning':False,'input':['text'],'cost':{'input':0,'output':0,'cacheRead':0,'cacheWrite':0},'contextWindow':1000000,'maxTokens':4096,'compat':{'supportsDeveloperRole':False,'supportsReasoningEffort':False}}]}}}
          (Path(os.environ['PI_CODING_AGENT_DIR'])/'models.json').write_text(json.dumps(p,indent=2)+'\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: rcaeval-source-prep-neutral-evidence
          path: /tmp/rcaeval-source-prep/evidence
      - name: Run Native unbounded
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RESULT_ROOT/native-session"
          cd "$EVIDENCE_ROOT"
          PROMPT="A production incident occurred in a Train Ticket microservice deployment. The supplied telemetry covers the incident window and incident.txt gives the known onset time. Determine the root-cause service and the concrete failure mechanism. Explain the causal chain from the root cause to downstream symptoms. Use only supplied evidence and cite exact evidence lines for material claims. Use only evidence files in the current working directory and do not use external knowledge."
          start=$(date +%s); set +e
          pi --provider gmi --model "$BENCH_MODEL" --api-key "$BENCH_API_KEY" --thinking off --mode text --print \
            --session-dir "$RESULT_ROOT/native-session" --tools read,bash,grep,find,ls \
            --no-extensions --no-skills --no-prompt-templates --no-context-files \
            --system-prompt "$PROMPT" "Investigate this incident and report the root cause." \
            > "$RESULT_ROOT/native-answer.md" 2> "$RESULT_ROOT/native-stderr.log"
          code=$?; set -e
          echo "$code" > "$RESULT_ROOT/native-exit.txt"
          echo "$(( $(date +%s)-start ))" > "$RESULT_ROOT/native-wall-seconds.txt"
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          path: tracecite-core
      - name: Apply source-preparation experiment and install TraceCite
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/tracecite-core"
          # Experimental only: the benchmark evidence artifact is immutable for the job.
          # Avoid creating a fresh full-file snapshot on every distinct Pi search.
          python - <<'PY'
          from pathlib import Path
          p=Path('benchmarks/agent-investigation/pi_tracecite_bridge.py')
          s=p.read_text()
          old='''            snapshot=True,\n            max_evidence=args.max_evidence,'''
          new='''            snapshot=False,\n            max_evidence=args.max_evidence,'''
          if old not in s:
              raise SystemExit('expected Pi bridge snapshot=True block not found')
          p.write_text(s.replace(old,new,1))
          PY
          grep -n -A4 'target = QueryTarget' benchmarks/agent-investigation/pi_tracecite_bridge.py
          python -m pip install -e '.[dev,diversity]'
          python -m pytest -q tests/test_pi_four_public_strict_boundary.py tests/test_pi_tracecite_runtime_neutral.py tests/test_session_novelty_regressions.py
      - name: Convert Native transcript
        if: always()
        shell: bash
        run: |
          set -u
          S="$(find "$RESULT_ROOT/native-session" -type f -name '*.jsonl' -print -quit 2>/dev/null || true)"
          if [[ -n "$S" ]]; then python "$GITHUB_WORKSPACE/tracecite-core/benchmarks/agent-investigation/pi_session_to_transcript.py" "$S" "$RESULT_ROOT/native-answer.md" "$RESULT_ROOT/native-transcript.jsonl" --mode pi-native --model "$BENCH_MODEL" || true; fi
      - name: Run TraceCite unbounded with snapshot-copy experiment
        shell: bash
        run: |
          set -euo pipefail
          sleep 30
          mkdir -p "$RESULT_ROOT/tracecite-session"
          export TRACECITE_EVIDENCE_ROOT="$EVIDENCE_ROOT"
          export TRACECITE_EVIDENCE_FILES="metrics.csv,logs.jsonl,traces.jsonl,incident.txt"
          export TRACECITE_PI_ACTIVITY="$RESULT_ROOT/tracecite-host-tool-activity.json"
          PROMPT="A production incident occurred in a Train Ticket microservice deployment. The supplied telemetry covers the incident window and incident.txt gives the known onset time. Determine the root-cause service and the concrete failure mechanism. Explain the causal chain from the root cause to downstream symptoms. Use only supplied evidence and cite exact evidence lines for material claims. All telemetry content must be obtained through TraceCite tools; do not use native file-access tools for the evidence."
          cd "$EVIDENCE_ROOT"
          start=$(date +%s); set +e
          pi --provider gmi --model "$BENCH_MODEL" --api-key "$BENCH_API_KEY" --thinking off --mode text --print \
            --session-dir "$RESULT_ROOT/tracecite-session" \
            --extension "$GITHUB_WORKSPACE/tracecite-core/benchmarks/agent-investigation/pi_tracecite_extension.ts" \
            --tools tracecite_search,tracecite_expand --no-skills --skill "$GITHUB_WORKSPACE/tracecite-core/.pi/skills/tracecite/SKILL.md" \
            --no-prompt-templates --no-context-files --system-prompt "$PROMPT" \
            "用 tracecite 调查这个 incident 并报告根因。" \
            > "$RESULT_ROOT/tracecite-answer.md" 2> "$RESULT_ROOT/tracecite-stderr.log"
          code=$?; set -e
          echo "$code" > "$RESULT_ROOT/tracecite-exit.txt"
          echo "$(( $(date +%s)-start ))" > "$RESULT_ROOT/tracecite-wall-seconds.txt"
      - name: Convert TraceCite transcript and summarize telemetry
        if: always()
        shell: bash
        run: |
          set -u
          S="$(find "$RESULT_ROOT/tracecite-session" -type f -name '*.jsonl' -print -quit 2>/dev/null || true)"
          if [[ -n "$S" ]]; then python "$GITHUB_WORKSPACE/tracecite-core/benchmarks/agent-investigation/pi_session_to_transcript.py" "$S" "$RESULT_ROOT/tracecite-answer.md" "$RESULT_ROOT/tracecite-transcript.jsonl" --mode pi-tracecite --model "$BENCH_MODEL" || true; fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=Path(os.environ['RESULT_ROOT'])
          def ri(n):
              try:return int((r/n).read_text().strip())
              except:return None
          def usage(a):
              t={'input_tokens':0,'output_tokens':0,'cache_read_tokens':0,'model_calls':0,'tool_calls':0}
              p=r/f'{a}-transcript.jsonl'
              if not p.exists(): return t
              for line in p.read_text(errors='replace').splitlines():
                  try:e=json.loads(line)
                  except:continue
                  if e.get('type')=='model':
                      u=e.get('usage') or {}; t['input_tokens']+=int(u.get('input_tokens') or 0); t['output_tokens']+=int(u.get('output_tokens') or 0); t['cache_read_tokens']+=int(u.get('cache_read_input_tokens') or u.get('cached_input_tokens') or 0); t['model_calls']+=1
                  elif e.get('type')=='tool': t['tool_calls']+=1
              return t
          activity={}
          ap=r/'tracecite-host-tool-activity.json'
          if ap.exists():
              try: activity=json.loads(ap.read_text())
              except: pass
          payload={'slot':'${{ matrix.slot }}','model':os.environ.get('BENCH_MODEL'),'experiment':'pi_query_snapshot_false_on_immutable_benchmark_source','correctness_policy':'manual_review_only','native':{'wall_seconds':ri('native-wall-seconds.txt'),'exit':ri('native-exit.txt'),**usage('native')},'tracecite':{'wall_seconds':ri('tracecite-wall-seconds.txt'),'exit':ri('tracecite-exit.txt'),**usage('tracecite'),'tool_activity':activity.get('summary',{})}}
          (r/'objective-summary.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          print(json.dumps(payload,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rcaeval-source-prep-${{ matrix.slot }}-results
          path: /tmp/rcaeval-source-prep/results
          retention-days: 14
