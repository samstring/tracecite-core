name: MiniMax Availability Probe

on:
  push:
    branches: [experiment/evidence-intelligence]
    paths:
      - .tracecite-minimax-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GMI_API_KEY: ${{ secrets.GMI_API_KEY || secrets.OPENAI_API_KEY }}
      GMI_MODEL: ${{ vars.GMI_MODEL || vars.TRACECITE_BENCH_MODEL }}
      PI_CODING_AGENT_DIR: /tmp/pi-minimax-probe
      PI_SKIP_VERSION_CHECK: "1"
      PI_TELEMETRY: "0"
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Probe MiniMax through Pi
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GMI_API_KEY:-}" || { echo 'missing_api_key'; exit 2; }
          test -n "${GMI_MODEL:-}" || { echo 'missing_model'; exit 2; }
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.84.4 >/dev/null
          mkdir -p "$PI_CODING_AGENT_DIR" /tmp/pi-minimax-probe-work
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {'providers': {'gmi': {
              'name': 'GMI OpenAI-compatible',
              'baseUrl': 'https://api.gmi-serving.com/v1',
              'api': 'openai-completions',
              'models': [{
                  'id': os.environ['GMI_MODEL'],
                  'name': os.environ['GMI_MODEL'],
                  'reasoning': False,
                  'input': ['text'],
                  'cost': {'input': 0, 'output': 0, 'cacheRead': 0, 'cacheWrite': 0},
                  'contextWindow': 1_000_000,
                  'maxTokens': 64,
                  'compat': {'supportsDeveloperRole': False, 'supportsReasoningEffort': False},
              }],
          }}}
          (Path(os.environ['PI_CODING_AGENT_DIR']) / 'models.json').write_text(json.dumps(payload, indent=2) + '\n')
          PY
          cd /tmp/pi-minimax-probe-work
          set +e
          timeout 90s pi \
            --provider gmi \
            --model "$GMI_MODEL" \
            --api-key "$GMI_API_KEY" \
            --thinking off \
            --mode text \
            --print \
            --no-skills \
            --no-prompt-templates \
            --no-context-files \
            "Reply with exactly OK." \
            > /tmp/pi-probe-out.txt 2> /tmp/pi-probe-err.txt
          code=$?
          set -e
          echo "pi_exit=$code"
          echo '--- stdout ---'
          cat /tmp/pi-probe-out.txt
          echo '--- stderr ---'
          cat /tmp/pi-probe-err.txt
          exit "$code"
