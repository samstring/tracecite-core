name: Medium Evidence Candidate Probe

on:
  workflow_dispatch:
  push:
    branches:
      - bench/add-four-public-cases
    paths:
      - benchmarks/agent-investigation/probe_real_online_evidence.py
      - benchmarks/agent-investigation/medium-candidate-probes.json
      - .github/workflows/evidence-medium-candidate-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe medium candidate evidence
        run: |
          python benchmarks/agent-investigation/probe_real_online_evidence.py \
            --spec benchmarks/agent-investigation/medium-candidate-probes.json \
            --output /tmp/medium-candidate-probes.json
      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medium-candidate-probes
          path: /tmp/medium-candidate-probes.json
          if-no-files-found: error
