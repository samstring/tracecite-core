name: Canonical acquisition refactor

on:
  push:
    branches:
      - feature_for_agent

permissions:
  contents: write

jobs:
  refactor:
    if: "${{ github.event.head_commit.message == 'chore: run canonical acquisition refactor' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Apply acquisition ownership refactor
        run: python scripts/refactor_canonical_acquisition_once.py

      - name: Run focused regressions
        run: |
          python -m pytest tests/test_runtime_acquisition_boundary.py tests/test_runtime_search_engine.py tests/test_budget_cache.py tests/test_runtime_agent_api.py tests/test_runtime_schema_tools.py tests/test_runtime_session_retrieval.py tests/test_session_novelty_regressions.py tests/test_stateful_cli.py tests/test_pi_tracecite_bridge.py tests/test_pi_tracecite_runtime_neutral.py
          python scripts/check_architecture.py

      - name: Run full Core test suite
        run: python -m pytest -W error::DeprecationWarning

      - name: Commit validated refactor
        run: |
          rm .github/workflows/refactor-canonical-acquisition-on-feature.yml
          rm scripts/refactor_canonical_acquisition_once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: make acquisition the canonical runtime implementation'
          git push origin HEAD:feature_for_agent
