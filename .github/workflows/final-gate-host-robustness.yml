name: Final Gate Host Robustness

on:
  push:
    branches:
      - experiment/evidence-intelligence
    paths:
      - .github/workflows/final-gate-host-robustness.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/evidence-intelligence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Persist one-time actionable prompt state per host process
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def one(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          host_path = Path('benchmarks/agent-investigation/gmi_canonical_host.py')
          test_path = Path('tests/test_gmi_canonical_host.py')
          host = host_path.read_text(encoding='utf-8')

          host = one(
              host,
              '_ACTION_PROMPT_MARKER = "TRACECITE_ACTION_REQUIRED"\n_FINAL_ONLY_PROMPT = (',
              '_ACTION_PROMPT_MARKER = "TRACECITE_ACTION_REQUIRED"\n'
              '# Process-local protocol memory. A benchmark process owns one conversation,\n'
              '# so this prevents re-injecting the same synthetic action prompt without\n'
              '# leaking state across independent benchmark jobs/processes.\n'
              '_PROMPTED_ACTIONS: set[tuple[str, str, str]] = set()\n'
              '_FINAL_ONLY_PROMPT = (',
              'prompted action state',
          )

          old = '''    signature = "|".join(_action_signature(action))\n    marker = f"{_ACTION_PROMPT_MARKER} {signature}"\n    already_prompted = any(\n        str(item.get("role") or "") == "user" and marker in str(item.get("content") or "")\n        for item in messages\n    )\n    if already_prompted:\n        return request, None\n\n    messages.append({"role": "user", "content": _action_prompt(action)})\n'''
          new = '''    action_signature = _action_signature(action)\n    signature = "|".join(action_signature)\n    marker = f"{_ACTION_PROMPT_MARKER} {signature}"\n    already_prompted = action_signature in _PROMPTED_ACTIONS or any(\n        str(item.get("role") or "") == "user" and marker in str(item.get("content") or "")\n        for item in messages\n    )\n    if already_prompted:\n        return request, None\n\n    # Record before provider dispatch. If the synthetic user prompt is not\n    # persisted into the host's conversation history, the next request still\n    # cannot re-inject it and repeatedly defer the normal safety cap.\n    _PROMPTED_ACTIONS.add(action_signature)\n    messages.append({"role": "user", "content": _action_prompt(action)})\n'''
          host = one(host, old, new, 'action policy one-shot state')
          host_path.write_text(host, encoding='utf-8')

          tests = test_path.read_text(encoding='utf-8')
          marker = '''def test_action_policy_does_not_repeat_action_after_matching_tool_call(tmp_path: Path) -> None:\n'''
          if marker not in tests:
              raise SystemExit('canonical host action-policy test marker missing')
          regression = '''def test_action_policy_does_not_reinject_ignored_synthetic_prompt(tmp_path: Path) -> None:\n    output = _run_host_script(\n        tmp_path,\n        "host._PROMPTED_ACTIONS.clear()\\n"\n        "action = {'operation':'search','source':'runtime.log','query':'local-device','purpose':'verify_identifier_uniqueness_across_scopes','gap_kind':'scope_uniqueness_unverified'}\\n"\n        "tool_payload = {'status':'ok','data':{'actionable_retrieval':action}}\\n"\n        "messages = [\\n"\n        " {'role':'system','content':'s'}, {'role':'user','content':'u'},\\n"\n        " {'role':'assistant','content':'','tool_calls':[{'id':'1','type':'function','function':{'name':'tracecite_get','arguments':'{\\\\\\\"file\\\\\\\":\\\\\\\"runtime.log\\\\\\\",\\\\\\\"line\\\\\\\":2,\\\\\\\"radius\\\\\\\":1}'}}]},\\n"\n        " {'role':'tool','tool_call_id':'1','content':json.dumps(tool_payload)},\\n"\n        "]\\n"\n        "payload = {'messages':messages,'tools':[{'type':'function'}],'tool_choice':'auto'}\\n"\n        "first, first_event = host._apply_action_policy(payload)\\n"\n        "second, second_event = host._apply_action_policy(payload)\\n"\n        "assert first_event is not None\\n"\n        "assert len(first['messages']) == len(messages) + 1\\n"\n        "assert second_event is None\\n"\n        "assert len(second['messages']) == len(messages)\\n"\n        "assert ('search','runtime.log','local-device') in host._PROMPTED_ACTIONS\\n"\n        "print('ok')\\n",\n    )\n    assert output.strip() == "ok"\n\n\n'''
          tests = tests.replace(marker, regression + marker, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run host regression and full deterministic suite
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_architecture.py
          python scripts/check_schema_compat.py >/tmp/schema.json
          python -m pytest -W error::DeprecationWarning tests/test_gmi_canonical_host.py
          python -m pytest -W error::DeprecationWarning
      - name: Commit hardening and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/final-gate-host-robustness.yml
          git config user.name "tracecite-final-gate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add benchmarks/agent-investigation/gmi_canonical_host.py tests/test_gmi_canonical_host.py .github/workflows/final-gate-host-robustness.yml
          git commit -m "fix(benchmark): inject actionable retrieval prompt once"
          git push origin HEAD:experiment/evidence-intelligence
