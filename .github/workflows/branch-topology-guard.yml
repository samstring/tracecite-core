name: Branch topology guard

on:
  push:
    branches:
      - "**"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all repository branches
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Enforce single active ahead branch
        env:
          POLICY_BASELINE: 746605127cdff6e2a8149eca8cb6944d6868c605
          FEATURE_BRANCH: feature_for_agent
        run: |
          python - <<'PY'
          from __future__ import annotations

          import os
          import subprocess
          import sys

          baseline = os.environ["POLICY_BASELINE"]
          feature_name = os.environ["FEATURE_BRANCH"]
          feature_ref = f"refs/remotes/origin/{feature_name}"

          def git(*args: str, check: bool = True) -> str:
              proc = subprocess.run(
                  ["git", *args],
                  check=False,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              if check and proc.returncode != 0:
                  raise RuntimeError(
                      f"git {' '.join(args)} failed: {proc.stderr.strip()}"
                  )
              return proc.stdout.strip()

          def is_ancestor(older: str, newer: str) -> bool:
              proc = subprocess.run(
                  ["git", "merge-base", "--is-ancestor", older, newer],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              return proc.returncode == 0

          if not is_ancestor(baseline, feature_ref):
              raise SystemExit(
                  "branch-policy baseline is no longer an ancestor of feature_for_agent; "
                  "update the policy intentionally before continuing"
              )

          feature_epoch = int(git("show", "-s", "--format=%ct", feature_ref))
          refs = git(
              "for-each-ref",
              "--format=%(refname)",
              "refs/remotes/origin",
          ).splitlines()

          active: list[tuple[str, int, str, int]] = []

          for ref in refs:
              if not ref or ref.endswith("/HEAD"):
                  continue
              name = ref.removeprefix("refs/remotes/origin/")
              if name in {feature_name, "main"}:
                  continue

              ahead_text = git("rev-list", "--count", f"{feature_ref}..{ref}")
              ahead = int(ahead_text or "0")
              if ahead == 0:
                  continue

              merge_base = git("merge-base", feature_ref, ref, check=False)
              if not merge_base:
                  continue

              unique_epochs = [
                  int(value)
                  for value in git("log", "--format=%ct", f"{feature_ref}..{ref}").splitlines()
                  if value.strip().isdigit()
              ]
              newest_unique = max(unique_epochs, default=0)

              # A post-policy child branch is active while it has unique commits,
              # even if feature_for_agent has advanced since it was created.
              # A grandfathered historical branch is counted only when it has
              # been updated more recently than the current feature_for_agent
              # head. This implements the repository rule that there can be at
              # most one branch carrying current work ahead of the development
              # source of truth.
              post_policy_child = is_ancestor(baseline, merge_base)
              historical_but_newer = newest_unique > feature_epoch
              if post_policy_child or historical_but_newer:
                  active.append((name, ahead, merge_base, newest_unique))

          print("branches carrying active work outside feature_for_agent:")
          if active:
              for name, ahead, merge_base, newest_unique in sorted(active):
                  print(
                      f"  - {name}: {ahead} unique commit(s), merge-base {merge_base}, "
                      f"newest_unique_epoch={newest_unique}"
                  )
          else:
              print("  (none)")

          if len(active) > 1:
              names = ", ".join(name for name, _, _, _ in sorted(active))
              print(
                  "ERROR: more than one branch carries active commits outside "
                  f"feature_for_agent: {names}",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          print("branch topology policy: OK")
          PY
