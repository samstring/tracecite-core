name: Branch topology guard

on:
  push:
    branches:
      - "**"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all repository branches
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Enforce single active child branch
        env:
          POLICY_BASELINE: 746605127cdff6e2a8149eca8cb6944d6868c605
          FEATURE_BRANCH: feature_for_agent
        run: |
          python - <<'PY'
          from __future__ import annotations

          import os
          import subprocess
          import sys

          baseline = os.environ["POLICY_BASELINE"]
          feature_name = os.environ["FEATURE_BRANCH"]
          feature_ref = f"refs/remotes/origin/{feature_name}"

          def git(*args: str, check: bool = True) -> str:
              proc = subprocess.run(
                  ["git", *args],
                  check=False,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              if check and proc.returncode != 0:
                  raise RuntimeError(
                      f"git {' '.join(args)} failed: {proc.stderr.strip()}"
                  )
              return proc.stdout.strip()

          def is_ancestor(older: str, newer: str) -> bool:
              proc = subprocess.run(
                  ["git", "merge-base", "--is-ancestor", older, newer],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              return proc.returncode == 0

          if not is_ancestor(baseline, feature_ref):
              raise SystemExit(
                  "branch-policy baseline is no longer an ancestor of feature_for_agent; "
                  "update the policy intentionally before continuing"
              )

          baseline_epoch = int(git("show", "-s", "--format=%ct", baseline))
          refs = git(
              "for-each-ref",
              "--format=%(refname)",
              "refs/remotes/origin",
          ).splitlines()

          active: list[tuple[str, int, str]] = []
          mutated_legacy: list[tuple[str, int]] = []

          for ref in refs:
              if not ref or ref.endswith("/HEAD"):
                  continue
              name = ref.removeprefix("refs/remotes/origin/")
              if name in {feature_name, "main"}:
                  continue

              ahead_text = git("rev-list", "--count", f"{feature_ref}..{ref}")
              ahead = int(ahead_text or "0")
              if ahead == 0:
                  continue

              merge_base = git("merge-base", feature_ref, ref, check=False)
              if not merge_base:
                  # Unrelated history is not an active feature_for_agent child.
                  continue

              if is_ancestor(baseline, merge_base):
                  active.append((name, ahead, merge_base))
                  continue

              # Grandfathered branches are frozen. Existing historical unique
              # commits are allowed, but any unique commit newer than policy
              # activation is treated as new development on a legacy branch.
              epochs = [
                  int(value)
                  for value in git(
                      "log", "--format=%ct", f"{feature_ref}..{ref}"
                  ).splitlines()
                  if value.strip().isdigit()
              ]
              newest = max(epochs, default=0)
              if newest > baseline_epoch:
                  mutated_legacy.append((name, newest))

          print("feature_for_agent active child branches:")
          if active:
              for name, ahead, merge_base in sorted(active):
                  print(f"  - {name}: {ahead} unique commit(s), merge-base {merge_base}")
          else:
              print("  (none)")

          if len(active) > 1:
              names = ", ".join(name for name, _, _ in sorted(active))
              print(
                  "ERROR: more than one active child branch has commits not contained "
                  f"in feature_for_agent: {names}",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          if mutated_legacy:
              names = ", ".join(name for name, _ in sorted(mutated_legacy))
              print(
                  "ERROR: grandfathered historical branches are read-only; new unique "
                  f"commits were detected on: {names}. Port the work to feature_for_agent.",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          print("branch topology policy: OK")
          PY
