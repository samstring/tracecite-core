name: TraceCite 140039 Smoke

on:
  push:
    branches: [experiment/evidence-intelligence]
    paths:
      - .github/workflows/pi-tracecite-140039-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracecite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRACECITE_BENCH_PROVIDER: ${{ vars.TRACECITE_BENCH_PROVIDER || 'gemini' }}
      GMI_API_KEY: ${{ secrets.GMI_API_KEY || secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GMI_MODEL: ${{ vars.GMI_MODEL || vars.TRACECITE_BENCH_MODEL }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      PI_CODING_AGENT_DIR: /tmp/pi-agent-config
      PI_SKIP_VERSION_CHECK: "1"
      PI_TELEMETRY: "0"
      CASE_ID: kubernetes-140039-runc-5347-log-code
      CASE_DIR: benchmarks/agent-investigation/log-code-cases/kubernetes-140039-runc-5347
      RESULT_ROOT: /tmp/pi-tracecite-140039-smoke
      PREP: /tmp/pi-tracecite-140039-smoke/prepared
      WORK_ROOT: /tmp/pi-tracecite-140039-smoke/workspace
      SOURCE_ROOT: /tmp/pi-tracecite-140039-smoke/workspace/source
      TRACECITE_MCP_REF: 09215adbf01bd612b3115186951b9154320c5ca5

    steps:
      - name: Checkout TraceCite Core under test
        uses: actions/checkout@v4

      - name: Checkout pinned TraceCite MCP
        uses: actions/checkout@v4
        with:
          repository: samstring/tracecite-mcp
          ref: ${{ env.TRACECITE_MCP_REF }}
          path: tracecite-mcp

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Pi, current Core, MCP, and adapter
        shell: bash
        run: |
          set -euo pipefail
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.84.4
          mkdir -p "$PI_CODING_AGENT_DIR"
          pi install npm:pi-mcp-adapter@2.27.0 --approve
          python -m pip install -e ".[dev]"
          python -m pip install 'mcp>=2,<3'
          python -m pip install -e ./tracecite-mcp --no-deps
          python - <<'PY'
          import inspect
          from pathlib import Path
          import tracecite, tracecite_mcp
          root = Path.cwd().resolve()
          core_path = Path(inspect.getfile(tracecite)).resolve()
          mcp_path = Path(inspect.getfile(tracecite_mcp)).resolve()
          assert root in core_path.parents, core_path
          assert root / 'tracecite-mcp' in mcp_path.parents, mcp_path
          print(f'core={core_path}')
          print(f'mcp={mcp_path}')
          PY

      - name: Verify smoke contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_pi_session_to_transcript.py \
            tests/test_benchmark_run_result.py \
            tests/test_log_code_score.py \
            tests/test_pi_mcp_benchmark_boundary.py
          python -m pytest -q \
            tracecite-mcp/tests/test_projection.py \
            tracecite-mcp/tests/test_server.py \
            tracecite-mcp/tests/test_stdio_integration.py
          python scripts/check_architecture.py
          python -m tracecite.root_cause_benchmarking validate "$CASE_DIR"

      - name: Select benchmark provider
        shell: bash
        run: |
          set -euo pipefail
          provider="${TRACECITE_BENCH_PROVIDER:-gemini}"
          case "$provider" in
            gemini)
              test -n "${GEMINI_API_KEY:-}" || { echo 'GEMINI_API_KEY is empty' >&2; exit 2; }
              test -n "${GEMINI_MODEL:-}" || { echo 'GEMINI_MODEL is empty' >&2; exit 2; }
              echo 'PI_PROVIDER=gemini' >> "$GITHUB_ENV"
              echo 'PI_PROVIDER_NAME=Gemini OpenAI-compatible' >> "$GITHUB_ENV"
              echo 'BENCH_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai' >> "$GITHUB_ENV"
              echo "BENCH_MODEL=$GEMINI_MODEL" >> "$GITHUB_ENV"
              ;;
            minimax|gmi)
              test -n "${GMI_API_KEY:-}" || { echo 'GMI_API_KEY/OPENAI_API_KEY is empty' >&2; exit 2; }
              test -n "${GMI_MODEL:-}" || { echo 'GMI_MODEL/TRACECITE_BENCH_MODEL is empty' >&2; exit 2; }
              echo 'PI_PROVIDER=gmi' >> "$GITHUB_ENV"
              echo 'PI_PROVIDER_NAME=GMI OpenAI-compatible' >> "$GITHUB_ENV"
              echo 'BENCH_BASE_URL=https://api.gmi-serving.com/v1' >> "$GITHUB_ENV"
              echo "BENCH_MODEL=$GMI_MODEL" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported TRACECITE_BENCH_PROVIDER: $provider (expected gemini|minimax|gmi)" >&2
              exit 2
              ;;
          esac
          echo "Selected benchmark provider: $provider"

      - name: Configure model
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PI_PROVIDER:-}" || { echo 'PI_PROVIDER is empty' >&2; exit 2; }
          test -n "${BENCH_BASE_URL:-}" || { echo 'BENCH_BASE_URL is empty' >&2; exit 2; }
          test -n "${BENCH_MODEL:-}" || { echo 'BENCH_MODEL is empty' >&2; exit 2; }
          mkdir -p "$PI_CODING_AGENT_DIR"
          python - <<'PY'
          import json, os
          from pathlib import Path
          provider = os.environ['PI_PROVIDER']
          payload = {'providers': {provider: {
              'name': os.environ['PI_PROVIDER_NAME'],
              'baseUrl': os.environ['BENCH_BASE_URL'],
              'api': 'openai-completions',
              'models': [{
                  'id': os.environ['BENCH_MODEL'], 'name': os.environ['BENCH_MODEL'],
                  'reasoning': False, 'input': ['text'],
                  'cost': {'input': 0, 'output': 0, 'cacheRead': 0, 'cacheWrite': 0},
                  'contextWindow': 1_000_000, 'maxTokens': 4_096,
                  'compat': {'supportsDeveloperRole': False, 'supportsReasoningEffort': False},
              }],
          }}}
          (Path(os.environ['PI_CODING_AGENT_DIR']) / 'models.json').write_text(json.dumps(payload, indent=2) + '\n')
          PY

      - name: Prepare runtime log
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RESULT_ROOT"
          mkdir -p "$RESULT_ROOT" "$PREP" "$WORK_ROOT/evidence"
          python -m tracecite.root_cause_benchmarking prepare "$CASE_DIR" --work-dir "$PREP" > "$RESULT_ROOT/prepare.json"
          PREPARED="$(find "$PREP" -name prepared.json -type f -print -quit)"
          python - "$PREPARED" >> "$GITHUB_ENV" <<'PY'
          import json, os, shutil, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          source = Path(data['inputs'][0]['path']).resolve()
          target = Path(os.environ['WORK_ROOT']) / 'evidence' / source.name
          shutil.copyfile(source, target)
          print(f'RUNTIME_LOG={target.resolve()}')
          print(f'RUNTIME_LOG_BYTES={target.stat().st_size}')
          print(f'QUESTION_FILE={Path(data["question"]).resolve()}')
          PY

      - name: Checkout complete pre-fix runc source
        shell: bash
        run: |
          set -euo pipefail
          eval "$(python - <<'PY'
          import json, os, shlex
          from pathlib import Path
          source = json.loads((Path(os.environ['CASE_DIR']) / 'case.json').read_text())['source_checkout']
          print('SOURCE_REPOSITORY=' + shlex.quote(source['repository']))
          print('SOURCE_COMMIT=' + shlex.quote(source['commit']))
          PY
          )"
          rm -rf "$SOURCE_ROOT"
          git init -q "$SOURCE_ROOT"
          git -C "$SOURCE_ROOT" remote add origin "$SOURCE_REPOSITORY"
          git -C "$SOURCE_ROOT" fetch --depth=1 origin "$SOURCE_COMMIT"
          git -C "$SOURCE_ROOT" checkout -q --detach FETCH_HEAD
          git -C "$SOURCE_ROOT" remote remove origin
          printf '%s\n' "$SOURCE_COMMIT" > "$RESULT_ROOT/source-commit.txt"
          printf '%s\n' "$TRACECITE_MCP_REF" > "$RESULT_ROOT/tracecite-mcp-ref.txt"

      - name: Configure standard TraceCite MCP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_ROOT/.pi"
          cat > "$SOURCE_ROOT/.mcp.json" <<EOF
          {
            "mcpServers": {
              "tracecite": {
                "command": "python",
                "args": ["-m", "tracecite_mcp.server"],
                "env": {
                  "TRACECITE_MCP_ALLOWED_ROOTS": "$WORK_ROOT/evidence",
                  "TRACECITE_MCP_STATE_DIR": "$RESULT_ROOT/tracecite-mcp-state"
                }
              }
            }
          }
          EOF
          cat > "$SOURCE_ROOT/.pi/mcp.json" <<'EOF'
          {
            "settings": {"disableProxyTool": true},
            "mcpServers": {
              "tracecite": {"directTools": true, "toolPrefix": "none", "lifecycle": "eager"}
            }
          }
          EOF

      - name: Run TraceCite-only 140039 investigation
        shell: bash
        run: |
          set -euo pipefail
          QUESTION="$(cat "$QUESTION_FILE")"
          PROMPT="You are a real coding agent debugging a failure with a complete pre-fix source repository as your current working directory. The source tree is fixed to the bug-producing pre-fix commit; do not use the web, issue/PR content, remote git operations, or post-fix knowledge. A failing runtime log is available at $RUNTIME_LOG. EVERY operation that inspects or derives from runtime-log content MUST use the standard TraceCite MCP tools. Native read/grep/bash/find/ls are only for source-code exploration. Follow the TraceCite Agent Skill closely, including its canonical call shapes and result semantics. You own hypotheses, causal reasoning, source exploration, evidence sufficiency, final conclusions, and when to stop. Cite important claims using exact runtime-log or source path:L<line> references you actually observed, and distinguish observation from inference."
          case "$PI_PROVIDER" in
            gemini) API_KEY="$GEMINI_API_KEY" ;;
            gmi) API_KEY="$GMI_API_KEY" ;;
            *) echo "Unexpected PI_PROVIDER: $PI_PROVIDER" >&2; exit 2 ;;
          esac
          mkdir -p "$RESULT_ROOT/pi-tracecite-session"
          cd "$SOURCE_ROOT"
          set +e
          TRACECITE_HOST_ACTIVITY="$RESULT_ROOT/tracecite-host-tool-activity.json" \
          TRACECITE_LOG_GUARD_ACTIVITY="$RESULT_ROOT/tracecite-log-guard-blocks.jsonl" \
          TRACECITE_LOG_ACCESS_ACTIVITY="$RESULT_ROOT/tracecite-runtime-log-access.jsonl" \
          TRACECITE_CODE_ROOT="$SOURCE_ROOT" \
          TRACECITE_RUNTIME_LOG="$RUNTIME_LOG" \
          timeout -k 30s 1200s pi \
            --provider "$PI_PROVIDER" --model "$BENCH_MODEL" --api-key "$API_KEY" \
            --thinking off --mode text --print \
            --session-dir "$RESULT_ROOT/pi-tracecite-session" \
            --extension "$GITHUB_WORKSPACE/benchmarks/agent-investigation/pi_log_code_benchmark_host.ts" \
            --tools read,bash,grep,find,ls,tracecite_retrieve,tracecite_materialize,tracecite_replay,tracecite_aggregate,tracecite_traverse,tracecite_verify \
            --no-skills --skill "$GITHUB_WORKSPACE/tracecite-mcp/skills/tracecite/SKILL.md" \
            --no-prompt-templates --no-context-files \
            --system-prompt "$PROMPT" "$QUESTION" \
            > "$RESULT_ROOT/pi-tracecite-answer.md" 2> "$RESULT_ROOT/pi-tracecite-stderr.log"
          code=$?
          set -e
          echo "$code" > "$RESULT_ROOT/pi-tracecite-exit.txt"

      - name: Record smoke summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RESULT_ROOT'])
          answer = root / 'pi-tracecite-answer.md'
          exit_file = root / 'pi-tracecite-exit.txt'
          activity = root / 'tracecite-host-tool-activity.json'
          log_access = root / 'tracecite-runtime-log-access.jsonl'
          guard = root / 'tracecite-log-guard-blocks.jsonl'
          exit_code = int(exit_file.read_text().strip()) if exit_file.exists() else None
          tool_summary = None
          if activity.exists():
              tool_summary = json.loads(activity.read_text()).get('summary')
          summary = {
              'schema_version': 1,
              'case_id': os.environ['CASE_ID'],
              'integration': 'agent-skill-standard-mcp-core',
              'provider': os.environ.get('PI_PROVIDER'),
              'model': os.environ.get('BENCH_MODEL'),
              'core_sha': os.environ.get('GITHUB_SHA'),
              'mcp_sha': os.environ['TRACECITE_MCP_REF'],
              'runtime_log_bytes': int(os.environ.get('RUNTIME_LOG_BYTES', '0') or 0),
              'exit_code': exit_code,
              'completed_without_timeout': exit_code == 0,
              'answer_nonempty': answer.exists() and bool(answer.read_text(errors='replace').strip()),
              'runtime_log_mcp_accesses': sum(1 for _ in log_access.open()) if log_access.exists() else 0,
              'blocked_native_log_attempts': sum(1 for _ in guard.open()) if guard.exists() else 0,
              'tool_summary': tool_summary,
          }
          (root / 'smoke-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload TraceCite smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracecite-140039-smoke
          path: ${{ env.RESULT_ROOT }}
          if-no-files-found: warn
