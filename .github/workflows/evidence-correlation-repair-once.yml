name: Evidence Correlation Repair Once

on:
  push:
    branches:
      - experiment/evidence-intelligence
    paths:
      - .github/workflows/evidence-correlation-repair-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/evidence-intelligence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply generic correlation repair
        run: python scripts/_evidence_correlation_patch.py
      - name: Validate deterministic repair
        run: |
          python -m pip install -e '.[dev]'
          pytest -q tests/test_retrieval_guidance.py tests/test_gmi_canonical_host.py
          python scripts/check_architecture.py
      - name: Commit repair and remove temporary files
        run: |
          rm .github/workflows/evidence-correlation-repair-once.yml
          rm -f scripts/_evidence_correlation_patch.b64 scripts/_evidence_correlation_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(evidence): require scoped correlation constraint review'
          git push origin HEAD:experiment/evidence-intelligence
