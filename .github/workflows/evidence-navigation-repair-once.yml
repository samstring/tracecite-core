name: Evidence Navigation Repair Once

on:
  push:
    branches:
      - experiment/evidence-intelligence
    paths:
      - .github/workflows/evidence-navigation-repair-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/evidence-intelligence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare patch fragments
        shell: bash
        run: |
          cat > /tmp/insert1.txt <<'EOF'
          def _original_question_text(messages: Sequence[Mapping[str, Any]]) -> str:
              parts: list[str] = []
              for message in messages:
                  if str(message.get("role") or "") != "user":
                      continue
                  content = str(message.get("content") or "")
                  if not content:
                      continue
                  if _ACTION_PROMPT_MARKER in content or _NAVIGATION_PROMPT_MARKER in content:
                      continue
                  if "Evidence acquisition has stopped" in content or "previous assistant response hit" in content:
                      continue
                  parts.append(content)
              return "\n".join(parts)


          def _question_aligned_navigation_from_tool_output(
              output: Any,
              question_text: str,
          ) -> dict[str, Any] | None:
              payload = _tool_output_payload(output)
              if payload is None:
                  return None
              coverage = payload.get("coverage") or {}
              if not isinstance(coverage, Mapping) or not bool(coverage.get("evidence_truncated")):
                  return None
              data = payload.get("data") or {}
              if not isinstance(data, Mapping):
                  return None
              evidence_source = data.get("evidence_source") or {}
              if not isinstance(evidence_source, Mapping):
                  return None
              source_path = str(evidence_source.get("path") or "").strip()
              if not source_path:
                  return None
              source = Path(source_path).name
              question_folded = question_text.casefold()
              if not question_folded:
                  return None
              for raw in payload.get("next_queries") or []:
                  query = str(raw or "").strip()
                  if len(query) < 3:
                      continue
                  if query.casefold() not in question_folded:
                      continue
                  return {
                      "operation": "search",
                      "source": source,
                      "query": query,
                      "purpose": "cover_question_aligned_truncated_branch",
                      "gap_kind": "truncated_question_coverage",
                  }
              return None


          EOF

          cat > /tmp/insert2.txt <<'EOF'
          def _pending_question_navigation(messages: Sequence[Mapping[str, Any]]) -> dict[str, Any] | None:
              attempted: set[tuple[str, str, str]] = set()
              pending: dict[str, Any] | None = None
              question_text = _original_question_text(messages)
              for message in messages:
                  role = str(message.get("role") or "")
                  if role == "assistant":
                      for raw_call in message.get("tool_calls") or []:
                          if not isinstance(raw_call, Mapping):
                              continue
                          signature = _tool_call_signature(raw_call)
                          if signature is not None:
                              attempted.add(signature)
                              if pending is not None and signature == _action_signature(pending):
                                  pending = None
                      continue
                  if role != "tool":
                      continue
                  action = _question_aligned_navigation_from_tool_output(
                      message.get("content") or "", question_text
                  )
                  if action is not None and _action_signature(action) not in attempted:
                      pending = action
              return pending


          def _navigation_prompt(action: Mapping[str, Any]) -> str:
              signature = "|".join(_action_signature(action))
              return (
                  f"{_NAVIGATION_PROMPT_MARKER} {signature}\n"
                  "The latest canonical search was truncated and Runtime exposed a next-query branch that is also "
                  "explicitly named in the investigation question. Before concluding, cover that branch once: "
                  f"tracecite_search(file={action['source']!r}, query={action['query']!r}, regex=false). "
                  "This is lexical evidence-coverage completion only; it is not a causal or root-cause recommendation."
              )


          EOF

          cat > /tmp/old_apply.txt <<'EOF'
              action = _pending_action(messages)
              if action is None:
                  return request, None

              action_signature = _action_signature(action)
              signature = "|".join(action_signature)
              marker = f"{_ACTION_PROMPT_MARKER} {signature}"
              already_prompted = action_signature in _PROMPTED_ACTIONS or any(
                  str(item.get("role") or "") == "user" and marker in str(item.get("content") or "")
                  for item in messages
              )
              if already_prompted:
                  return request, None

              # Record before provider dispatch. If the synthetic user prompt is not
              # persisted into the host's conversation history, the next request still
              # cannot re-inject it and repeatedly defer the normal safety cap.
              _PROMPTED_ACTIONS.add(action_signature)
              messages.append({"role": "user", "content": _action_prompt(action)})
              request["messages"] = messages
              return request, {
                  "type": "protocol",
                  "event": "prioritize_actionable_retrieval",
                  "operation": action["operation"],
                  "source": action["source"],
                  "query": action["query"],
                  "purpose": action.get("purpose") or "",
                  "gap_kind": action.get("gap_kind") or "",
              }
          EOF

          cat > /tmp/new_apply.txt <<'EOF'
              action = _pending_action(messages)
              event_name = "prioritize_actionable_retrieval"
              prompt_builder = _action_prompt
              marker_prefix = _ACTION_PROMPT_MARKER
              if action is None:
                  action = _pending_question_navigation(messages)
                  event_name = "prioritize_question_aligned_coverage"
                  prompt_builder = _navigation_prompt
                  marker_prefix = _NAVIGATION_PROMPT_MARKER
              if action is None:
                  return request, None

              action_signature = _action_signature(action)
              signature = "|".join(action_signature)
              marker = f"{marker_prefix} {signature}"
              already_prompted = action_signature in _PROMPTED_ACTIONS or any(
                  str(item.get("role") or "") == "user" and marker in str(item.get("content") or "")
                  for item in messages
              )
              if already_prompted:
                  return request, None

              # Record before provider dispatch. If the synthetic user prompt is not
              # persisted into the host's conversation history, the next request still
              # cannot re-inject it and repeatedly defer the normal safety cap.
              _PROMPTED_ACTIONS.add(action_signature)
              messages.append({"role": "user", "content": prompt_builder(action)})
              request["messages"] = messages
              return request, {
                  "type": "protocol",
                  "event": event_name,
                  "operation": action["operation"],
                  "source": action["source"],
                  "query": action["query"],
                  "purpose": action.get("purpose") or "",
                  "gap_kind": action.get("gap_kind") or "",
              }
          EOF

          cat > /tmp/old_radius.txt <<'EOF'
                  radius = min(requested_radius, _MAX_GET_RADIUS)
                  prefix = ""
                  if radius != requested_radius:
                      prefix = f"@NORMALIZE radius_clamped_from={requested_radius} radius={radius}"
          EOF

          cat > /tmp/new_radius.txt <<'EOF'
                  radius = (
                      0
                      if requested_radius == 0
                      else min(_MAX_GET_RADIUS, max(_MIN_GET_RADIUS, requested_radius))
                  )
                  prefix = ""
                  if radius != requested_radius:
                      direction = "expanded" if radius > requested_radius else "clamped"
                      prefix = f"@NORMALIZE radius_{direction}_from={requested_radius} radius={radius}"
          EOF

          cat > /tmp/tests_append.py <<'EOF'


def test_question_aligned_truncated_navigation_is_required_once(tmp_path: Path) -> None:
    output = _run_host_script(
        tmp_path,
        "host._PROMPTED_ACTIONS.clear()\n"
        "tool_payload = {'status':'ok','coverage':{'evidence_truncated':True},'data':{'evidence_source':{'path':'/tmp/inputs/crash-report.txt'}},'next_queries':['dylib','Flutter','framework']}\n"
        "messages = [\n"
        " {'role':'system','content':'s'},\n"
        " {'role':'user','content':'Identify the Flutter engine subsystem from this crash report.'},\n"
        " {'role':'assistant','content':'','tool_calls':[{'id':'1','type':'function','function':{'name':'tracecite_search','arguments':'{\\\"file\\\":\\\"crash-report.txt\\\",\\\"query\\\":\\\"^Thread \\\",\\\"regex\\\":true}'}}]},\n"
        " {'role':'tool','tool_call_id':'1','content':json.dumps(tool_payload)},\n"
        "]\n"
        "request, event = host._apply_action_policy({'messages':messages,'tools':[{'type':'function'}],'tool_choice':'auto'})\n"
        "assert event is not None and event['event'] == 'prioritize_question_aligned_coverage'\n"
        "assert event['query'] == 'Flutter'\n"
        "assert 'TRACECITE_COVERAGE_REQUIRED search|crash-report.txt|Flutter' in request['messages'][-1]['content']\n"
        "second, second_event = host._apply_action_policy({'messages':messages,'tools':[{'type':'function'}],'tool_choice':'auto'})\n"
        "assert second_event is None\n"
        "print('ok')\n",
    )
    assert output.strip() == "ok"


def test_question_aligned_navigation_does_not_invent_unmentioned_branch(tmp_path: Path) -> None:
    output = _run_host_script(
        tmp_path,
        "host._PROMPTED_ACTIONS.clear()\n"
        "tool_payload = {'status':'ok','coverage':{'evidence_truncated':True},'data':{'evidence_source':{'path':'/tmp/inputs/runtime.log'}},'next_queries':['database','network']}\n"
        "messages = [\n"
        " {'role':'user','content':'Why did the cache checksum fail?'},\n"
        " {'role':'assistant','content':'','tool_calls':[{'id':'1','type':'function','function':{'name':'tracecite_search','arguments':'{\\\"file\\\":\\\"runtime.log\\\",\\\"query\\\":\\\"ERROR\\\",\\\"regex\\\":false}'}}]},\n"
        " {'role':'tool','tool_call_id':'1','content':json.dumps(tool_payload)},\n"
        "]\n"
        "assert host._pending_question_navigation(messages) is None\n"
        "print('ok')\n",
    )
    assert output.strip() == "ok"


def test_positive_get_radius_expands_to_fidelity_neighborhood(tmp_path: Path) -> None:
    input_root = tmp_path / "inputs"
    scratch = tmp_path / "scratch"
    input_root.mkdir()
    scratch.mkdir()
    (input_root / "runtime.log").write_text(
        "".join(f"line-{i}\n" for i in range(1, 40)),
        encoding="utf-8",
    )
    output = _run_host_script(
        tmp_path,
        "runtime = host.CanonicalRuntime(mode='tracecite', input_root=tmp/'inputs', scratch=tmp/'scratch', context_id='')\n"
        "expanded = runtime._tracecite_get({'file':'runtime.log','line':20,'radius':5})\n"
        "assert 'radius_expanded_from=5 radius=12' in expanded\n"
        "assert 'runtime.log:8 line-8' in expanded\n"
        "assert 'runtime.log:32 line-32' in expanded\n"
        "exact = runtime._tracecite_get({'file':'runtime.log','line':20,'radius':0})\n"
        "assert '@NORMALIZE' not in exact\n"
        "assert 'runtime.log:20 line-20' in exact\n"
        "print('ok')\n",
    )
    assert output.strip() == "ok"
          EOF
      - name: Apply generic coverage repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('benchmarks/agent-investigation/gmi_canonical_host.py')
          s = p.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global s
              if old not in s:
                  raise SystemExit(f'{label} not found')
              s = s.replace(old, new, 1)

          replace_once('_MAX_GET_RADIUS = 8\n', '_MAX_GET_RADIUS = 12\n_MIN_GET_RADIUS = 12\n', 'max radius')
          replace_once('_ACTION_PROMPT_MARKER = "TRACECITE_ACTION_REQUIRED"\n', '_ACTION_PROMPT_MARKER = "TRACECITE_ACTION_REQUIRED"\n_NAVIGATION_PROMPT_MARKER = "TRACECITE_COVERAGE_REQUIRED"\n', 'navigation marker')
          replace_once('def _tool_call_signature(call: Mapping[str, Any]) -> tuple[str, str, str] | None:\n', Path('/tmp/insert1.txt').read_text() + 'def _tool_call_signature(call: Mapping[str, Any]) -> tuple[str, str, str] | None:\n', 'question navigation helpers')
          replace_once('def _action_prompt(action: Mapping[str, Any]) -> str:\n', Path('/tmp/insert2.txt').read_text() + 'def _action_prompt(action: Mapping[str, Any]) -> str:\n', 'pending navigation helpers')
          replace_once(Path('/tmp/old_apply.txt').read_text(), Path('/tmp/new_apply.txt').read_text(), 'action policy')
          replace_once(Path('/tmp/old_radius.txt').read_text(), Path('/tmp/new_radius.txt').read_text(), 'radius policy')
          replace_once('"Recover exact line-addressable context around a known line through the canonical Runtime. radius is bounded to 0-8; "', '"Recover exact line-addressable context around a known line through the canonical Runtime. radius=0 is exact-line; any positive radius is normalized to a 12-line evidence neighborhood for fidelity. "', 'tool description')
          p.write_text(s)

          p = Path('tests/test_gmi_canonical_host.py')
          s = p.read_text()
          old = "assert 'radius_clamped_from=10 radius=8' in clamped"
          if old not in s:
              raise SystemExit('radius assertion not found')
          s = s.replace(old, "assert 'radius_expanded_from=10 radius=12' in clamped", 1)
          marker = 'def test_question_aligned_truncated_navigation_is_required_once'
          if marker not in s:
              s += Path('/tmp/tests_append.py').read_text()
          p.write_text(s)
          PY
      - name: Run deterministic validation
        run: |
          python -m pip install -e '.[dev]'
          pytest -q tests/test_gmi_canonical_host.py tests/test_retrieval_guidance.py tests/test_evidence_routing.py tests/test_signal_hint_routing.py
          python scripts/check_architecture.py
      - name: Commit repair and remove one-shot workflow
        run: |
          rm .github/workflows/evidence-navigation-repair-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmarks/agent-investigation/gmi_canonical_host.py tests/test_gmi_canonical_host.py .github/workflows/evidence-navigation-repair-once.yml
          git commit -m 'fix(benchmark): close truncated question-aligned coverage gaps'
          git push origin HEAD:experiment/evidence-intelligence
