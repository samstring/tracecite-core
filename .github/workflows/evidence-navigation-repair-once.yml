name: Evidence Navigation Repair Once

on:
  push:
    branches:
      - experiment/evidence-intelligence
    paths:
      - .github/workflows/evidence-navigation-repair-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/evidence-intelligence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply repair
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Validate repair
        run: |
          python -m pip install -e '.[dev]'
          pytest -q tests/test_gmi_canonical_host.py tests/test_retrieval_guidance.py tests/test_evidence_routing.py tests/test_signal_hint_routing.py
          python scripts/check_architecture.py
      - name: Commit repair
        run: |
          rm .github/workflows/evidence-navigation-repair-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmarks/agent-investigation/gmi_canonical_host.py tests/test_gmi_canonical_host.py .github/workflows/evidence-navigation-repair-once.yml
          git commit -m 'fix(benchmark): close truncated question-aligned coverage gaps'
          git push origin HEAD:experiment/evidence-intelligence
