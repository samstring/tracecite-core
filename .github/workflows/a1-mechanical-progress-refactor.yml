name: A1 Mechanical Progress Refactor

on:
  push:
    branches:
      - experiment/evidence-intelligence
    paths:
      - .github/workflows/a1-mechanical-progress-refactor.yml

permissions:
  contents: write

jobs:
  refactor-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/evidence-intelligence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply A1 refactor
        run: python scripts/_a1_mechanical_progress_refactor.py
      - name: Run focused A1 tests
        run: |
          python -m pip install -e . pytest
          pytest -q tests/test_runtime_agent_api.py tests/test_runtime_boundary.py tests/test_gmi_scale_evidence_progress.py
          python scripts/check_architecture.py
      - name: Commit verified A1 changes and remove one-shot helpers
        run: |
          git config user.name "tracecite-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm scripts/_a1_mechanical_progress_refactor.py
          git rm .github/workflows/a1-mechanical-progress-refactor.yml
          git add src/tracecite/runtime/retrieve_contract.py benchmarks/agent-investigation/gmi_scale_host.py tests/test_runtime_agent_api.py tests/test_runtime_boundary.py
          git commit -m "runtime: complete mechanical progress boundary cleanup"
          git push origin HEAD:experiment/evidence-intelligence
