name: Pi Agent Moderate Suite

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/evidence-intelligence
    paths:
      - benchmarks/agent-investigation/moderate-suite.json
      - benchmarks/agent-investigation/pi_tracecite_extension.ts
      - benchmarks/agent-investigation/pi_tracecite_bridge.py
      - benchmarks/agent-investigation/pi_ab_runtime.py
      - benchmarks/agent-investigation/scale-cases/kubernetes-139417/**
      - .github/workflows/pi-agent-moderate-suite.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - case_id: doublecmd-2264
            case_dir: benchmarks/agent-investigation/cases/doublecmd-2264
            scorer: legacy
            primary: "true"
            eligible_dimensions: ""
          - case_id: prometheus-18018
            case_dir: benchmarks/agent-investigation/cases/prometheus-18018
            scorer: legacy
            primary: "true"
            eligible_dimensions: ""
          - case_id: kubernetes-140039-runc-5347
            case_dir: benchmarks/agent-investigation/scale-cases/kubernetes-140039-runc-5347
            scorer: root_cause
            primary: "true"
            eligible_dimensions: "failure_localization,immediate_failure_mechanism,upstream_contributor"
          - case_id: kubernetes-140848
            case_dir: benchmarks/agent-investigation/scale-cases/kubernetes-140848
            scorer: root_cause
            primary: "true"
            eligible_dimensions: "failure_localization,immediate_failure_mechanism,upstream_contributor"
          - case_id: kubernetes-139417
            case_dir: benchmarks/agent-investigation/scale-cases/kubernetes-139417
            scorer: root_cause
            primary: "true"
            eligible_dimensions: "failure_localization,immediate_failure_mechanism"
          - case_id: kubernetes-140268
            case_dir: benchmarks/agent-investigation/scale-cases/kubernetes-140268
            scorer: root_cause
            primary: "false"
            eligible_dimensions: ""
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.TRACECITE_BENCH_BASE_URL || 'https://api.gmi-serving.com/v1' }}
      BENCH_MODEL: ${{ vars.TRACECITE_BENCH_MODEL }}
      PI_CODING_AGENT_DIR: /tmp/pi-agent-config
      PI_SKIP_VERSION_CHECK: "1"
      PI_TELEMETRY: "0"
      CASE_ID: ${{ matrix.case_id }}
      CASE_DIR: ${{ matrix.case_dir }}
      SCORER: ${{ matrix.scorer }}
      PRIMARY: ${{ matrix.primary }}
      ELIGIBLE_DIMENSIONS: ${{ matrix.eligible_dimensions }}
      RESULT: /tmp/pi-moderate-${{ matrix.case_id }}
      PREP: /tmp/pi-moderate-${{ matrix.case_id }}/prepared

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Pi, TraceCite, and ripgrep
        shell: bash
        run: |
          set -euo pipefail
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.84.4
          python -m pip install -e ".[dev]"
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ripgrep
          fi
          pi --version

      - name: Configure GMI model for Pi
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PI_CODING_AGENT_DIR"
          python - <<'PY'
          import json, os
          from pathlib import Path
          target = Path(os.environ['PI_CODING_AGENT_DIR']) / 'models.json'
          model = os.environ['BENCH_MODEL']
          if not model:
              raise SystemExit('BENCH_MODEL is empty')
          payload = {'providers': {'gmi': {
              'name': 'GMI OpenAI-compatible',
              'baseUrl': os.environ['OPENAI_BASE_URL'],
              'api': 'openai-completions',
              'models': [{
                  'id': model, 'name': model, 'reasoning': False, 'input': ['text'],
                  'cost': {'input': 0, 'output': 0, 'cacheRead': 0, 'cacheWrite': 0},
                  'contextWindow': 1_000_000, 'maxTokens': 4_096,
                  'compat': {'supportsDeveloperRole': False, 'supportsReasoningEffort': False},
              }],
          }}}
          target.write_text(json.dumps(payload, indent=2) + '\n')
          PY

      - name: Prepare case
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RESULT"
          mkdir -p "$RESULT" "$PREP"
          if [[ "$SCORER" == "root_cause" ]]; then
            python -m tracecite.root_cause_benchmarking validate "$CASE_DIR" > "$RESULT/validate.json"
            python -m tracecite.root_cause_benchmarking prepare "$CASE_DIR" --work-dir "$PREP" > "$RESULT/prepare.json"
          else
            python -m tracecite.benchmarking validate "$CASE_DIR" > "$RESULT/validate.json"
            python -m tracecite.benchmarking prepare "$CASE_DIR" --work-dir "$PREP" > "$RESULT/prepare.json"
          fi
          PREPARED="$(find "$PREP" -name prepared.json -type f -print -quit)"
          test -n "$PREPARED"
          python - "$PREPARED" >> "$GITHUB_ENV" <<'PY'
          import json, sys
          from pathlib import Path
          p = Path(sys.argv[1])
          data = json.loads(p.read_text())
          inputs = data.get('inputs') or []
          if len(inputs) != 1:
              raise SystemExit(f'expected one input, got {len(inputs)}')
          f = Path(inputs[0]['path']).resolve()
          print(f'INPUT_ROOT={f.parent}')
          print(f'INPUT_FILE={f.name}')
          print(f'QUESTION_FILE={Path(data["question"]).resolve()}')
          PY

      - name: Run Pi without TraceCite
        shell: bash
        run: |
          set -euo pipefail
          QUESTION="$(cat "$QUESTION_FILE")"
          SYSTEM_PROMPT='You are a real coding agent investigating supplied runtime evidence. Use only evidence from files in the current working directory; do not use external knowledge. You own hypotheses, causal reasoning, tool choice, investigation order, and the final conclusion. Use the native tools available to you as needed and keep exploration bounded. Every material factual claim must cite exact line numbers you actually observed. Distinguish direct observation from inference and explicitly say when the supplied evidence is insufficient for a deeper claim.'
          mkdir -p "$RESULT/pi-native-session"
          cd "$INPUT_ROOT"
          set +e
          timeout 900s pi \
            --provider gmi --model "$BENCH_MODEL" --api-key "$OPENAI_API_KEY" \
            --thinking off --mode text --print \
            --session-dir "$RESULT/pi-native-session" \
            --tools read,bash,grep,find,ls \
            --no-extensions --no-skills --no-prompt-templates --no-context-files \
            --system-prompt "$SYSTEM_PROMPT" "$QUESTION" \
            > "$RESULT/pi-native-answer.md" 2> "$RESULT/pi-native-stderr.log"
          code=$?
          set -e
          echo "$code" > "$RESULT/pi-native-exit.txt"

      - name: Run Pi with actual TraceCite use
        shell: bash
        run: |
          set -euo pipefail
          QUESTION="$(cat "$QUESTION_FILE")"
          SYSTEM_PROMPT='You are a real coding agent investigating supplied runtime evidence. Use only evidence from files in the current working directory; do not use external knowledge. You own hypotheses, causal reasoning, investigation order, and the final conclusion. Native tools and TraceCite evidence tools are available. During this investigation, actually use tracecite_search at least once and tracecite_expand at least once; you choose the queries, anchor lines, and all other tools yourself. TraceCite provides evidence, coverage, and literal relationships only; it does not decide root cause. Treat TraceCite progress.stop.recommended or explicit no-new-evidence guidance as a stop signal for that evidence scope; do not broaden merely to discover a deeper cause. Keep exploration bounded. Every material factual claim must cite exact line numbers you actually observed. Distinguish direct observation from inference and explicitly say when the supplied evidence is insufficient for a deeper claim.'
          mkdir -p "$RESULT/pi-tracecite-session"
          cd "$INPUT_ROOT"
          set +e
          timeout 900s pi \
            --provider gmi --model "$BENCH_MODEL" --api-key "$OPENAI_API_KEY" \
            --thinking off --mode text --print \
            --session-dir "$RESULT/pi-tracecite-session" \
            --extension "$GITHUB_WORKSPACE/benchmarks/agent-investigation/pi_tracecite_extension.ts" \
            --tools read,bash,grep,find,ls,tracecite_search,tracecite_expand \
            --no-skills --no-prompt-templates --no-context-files \
            --system-prompt "$SYSTEM_PROMPT" "$QUESTION" \
            > "$RESULT/pi-tracecite-answer.md" 2> "$RESULT/pi-tracecite-stderr.log"
          code=$?
          set -e
          echo "$code" > "$RESULT/pi-tracecite-exit.txt"

      - name: Convert, validate actual use, and score
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for arm in native tracecite; do
            SESSION="$(find "$RESULT/pi-${arm}-session" -type f -name '*.jsonl' -print -quit 2>/dev/null || true)"
            ANSWER="$RESULT/pi-${arm}-answer.md"
            if [[ -z "$SESSION" || ! -f "$ANSWER" ]]; then
              continue
            fi
            python benchmarks/agent-investigation/pi_session_to_transcript.py \
              "$SESSION" "$ANSWER" "$RESULT/pi-${arm}-transcript.jsonl" \
              --mode "pi-${arm}" --model "$BENCH_MODEL"
            if [[ "$SCORER" == "root_cause" ]]; then
              python -m tracecite.root_cause_benchmarking score \
                "$CASE_DIR" "$RESULT/pi-${arm}-transcript.jsonl" \
                > "$RESULT/pi-${arm}-score.json" || true
            else
              python -m tracecite.benchmarking score \
                "$CASE_DIR" "$RESULT/pi-${arm}-transcript.jsonl" \
                > "$RESULT/pi-${arm}-score.json" || true
            fi
          done

          python - <<'PY'
          import json, os, sys
          from collections import Counter
          from pathlib import Path

          sys.path.insert(0, str(Path('benchmarks/agent-investigation').resolve()))
          from pi_ab_runtime import classify_arm_validity

          root = Path(os.environ['RESULT'])
          scorer = os.environ['SCORER']
          eligible = [x for x in os.environ.get('ELIGIBLE_DIMENSIONS', '').split(',') if x]
          primary = os.environ.get('PRIMARY') == 'true'

          def arm(name):
              score_path = root / f'pi-{name}-score.json'
              transcript_path = root / f'pi-{name}-transcript.jsonl'
              exit_path = root / f'pi-{name}-exit.txt'
              stderr_path = root / f'pi-{name}-stderr.log'
              score = json.loads(score_path.read_text()) if score_path.is_file() else {}
              quality = score.get('quality') or {}
              cost = score.get('context_cost') or {}
              tools = Counter()
              if transcript_path.is_file():
                  for line in transcript_path.read_text().splitlines():
                      if not line.strip():
                          continue
                      e = json.loads(line)
                      if e.get('type') == 'tool':
                          tools[str(e.get('name') or 'unknown')] += 1
              exit_code = int(exit_path.read_text().strip()) if exit_path.is_file() else None
              stderr = stderr_path.read_text(errors='replace') if stderr_path.is_file() else ''
              validity = classify_arm_validity(exit_code, stderr)
              row = {
                  'exit_code': exit_code,
                  'valid_for_comparison': validity.valid_for_comparison,
                  'infrastructure_invalid': validity.infrastructure_invalid,
                  'failure_kind': validity.failure_kind,
                  'raw_passed': score.get('passed') if validity.valid_for_comparison else None,
                  'scored_raw_passed': score.get('passed'),
                  'stderr_tail': stderr[-300:] if stderr else '',
                  'tool_names': dict(sorted(tools.items())),
                  'model_calls': cost.get('model_calls'),
                  'tool_calls': cost.get('tool_calls'),
                  'reported_input_tokens': cost.get('reported_input_tokens'),
                  'reported_cache_read_input_tokens': cost.get('reported_cache_read_input_tokens'),
                  'reported_output_tokens': cost.get('reported_output_tokens'),
                  'tool_output_chars': cost.get('tool_output_chars'),
              }
              if scorer == 'root_cause':
                  dims = {d['id']: bool(d.get('hit')) for d in quality.get('dimensions') or []}
                  support = {d['id']: bool(d.get('supported')) for d in quality.get('dimension_evidence_support') or []}
                  row['eligible_dimensions'] = eligible
                  row['eligible_dimension_recall'] = (
                      sum(dims.get(d, False) for d in eligible) / len(eligible) if eligible else None
                  )
                  row['eligible_supported_dimension_recall'] = (
                      sum(support.get(d, False) for d in eligible) / len(eligible) if eligible else None
                  )
                  row['citation_accuracy'] = (quality.get('citation') or {}).get('accuracy')
              else:
                  row['concept_recall'] = quality.get('concept_recall')
                  row['evidence_marker_recall'] = quality.get('evidence_marker_recall')
              return row

          native = arm('native')
          trace = arm('tracecite')
          trace_used = (
              trace['tool_names'].get('tracecite_search', 0) >= 1 and
              trace['tool_names'].get('tracecite_expand', 0) >= 1
          )
          comparison_valid = native['valid_for_comparison'] and trace['valid_for_comparison']
          comparison = {
              'schema_version': 2,
              'suite_id': 'agent-evidence-moderate-v1',
              'case_id': os.environ['CASE_ID'],
              'tier': next((c['tier'] for c in json.loads(Path('benchmarks/agent-investigation/moderate-suite.json').read_text())['cases'] if c['id'] == os.environ['CASE_ID']), None),
              'scorer': scorer,
              'primary_correctness_eligible': primary,
              'comparison_valid': comparison_valid,
              'tracecite_actual_use_valid': trace_used,
              'native': native,
              'tracecite': trace,
          }
          (root / 'comparison.json').write_text(json.dumps(comparison, indent=2, sort_keys=True) + '\n')
          print(json.dumps(comparison, indent=2, sort_keys=True))
          if not comparison_valid:
              failures = [
                  f"{name}:{row['failure_kind']}"
                  for name, row in [('native', native), ('tracecite', trace)]
                  if not row['valid_for_comparison']
              ]
              raise SystemExit('Infrastructure-invalid Pi A/B comparison: ' + ', '.join(failures))
          if not trace_used:
              raise SystemExit('TraceCite arm is invalid: tracecite_search and tracecite_expand were not both used')
          PY

      - name: Upload case comparison artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moderate-${{ matrix.case_id }}
          path: /tmp/pi-moderate-${{ matrix.case_id }}
          if-no-files-found: warn
