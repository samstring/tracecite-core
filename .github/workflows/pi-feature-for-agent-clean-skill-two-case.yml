name: Pi Feature For Agent Clean Skill Two-Case

on:
  push:
    branches:
      - feature_for_agent
    paths:
      - benchmarks/agent-investigation/clean-skill-two-case-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-feature-for-agent-clean-skill-two-case
  cancel-in-progress: false

jobs:
  case-run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - model_slot: gmi1
            case_id: containerd-6772
          - model_slot: gmi2
            case_id: kubernetes-140039-runc-5347
    name: ${{ matrix.model_slot }}-${{ matrix.case_id }}
    env:
      GMI_BASE_URL: https://api.gmi-serving.com/v1
      BENCH_MODEL: ${{ matrix.model_slot == 'gmi1' && vars.GMI_MODEL || vars.GMI2_MODEL }}
      BENCH_API_KEY: ${{ matrix.model_slot == 'gmi1' && secrets.GMI_API_KEY || secrets.GMI2_API_KEY }}
      PI_CODING_AGENT_DIR: /tmp/pi-agent-${{ matrix.model_slot }}-${{ matrix.case_id }}
      PI_SKIP_VERSION_CHECK: "1"
      PI_TELEMETRY: "0"
      RESULT_ROOT: /tmp/pi-clean-skill-two-case/${{ matrix.model_slot }}/${{ matrix.case_id }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Pi and TraceCite
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BENCH_MODEL"
          test -n "$BENCH_API_KEY"
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.84.4
          python -m pip install -e ".[dev,diversity]"
          python -m pytest -q \
            tests/test_pi_four_public_strict_boundary.py \
            tests/test_pi_tracecite_runtime_neutral.py \
            tests/test_session_novelty_regressions.py

      - name: Configure model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PI_CODING_AGENT_DIR" "$RESULT_ROOT"
          printf '%s\n' "$BENCH_MODEL" > "$RESULT_ROOT/model.txt"
          python - <<'PY'
          import json, os
          from pathlib import Path
          model = os.environ['BENCH_MODEL']
          payload = {'providers': {'gmi': {
              'name': 'GMI OpenAI-compatible',
              'baseUrl': os.environ['GMI_BASE_URL'],
              'api': 'openai-completions',
              'models': [{
                  'id': model,
                  'name': model,
                  'reasoning': False,
                  'input': ['text'],
                  'cost': {'input': 0, 'output': 0, 'cacheRead': 0, 'cacheWrite': 0},
                  'contextWindow': 1_000_000,
                  'maxTokens': 4_096,
                  'compat': {'supportsDeveloperRole': False, 'supportsReasoningEffort': False},
              }],
          }}}
          (Path(os.environ['PI_CODING_AGENT_DIR']) / 'models.json').write_text(json.dumps(payload, indent=2) + '\n')
          PY

      - name: Run Native and TraceCite
        shell: bash
        run: |
          set -u
          CASE_ID="${{ matrix.case_id }}"
          CASE_DIR="$GITHUB_WORKSPACE/benchmarks/agent-investigation/cases/$CASE_ID"
          PREP="$RESULT_ROOT/prepared"
          mkdir -p "$PREP"

          python -m tracecite.benchmarking validate "$CASE_DIR" > "$RESULT_ROOT/validate.json" || exit 2
          python -m tracecite.benchmarking prepare "$CASE_DIR" --work-dir "$PREP" > "$RESULT_ROOT/prepare.json" || exit 2
          PREPARED="$(find "$PREP" -name prepared.json -type f -print -quit)"
          test -n "$PREPARED" || exit 2

          eval "$(python - "$PREPARED" <<'PY'
          import json, os, shlex, sys
          from pathlib import Path
          data=json.loads(Path(sys.argv[1]).read_text())
          files=[Path(x['path']).resolve() for x in data['inputs']]
          common=Path(os.path.commonpath([str(p.parent) for p in files])).resolve()
          print('INPUT_ROOT='+shlex.quote(str(common)))
          print('QUESTION_FILE='+shlex.quote(str(Path(data['question']).resolve())))
          print('INPUT_FILES='+shlex.quote(','.join(p.name for p in files)))
          PY
          )"
          QUESTION="$(cat "$QUESTION_FILE")"

          ORDER_PROMPT="When supplied evidence includes source line/range coordinates, preserve their order within the same artifact: a lower line/range appears earlier in that artifact and a higher line/range appears later. Treat this only as observed artifact output order and a chronology hint. Do not equate file/line order with execution order, global happens-before, or causality without additional supplied evidence. Stack-frame presentation order and goroutine/thread presentation order are not execution order. Prefer explicit timestamps, same request/session identity, same execution-context progression, or explicit state transitions when available."
          BASE_PROMPT="You are a coding agent investigating supplied runtime evidence. Keep the investigation bounded. Once the root cause is sufficiently supported, answer immediately instead of performing confirmatory searches. Cite exact evidence lines for material factual claims. $ORDER_PROMPT"

          run_score_usage() {
            local arm="$1"
            local arm_root="$RESULT_ROOT/$arm"
            local session
            session="$(find "$arm_root/session" -type f -name '*.jsonl' -print -quit 2>/dev/null || true)"
            if [[ -n "$session" && -f "$arm_root/answer.md" ]]; then
              python benchmarks/agent-investigation/pi_session_to_transcript.py \
                "$session" "$arm_root/answer.md" "$arm_root/transcript.jsonl" \
                --mode "pi-$arm" --model "$BENCH_MODEL" || true
              python - "$CASE_DIR" "$arm_root/transcript.jsonl" "$arm_root/score.json" <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          case_dir=Path(sys.argv[1]); transcript=Path(sys.argv[2]); out=Path(sys.argv[3])
          gold=json.loads((case_dir/'gold.json').read_text())
          module='tracecite.root_cause_benchmarking' if 'root_cause_schema_version' in gold else 'tracecite.benchmarking'
          p=subprocess.run([sys.executable,'-m',module,'score',str(case_dir),str(transcript)],text=True,capture_output=True)
          out.write_text(p.stdout or json.dumps({'available':False,'returncode':p.returncode,'stderr':p.stderr[-2000:]}))
          PY
              python - "$arm_root/transcript.jsonl" "$arm_root/usage.json" <<'PY'
          import json, sys
          from pathlib import Path
          totals={'input_tokens':0,'output_tokens':0,'cache_read_tokens':0,'model_calls':0,'tool_calls':0}
          for line in Path(sys.argv[1]).read_text(errors='replace').splitlines():
              try: e=json.loads(line)
              except Exception: continue
              if e.get('type')=='model':
                  u=e.get('usage') or {}
                  totals['input_tokens']+=int(u.get('input_tokens') or 0)
                  totals['output_tokens']+=int(u.get('output_tokens') or 0)
                  totals['cache_read_tokens']+=int(u.get('cache_read_input_tokens') or u.get('cached_input_tokens') or 0)
                  totals['model_calls']+=1
              elif e.get('type')=='tool':
                  totals['tool_calls']+=1
          Path(sys.argv[2]).write_text(json.dumps(totals,indent=2,sort_keys=True)+'\n')
          PY
            fi
          }

          for arm in native tracecite; do
            ARM_ROOT="$RESULT_ROOT/$arm"
            rm -rf "$ARM_ROOT"
            mkdir -p "$ARM_ROOT/session"
            cd "$INPUT_ROOT"

            if [[ "$arm" == "native" ]]; then
              SYSTEM_PROMPT="$BASE_PROMPT Use only evidence from files in the current working directory and do not use external knowledge."
              set +e
              timeout -k 30s 900s pi \
                --provider gmi --model "$BENCH_MODEL" --api-key "$BENCH_API_KEY" \
                --thinking off --mode text --print \
                --session-dir "$ARM_ROOT/session" \
                --tools read,bash,grep,find,ls \
                --no-extensions --no-skills --no-prompt-templates --no-context-files \
                --system-prompt "$SYSTEM_PROMPT" "$QUESTION" \
                > "$ARM_ROOT/answer.md" 2> "$ARM_ROOT/stderr.log"
              code=$?
              set -e
            else
              unset TRACECITE_BENCHMARK_MODE || true
              unset TRACECITE_MODE || true
              export TRACECITE_EVIDENCE_ROOT="$INPUT_ROOT"
              export TRACECITE_EVIDENCE_FILES="$INPUT_FILES"
              export TRACECITE_LOG_ACCESS_ACTIVITY="$ARM_ROOT/tracecite-runtime-evidence-access.jsonl"
              export TRACECITE_BLOCKED_NATIVE_EVIDENCE_ACTIVITY="$ARM_ROOT/tracecite-blocked-native-evidence-attempts.jsonl"
              SYSTEM_PROMPT="$BASE_PROMPT Follow the user's explicit request to use TraceCite. All runtime-evidence content must be obtained through TraceCite tools; do not use native file-access tools for the evidence."
              REQUEST="用 tracecite 分析这个问题。${QUESTION}"
              set +e
              timeout -k 30s 900s pi \
                --provider gmi --model "$BENCH_MODEL" --api-key "$BENCH_API_KEY" \
                --thinking off --mode text --print \
                --session-dir "$ARM_ROOT/session" \
                --extension "$GITHUB_WORKSPACE/benchmarks/agent-investigation/pi_tracecite_extension.ts" \
                --tools tracecite_search,tracecite_expand \
                --no-skills --skill "$GITHUB_WORKSPACE/.pi/skills/tracecite/SKILL.md" \
                --no-prompt-templates --no-context-files \
                --system-prompt "$SYSTEM_PROMPT" "$REQUEST" \
                > "$ARM_ROOT/answer.md" 2> "$ARM_ROOT/stderr.log"
              code=$?
              set -e
            fi

            echo "$code" > "$ARM_ROOT/exit.txt"
            cd "$GITHUB_WORKSPACE"
            run_score_usage "$arm"

            trace_calls=0
            blocked=0
            [[ -f "$ARM_ROOT/tracecite-runtime-evidence-access.jsonl" ]] && trace_calls="$(grep -cve '^$' "$ARM_ROOT/tracecite-runtime-evidence-access.jsonl" || true)"
            [[ -f "$ARM_ROOT/tracecite-blocked-native-evidence-attempts.jsonl" ]] && blocked="$(grep -cve '^$' "$ARM_ROOT/tracecite-blocked-native-evidence-attempts.jsonl" || true)"
            printf '{"tracecite_evidence_calls":%s,"blocked_native_attempts":%s}\n' "$trace_calls" "$blocked" > "$ARM_ROOT/channel.json"

            sleep 30
          done

      - name: Show summary
        if: always()
        shell: bash
        run: |
          echo "model=$(cat "$RESULT_ROOT/model.txt" 2>/dev/null || true)"
          echo "case=${{ matrix.case_id }}"
          for arm in native tracecite; do
            echo "===== $arm ====="
            echo "exit=$(cat "$RESULT_ROOT/$arm/exit.txt" 2>/dev/null || true)"
            cat "$RESULT_ROOT/$arm/usage.json" 2>/dev/null || true
            cat "$RESULT_ROOT/$arm/channel.json" 2>/dev/null || true
            cat "$RESULT_ROOT/$arm/score.json" 2>/dev/null || true
            echo "--- answer ---"
            cat "$RESULT_ROOT/$arm/answer.md" 2>/dev/null || true
          done

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-skill-${{ matrix.model_slot }}-${{ matrix.case_id }}
          path: ${{ env.RESULT_ROOT }}
          if-no-files-found: error
          retention-days: 14
