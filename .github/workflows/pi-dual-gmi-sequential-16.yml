  compare:
    name: Compare all 16 cases
    needs: [native_16, tracecite_16]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download all available case artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: seq16-*
          path: /tmp/pi-seq16-results

      - name: Build 16-case comparison
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pi-seq16-comparison
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/pi-seq16-results')
          out = Path('/tmp/pi-seq16-comparison')
          cases = [
              'doublecmd-2264',
              'doublecmd-2616',
              'doublecmd-2731',
              'doublecmd-2772',
              'doublecmd-2777',
              'doublecmd-2809',
              'doublecmd-2815',
              'doublecmd-3061',
              'flutter-179398',
              'mobile-payment-runtime-evidence',
              'prometheus-18018',
              'pulumi-20529',
              'kubernetes-140039-runc-5347',
              'kubernetes-140268',
              'kubernetes-140628',
              'kubernetes-140848',
          ]

          def load(arm, case):
              p = root / f'seq16-{arm}-{case}' / 'case-summary.json'
              if not p.is_file():
                  return {
                      'case_key': case,
                      'arm': arm,
                      'missing_artifact': True,
                      'valid_for_comparison': False,
                      'validity_reason': 'missing_artifact',
                  }
              try:
                  value = json.loads(p.read_text())
                  value['missing_artifact'] = False
                  return value
              except Exception as exc:
                  return {
                      'case_key': case,
                      'arm': arm,
                      'missing_artifact': True,
                      'valid_for_comparison': False,
                      'validity_reason': f'invalid_summary:{type(exc).__name__}',
                  }

          rows = []
          for case in cases:
              n = load('native', case)
              t = load('tracecite', case)
              nt = n.get('total_input_tokens')
              tt = t.get('total_input_tokens')
              saving = None
              if isinstance(nt, int) and nt > 0 and isinstance(tt, int):
                  saving = round((nt - tt) / nt * 100.0, 2)
              channel_ok = t.get('channel_valid')
              pair_valid = bool(
                  n.get('valid_for_comparison')
                  and t.get('valid_for_comparison')
                  and channel_ok is True
              )
              rows.append({
                  'case': case,
                  'pair_valid': pair_valid,
                  'native': n,
                  'tracecite': t,
                  'token_reduction_pct': saving,
              })

          valid = [r for r in rows if r['pair_valid']]
          native_total = sum(
              r['native']['total_input_tokens']
              for r in valid
              if isinstance(r['native'].get('total_input_tokens'), int)
          )
          trace_total = sum(
              r['tracecite']['total_input_tokens']
              for r in valid
              if isinstance(r['tracecite'].get('total_input_tokens'), int)
          )
          aggregate_saving = (
              round((native_total - trace_total) / native_total * 100.0, 2)
              if native_total > 0 else None
          )

          def success(summary):
              value = summary.get('support_aware_passed')
              if value is None:
                  value = summary.get('passed')
              return value is True

          aggregate = {
              'schema_version': 1,
              'case_count': len(cases),
              'valid_pair_count': len(valid),
              'invalid_pair_count': len(cases) - len(valid),
              'native_pass_count_on_valid_pairs': sum(success(r['native']) for r in valid),
              'tracecite_pass_count_on_valid_pairs': sum(success(r['tracecite']) for r in valid),
              'native_total_input_tokens_on_valid_pairs': native_total,
              'tracecite_total_input_tokens_on_valid_pairs': trace_total,
              'aggregate_token_reduction_pct': aggregate_saving,
              'tracecite_channel_clean_valid_pairs': sum(
                  r['tracecite'].get('native_runtime_evidence_accesses') == 0 for r in valid
              ),
          }
          payload = {'aggregate': aggregate, 'rows': rows}
          (out / 'comparison.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + '\n'
          )

          def fmt(v):
              return '-' if v is None else str(v)

          md = [
              '# Pi Dual GMI Sequential 16 A/B',
              '',
              f"- Valid pairs: {aggregate['valid_pair_count']}/{aggregate['case_count']}",
              f"- Native pass count (valid pairs): {aggregate['native_pass_count_on_valid_pairs']}",
              f"- TraceCite pass count (valid pairs): {aggregate['tracecite_pass_count_on_valid_pairs']}",
              f"- Native total input tokens (valid pairs): {aggregate['native_total_input_tokens_on_valid_pairs']}",
              f"- TraceCite total input tokens (valid pairs): {aggregate['tracecite_total_input_tokens_on_valid_pairs']}",
              f"- Aggregate TraceCite token reduction: {fmt(aggregate['aggregate_token_reduction_pct'])}%",
              '',
              '| Case | Valid | Native pass | TraceCite pass | Native input | TraceCite input | Saving | N citation | T citation | T MCP | T native evidence |',
              '|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|',
          ]
          for r in rows:
              n, t = r['native'], r['tracecite']
              md.append(
                  '| {case} | {valid} | {np} | {tp} | {ni} | {ti} | {save} | {nc} | {tc} | {mcp} | {native_ev} |'.format(
                      case=r['case'],
                      valid='yes' if r['pair_valid'] else 'no',
                      np=fmt(n.get('support_aware_passed', n.get('passed'))),
                      tp=fmt(t.get('support_aware_passed', t.get('passed'))),
                      ni=fmt(n.get('total_input_tokens')),
                      ti=fmt(t.get('total_input_tokens')),
                      save=(f"{r['token_reduction_pct']}%" if r['token_reduction_pct'] is not None else '-'),
                      nc=fmt(n.get('citation_accuracy')),
                      tc=fmt(t.get('citation_accuracy')),
                      mcp=fmt(t.get('mcp_calls')),
                      native_ev=fmt(t.get('native_runtime_evidence_accesses')),
                  )
              )
          md += ['', '## Invalid / incomplete pairs', '']
          for r in rows:
              if r['pair_valid']:
                  continue
              md.append(
                  f"- {r['case']}: native={r['native'].get('validity_reason')} "
                  f"tracecite={r['tracecite'].get('validity_reason')} "
                  f"channel_valid={r['tracecite'].get('channel_valid')}"
              )
          (out / 'comparison.md').write_text('\n'.join(md) + '\n')
          print(json.dumps(aggregate, indent=2))
          PY

      - name: Upload suite comparison
        uses: actions/upload-artifact@v4
        with:
          name: seq16-comparison
          path: /tmp/pi-seq16-comparison
          if-no-files-found: error
          retention-days: 14
