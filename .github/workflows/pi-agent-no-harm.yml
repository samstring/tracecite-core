name: Pi Agent TraceCite No-Harm

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/evidence-intelligence
    paths:
      - .github/workflows/pi-agent-no-harm.yml
      - benchmarks/agent-investigation/pi_session_to_transcript.py
      - benchmarks/agent-investigation/pi_tracecite_bridge.py
      - benchmarks/agent-investigation/pi_tracecite_extension.ts
      - benchmarks/agent-investigation/cases/flutter-179398/**
      - src/tracecite/**

permissions:
  contents: read

jobs:
  flutter-179398:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.TRACECITE_BENCH_BASE_URL || 'https://api.gmi-serving.com/v1' }}
      BENCH_MODEL: ${{ vars.TRACECITE_BENCH_MODEL }}
      PI_CODING_AGENT_DIR: /tmp/pi-agent-config
      PI_SKIP_VERSION_CHECK: "1"
      PI_TELEMETRY: "0"
      CASE_DIR: benchmarks/agent-investigation/cases/flutter-179398
      RESULT: /tmp/pi-real-flutter-179398
      PREP: /tmp/pi-real-flutter-179398/prepared
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install real Pi coding agent
        run: |
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.84.4
          pi --version

      - name: Install TraceCite and ripgrep
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ripgrep
          fi

      - name: Configure GMI model for Pi
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PI_CODING_AGENT_DIR"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          target = Path(os.environ["PI_CODING_AGENT_DIR"]) / "models.json"
          model = os.environ["BENCH_MODEL"]
          if not model:
              raise SystemExit("BENCH_MODEL is empty")
          payload = {
              "providers": {
                  "gmi": {
                      "name": "GMI OpenAI-compatible",
                      "baseUrl": os.environ["OPENAI_BASE_URL"],
                      "api": "openai-completions",
                      "models": [{
                          "id": model,
                          "name": model,
                          "reasoning": False,
                          "input": ["text"],
                          "cost": {"input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0},
                          "contextWindow": 1_000_000,
                          "maxTokens": 4_096,
                          "compat": {"supportsDeveloperRole": False, "supportsReasoningEffort": False},
                      }],
                  }
              }
          }
          target.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Prepare Flutter evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RESULT"
          mkdir -p "$RESULT" "$PREP"
          python -m tracecite.root_cause_benchmarking validate "$CASE_DIR" > "$RESULT/validate.json"
          python -m tracecite.root_cause_benchmarking prepare "$CASE_DIR" --work-dir "$PREP" > "$RESULT/prepare.json"
          PREPARED="$(find "$PREP" -name prepared.json -type f -print -quit)"
          test -n "$PREPARED"
          python - "$PREPARED" >> "$GITHUB_ENV" <<'PY'
          import json
          import sys
          from pathlib import Path

          prepared = Path(sys.argv[1])
          payload = json.loads(prepared.read_text(encoding="utf-8"))
          inputs = payload.get("inputs") or []
          if len(inputs) != 1:
              raise SystemExit(f"expected one input, got {len(inputs)}")
          input_path = Path(inputs[0]["path"]).resolve()
          print(f"INPUT_ROOT={input_path.parent}")
          print(f"QUESTION_FILE={Path(payload['question']).resolve()}")
          PY

      - name: Run real Pi with TraceCite tools
        shell: bash
        run: |
          set -euo pipefail
          QUESTION="$(cat "$QUESTION_FILE")"
          SYSTEM_PROMPT=$(cat <<'EOF'
          You are a real coding agent investigating one supplied crash/log artifact. Use only evidence from files in the current working directory; do not use external knowledge. You own hypotheses, causal reasoning, tool choice, and the final conclusion. Native read, grep, find, ls, and bash tools are available. You also have first-class tracecite_search and tracecite_expand tools for deterministic bounded evidence retrieval. TraceCite is not a reasoner: its results are evidence/navigation with explicit coverage, not root-cause truth. Prefer tracecite_search when native grep would create broad/high-volume context, and tracecite_expand before relying on a decisive compact hit. Every material factual claim in the final answer must cite exact line numbers you actually observed. Distinguish direct observation from inference. Finish with a concise answer containing only the requested conclusions and evidence.
          EOF
          )
          mkdir -p "$RESULT/pi-tracecite-session"
          cd "$INPUT_ROOT"
          set +e
          timeout 900s pi \
            --provider gmi \
            --model "$BENCH_MODEL" \
            --api-key "$OPENAI_API_KEY" \
            --thinking off \
            --mode text \
            --print \
            --session-dir "$RESULT/pi-tracecite-session" \
            --extension "$GITHUB_WORKSPACE/benchmarks/agent-investigation/pi_tracecite_extension.ts" \
            --tools read,bash,grep,find,ls,tracecite_search,tracecite_expand \
            --no-skills \
            --no-prompt-templates \
            --no-context-files \
            --system-prompt "$SYSTEM_PROMPT" \
            "$QUESTION" \
            > "$RESULT/pi-tracecite-answer.md" 2> "$RESULT/pi-tracecite-stderr.log"
          code=$?
          set -e
          echo "$code" > "$RESULT/pi-tracecite-exit.txt"
          cat "$RESULT/pi-tracecite-answer.md"

      - name: Convert and score
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          SESSION="$(find "$RESULT/pi-tracecite-session" -type f -name '*.jsonl' -print -quit 2>/dev/null || true)"
          ANSWER="$RESULT/pi-tracecite-answer.md"
          if [[ -n "$SESSION" && -f "$ANSWER" ]]; then
            python benchmarks/agent-investigation/pi_session_to_transcript.py \
              "$SESSION" "$ANSWER" "$RESULT/pi-tracecite-transcript.jsonl" \
              --mode pi-tracecite --model "$BENCH_MODEL"
            python -m tracecite.root_cause_benchmarking score \
              "$CASE_DIR" "$RESULT/pi-tracecite-transcript.jsonl" \
              > "$RESULT/pi-tracecite-score.json" || true
            cat "$RESULT/pi-tracecite-score.json"
          fi

      - name: Upload real Pi no-harm artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-real-flutter-179398
          path: /tmp/pi-real-flutter-179398
          if-no-files-found: warn
