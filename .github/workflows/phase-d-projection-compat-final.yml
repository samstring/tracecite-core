name: Phase D Projection Compatibility Final

on:
  push:
    branches:
      - experiment/evidence-intelligence
    paths:
      - .github/workflows/phase-d-projection-compat-final.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/evidence-intelligence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply final projection compatibility repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def one(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected one match, got {n}")
              return text.replace(old, new, 1)

          p = Path('src/tracecite/integrations/agent_projection.py')
          s = p.read_text(encoding='utf-8')
          s = one(s,
          '''    if name == "lightweight":\n        return lightweight_result(canonical)\n    if name in {"agent", "portable-json", "strict-json", "stateful-index", "frame"}:\n        operation = str(canonical.get("operation") or "")\n        if operation == "search":\n            return compact_search_result(canonical, max_output_chars=max_output_chars)\n        if operation == "expand_many":\n            return fit_expand_many_result(canonical, max_output_chars=max_output_chars)\n        if name == "agent":\n            return lightweight_result(apply_survey_brief(canonical))\n        return canonical\n''',
          '''    if name == "lightweight":\n        return lightweight_result(canonical)\n    if name == "agent":\n        return lightweight_result(apply_survey_brief(canonical))\n    if name in {"portable-json", "strict-json", "stateful-index", "frame"}:\n        operation = str(canonical.get("operation") or "")\n        if operation == "search":\n            return compact_search_result(canonical, max_output_chars=max_output_chars)\n        if operation == "expand_many":\n            return fit_expand_many_result(canonical, max_output_chars=max_output_chars)\n        return canonical\n''', 'project agent fidelity')
          p.write_text(s, encoding='utf-8')

          p = Path('src/tracecite/integrations/cli.py')
          s = p.read_text(encoding='utf-8')
          s = one(s,
          '''        if args.command == "search" and compact:\n            projector = search_projector or project\n            payload = projector(\n                payload,\n                profile=profile.name,\n                max_output_chars=args.max_output_chars,\n            )\n        elif args.command == "expand-many":\n            payload = project(\n                payload,\n                profile=profile.name,\n                max_output_chars=args.max_output_chars,\n            )\n''',
          '''        transport_projection = "portable-json" if profile.name == "agent" else profile.name\n        if args.command == "search" and compact:\n            projector = search_projector or project\n            payload = projector(\n                payload,\n                profile=transport_projection,\n                max_output_chars=args.max_output_chars,\n            )\n        elif args.command == "expand-many":\n            payload = project(\n                payload,\n                profile=transport_projection,\n                max_output_chars=args.max_output_chars,\n            )\n''', 'CLI transport mapping')
          p.write_text(s, encoding='utf-8')

          p = Path('benchmarks/agent-investigation/gmi_host.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('from tracecite.integrations import cli as trace_cli\n',
              'from tracecite.integrations.agent_profile import render_frame\nfrom tracecite.integrations.agent_projection import project\n', 1)
          s = one(s,
          '''        baseline = trace_cli._compact_search_result(canonical, max_output_chars=None)\n        baseline = trace_cli.lightweight_result(baseline)\n        if self.mode != "tracecite_context":\n            return trace_cli.render_frame(baseline)\n''',
          '''        baseline = project(canonical, profile="frame", max_output_chars=None)\n        if self.mode != "tracecite_context":\n            return render_frame(baseline)\n''', 'gmi host baseline')
          s = one(s,
          '''        delta = trace_cli._compact_search_result(projected, max_output_chars=None)\n        delta = trace_cli.lightweight_result(delta)\n        baseline_frame = trace_cli.render_frame(baseline)\n        delta_frame = trace_cli.render_frame(delta)\n''',
          '''        delta = project(projected, profile="frame", max_output_chars=None)\n        baseline_frame = render_frame(baseline)\n        delta_frame = render_frame(delta)\n''', 'gmi host delta')
          p.write_text(s, encoding='utf-8')

          p = Path('benchmarks/agent-investigation/gmi_canonical_host.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('from tracecite.integrations import cli as trace_cli\n', '', 1)
          s = one(s,
          '''        view = project(payload, profile="agent")\n        if view.get("operation") == "search":\n            view = trace_cli._compact_search_result(\n                view,\n                max_output_chars=DEFAULT_AGENT_MAX_OUTPUT_CHARS,\n            )\n''',
          '''        view = project(payload, profile="agent")\n        if view.get("operation") == "search":\n            view = project(\n                view,\n                profile="portable-json",\n                max_output_chars=DEFAULT_AGENT_MAX_OUTPUT_CHARS,\n            )\n''', 'canonical host render')
          p.write_text(s, encoding='utf-8')

          p = Path('benchmarks/agent-investigation/gmi_scale_host.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('from tracecite.integrations import cli as trace_cli\n',
              'from tracecite.integrations.agent_profile import render_frame\nfrom tracecite.integrations.agent_projection import project\n', 1)
          s = one(s,
          '''        baseline = trace_cli._compact_search_result(canonical, max_output_chars=None)\n        baseline = trace_cli.lightweight_result(baseline)\n        baseline_frame = trace_cli.render_frame(baseline)\n''',
          '''        baseline = project(canonical, profile="frame", max_output_chars=None)\n        baseline_frame = render_frame(baseline)\n''', 'scale baseline')
          s = one(s,
          '''            delta = trace_cli._compact_search_result(projected, max_output_chars=None)\n            delta = trace_cli.lightweight_result(delta)\n            delta_frame = trace_cli.render_frame(delta)\n''',
          '''            delta = project(projected, profile="frame", max_output_chars=None)\n            delta_frame = render_frame(delta)\n''', 'scale delta')
          p.write_text(s, encoding='utf-8')

          p = Path('tests/test_agent_projection.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('for name in ("agent", "portable-json", "strict-json", "stateful-index", "frame"):',
                        'for name in ("portable-json", "strict-json", "stateful-index", "frame"):', 1)
          s += '''\n\ndef test_generic_agent_projection_preserves_canonical_evidence_shape() -> None:\n    digest = "b" * 64\n    payload = {\n        "operation": "search", "status": "ok", "outcome": "not_assessed",\n        "evidence": [{"uri": f"evidence://sha256/{digest}#L9", "source_path": "/tmp/runtime.log",\n                      "sha256": digest, "start_line": 9, "end_line": 9, "label": "visible evidence"}],\n        "coverage": {"match_records": 1, "evidence_returned": 1}, "data": {},\n    }\n    view = project(payload, profile="agent")\n    assert isinstance(view["evidence"], list)\n    assert view["evidence"][0]["label"] == "visible evidence"\n'''
          p.write_text(s, encoding='utf-8')
          PY
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify full deterministic suite
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --exclude-dir=.git '_compact_search_result\|_fit_expand_many_result' src benchmarks; then
            exit 1
          fi
          python scripts/check_architecture.py
          python scripts/check_schema_compat.py >/tmp/schema.json
          python -m pytest -W error::DeprecationWarning
      - name: Commit final repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/phase-d-projection-compat-fix.yml
          rm -f .github/workflows/phase-d-projection-compat-final.yml
          git config user.name "tracecite-phase-d-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(projection): preserve agent fidelity across hosts"
          git push origin HEAD:experiment/evidence-intelligence
