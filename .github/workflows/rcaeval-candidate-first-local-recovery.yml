name: RCAEval Candidate First Local Recovery

on:
  push:
    branches:
      - exp/candidate-first-local-recovery-v1
    paths:
      - src/tracecite/runtime/candidate_search.py
      - src/tracecite/runtime/candidate_filter.py
      - tests/test_candidate_search.py
      - tests/test_candidate_filter.py
      - benchmarks/agent-investigation/candidate_first_local_recovery.py
      - .github/workflows/rcaeval-candidate-first-local-recovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TraceCite and dataset deps
        run: |
          python -m pip install --quiet -e '.[dev,diversity]' huggingface_hub pandas pyarrow
      - name: Run candidate-search tests
        run: |
          python -m pytest -q \
            tests/test_candidate_search.py \
            tests/test_candidate_filter.py \
            tests/test_session_novelty_regressions.py \
            tests/test_pi_tracecite_runtime_neutral.py
      - name: Prepare RCAEval traces.jsonl
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          from huggingface_hub import snapshot_download

          case = 're3tt_ts-route-service_f3_6'
          srcroot = Path('/tmp/rcaeval-source')
          out = Path('/tmp/rcaeval-candidate-first')
          out.mkdir(parents=True, exist_ok=True)
          snapshot_download(
              repo_id='phamquiluan/RCAEval',
              repo_type='dataset',
              allow_patterns=[f'{case}/*'],
              local_dir=srcroot,
          )
          traces = pd.read_parquet(srcroot / case / 'traces.parquet')
          traces.to_json(out / 'traces.jsonl', orient='records', lines=True, force_ascii=False)
          print('bytes', (out / 'traces.jsonl').stat().st_size)
          print('rows', len(traces))
          PY
      - name: Compare legacy search vs candidate-first local recovery
        run: |
          python benchmarks/agent-investigation/candidate_first_local_recovery.py \
            /tmp/rcaeval-candidate-first/traces.jsonl \
            --output /tmp/rcaeval-candidate-first/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rcaeval-candidate-first-local-recovery
          path: /tmp/rcaeval-candidate-first/result.json
          retention-days: 14
