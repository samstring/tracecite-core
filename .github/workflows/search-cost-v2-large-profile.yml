name: Search Cost V2 Large Profile

on:
  push:
    branches:
      - experiment/evidence-intelligence-search-cost-v2
    paths:
      - src/**
      - tests/**
      - .github/workflows/search-cost-v2-large-profile.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install TraceCite and RCAEval dependencies
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install --quiet huggingface_hub pandas pyarrow

      - name: Prepare same RCAEval traces source
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          from huggingface_hub import snapshot_download

          case = 're3tt_ts-route-service_f3_6'
          root = Path('/tmp/rcaeval-source')
          out = Path('/tmp/rcaeval-profile')
          out.mkdir(parents=True, exist_ok=True)
          snapshot_download(
              repo_id='phamquiluan/RCAEval',
              repo_type='dataset',
              allow_patterns=[f'{case}/traces.parquet'],
              local_dir=root,
          )
          traces = pd.read_parquet(root / case / 'traces.parquet')
          traces.to_json(out / 'traces.jsonl', orient='records', lines=True, force_ascii=False)
          path = out / 'traces.jsonl'
          print(f'bytes={path.stat().st_size}')
          print(f'lines={sum(1 for _ in path.open(encoding="utf-8"))}')
          PY

      - name: Profile TraceCite search paths
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path

          from tracecite.runtime import EvidenceRequest, QueryTarget, RetrievalSessionStore, retrieve
          from tracecite.runtime import tools

          source = Path('/tmp/rcaeval-profile/traces.jsonl')
          queries = ['statusCode error', '503', 'ts-route-service']
          rows = []

          for query in queries:
              started = time.perf_counter()
              result = tools.search(
                  source,
                  query,
                  snapshot=False,
                  segmenter='jsonline',
                  max_evidence=20,
                  investigation_path=None,
                  cache=False,
              )
              elapsed = time.perf_counter() - started
              rows.append({
                  'path': 'tools.search(snapshot=False)',
                  'query': query,
                  'seconds': elapsed,
                  'status': result.get('status'),
                  'match_records': (result.get('coverage') or {}).get('match_records'),
                  'evidence_returned': (result.get('coverage') or {}).get('evidence_returned'),
              })

          session = RetrievalSessionStore(
              Path('/tmp/rcaeval-profile'),
              'large-profile',
              namespace='_retrieval_sessions',
              legacy_evidence_context=False,
          )
          for query in queries:
              started = time.perf_counter()
              result = retrieve(
                  EvidenceRequest(QueryTarget(source, query, snapshot=True, segmenter='jsonline')),
                  session=session,
              ).to_dict()
              elapsed = time.perf_counter() - started
              rows.append({
                  'path': 'canonical retrieve(snapshot=True, session)',
                  'query': query,
                  'seconds': elapsed,
                  'status': result.get('status'),
                  'match_records': (result.get('coverage') or {}).get('match_records'),
                  'evidence_returned': (result.get('coverage') or {}).get('evidence_returned'),
                  'new_evidence': (result.get('coverage') or {}).get('new_evidence'),
              })

          payload = {
              'source_bytes': source.stat().st_size,
              'source_lines': sum(1 for _ in source.open(encoding='utf-8')),
              'rows': rows,
          }
          out = Path('/tmp/rcaeval-profile/search-cost-v2-profile.json')
          out.write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(payload, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: search-cost-v2-large-profile
          path: /tmp/rcaeval-profile/search-cost-v2-profile.json
          retention-days: 7
