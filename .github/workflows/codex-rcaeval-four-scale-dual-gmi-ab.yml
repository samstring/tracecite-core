name: Codex RCAEval Four Scale Dual GMI A/B

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "smoke = first case; four = all four RCAEval scale cases"
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - four
      mcp_ref:
        description: "tracecite-mcp ref to checkout"
        required: true
        default: feature_for_agent
        type: string

permissions:
  contents: read

concurrency:
  group: codex-rcaeval-four-scale-dual-gmi-ab
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - id: matrix
        env:
          SCOPE: ${{ inputs.scope }}
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          cases = [
              {"case_id":"re3tt_ts-auth-service_f1_4","expected_service":"ts-auth-service","tier":"S1"},
              {"case_id":"re3tt_ts-auth-service_f1_1","expected_service":"ts-auth-service","tier":"S2"},
              {"case_id":"re3tt_ts-route-service_f1_1","expected_service":"ts-route-service","tier":"S3"},
              {"case_id":"re3tt_ts-route-service_f3_6","expected_service":"ts-route-service","tier":"S4"},
          ]
          chosen = cases[:1] if os.environ['SCOPE'] == 'smoke' else cases
          for index, row in enumerate(chosen):
              row['arm_order'] = 'native tracecite' if index % 2 == 0 else 'tracecite native'
          print('value=' + json.dumps({'include': chosen}, separators=(',', ':')))
          PY

  case:
    name: ${{ matrix.tier }} / ${{ matrix.case_id }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CASE_ID: ${{ matrix.case_id }}
      EXPECTED_SERVICE: ${{ matrix.expected_service }}
      ARM_ORDER: ${{ matrix.arm_order }}
      GMI_BASE_URL: https://api.gmi-serving.com/v1
      GMI_API_KEY: ${{ secrets.GMI_API_KEY }}
      GMI2_API_KEY: ${{ secrets.GMI2_API_KEY }}
      GMI_MODEL: ${{ vars.GMI_MODEL }}
      GMI2_MODEL: ${{ vars.GMI2_MODEL }}
      RUN_ROOT: /tmp/codex-rcaeval/${{ matrix.case_id }}

    steps:
      - name: Checkout TraceCite Core benchmark
        uses: actions/checkout@v4

      - name: Require external TraceCite MCP checkout token
        env:
          MCP_REPO_TOKEN: ${{ secrets.TRACECITE_MCP_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MCP_REPO_TOKEN:-}" || { echo 'TRACECITE_MCP_REPO_TOKEN missing' >&2; exit 2; }

      - name: Checkout TraceCite MCP
        uses: actions/checkout@v4
        with:
          repository: samstring/tracecite-mcp
          ref: ${{ inputs.mcp_ref }}
          path: tracecite-mcp
          token: ${{ secrets.TRACECITE_MCP_REPO_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Codex, Core, MCP, and dataset dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GMI_API_KEY:-}" || { echo 'GMI_API_KEY missing' >&2; exit 2; }
          test -n "${GMI2_API_KEY:-}" || { echo 'GMI2_API_KEY missing' >&2; exit 2; }
          test -n "${GMI_MODEL:-}" || { echo 'GMI_MODEL missing' >&2; exit 2; }
          test -n "${GMI2_MODEL:-}" || { echo 'GMI2_MODEL missing' >&2; exit 2; }
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -q ".[dev]" pandas pyarrow huggingface_hub
          python -m pip install -q -e "$GITHUB_WORKSPACE/tracecite-mcp[dev]"
          npm install -g @openai/codex@0.151.0
          codex --version

      - name: Verify Codex and standard-MCP benchmark plumbing
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_standard_mcp_benchmark.py
          (cd tracecite-mcp && python -m pytest -q tests/test_server.py tests/test_projection.py tests/test_stdio_integration.py)

      - name: Download official RCAEval traces and prepare byte-identical arms
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUN_ROOT" /tmp/rcaeval-hf
          mkdir -p "$RUN_ROOT/native-work" "$RUN_ROOT/tracecite-work" "$RUN_ROOT/result" /tmp/rcaeval-hf
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          import pandas as pd
          from huggingface_hub import snapshot_download

          case = os.environ['CASE_ID']
          root = Path('/tmp/rcaeval-hf')
          snapshot_download(
              repo_id='phamquiluan/RCAEval',
              repo_type='dataset',
              allow_patterns=[f'{case}/traces.parquet'],
              local_dir=root,
          )
          source = root / case / 'traces.parquet'
          if not source.is_file():
              raise SystemExit(f'missing official traces.parquet for {case}')
          frame = pd.read_parquet(source)
          native = Path(os.environ['RUN_ROOT']) / 'native-work' / 'traces.jsonl'
          frame.to_json(native, orient='records', lines=True, force_ascii=False)
          trace = Path(os.environ['RUN_ROOT']) / 'tracecite-work' / 'traces.jsonl'
          trace.write_bytes(native.read_bytes())
          data = native.read_bytes()
          if trace.read_bytes() != data:
              raise SystemExit('native and TraceCite evidence differ')
          meta = {
              'case_id': case,
              'rows': int(len(frame)),
              'bytes': len(data),
              'sha256': hashlib.sha256(data).hexdigest(),
          }
          (Path(os.environ['RUN_ROOT']) / 'result' / 'prepared.json').write_text(json.dumps(meta, indent=2) + '\n')
          print(json.dumps(meta, indent=2))
          PY
          rm -rf /tmp/rcaeval-hf

      - name: Configure isolated Codex homes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUN_ROOT/tracecite-work/.agents/skills/tracecite"
          cp "$GITHUB_WORKSPACE/tracecite-mcp/skills/tracecite/SKILL.md" "$RUN_ROOT/tracecite-work/.agents/skills/tracecite/SKILL.md"
          python benchmarks/agent-investigation/standard_mcp_benchmark.py configure-codex \
            --codex-home "$RUN_ROOT/codex-native-home" \
            --workspace "$RUN_ROOT/native-work" \
            --state-dir "$RUN_ROOT/native-unused-state" \
            --model "$GMI_MODEL" --provider gmi_native \
            --base-url "$GMI_BASE_URL" --env-key GMI_API_KEY --no-mcp
          python benchmarks/agent-investigation/standard_mcp_benchmark.py configure-codex \
            --codex-home "$RUN_ROOT/codex-tracecite-home" \
            --workspace "$RUN_ROOT/tracecite-work" \
            --state-dir "$RUN_ROOT/tracecite-state" \
            --model "$GMI2_MODEL" --provider gmi_tracecite \
            --base-url "$GMI_BASE_URL" --env-key GMI2_API_KEY

      - name: Write benchmark question and host instructions
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUN_ROOT/question.txt" <<'EOF'
          Using only the supplied traces.jsonl, investigate the incident. Identify the single most likely root-cause microservice and explain the concrete failure mechanism or root-cause indicator visible in the traces. Reconstruct enough causal/temporal evidence to distinguish root cause from downstream symptoms. Cite exact traces.jsonl:L<line> locations for material claims. Distinguish direct observation from inference. Do not use case-name/injection metadata or outside knowledge.
          EOF
          cat > "$RUN_ROOT/native-instructions.txt" <<'EOF'
          You are a real coding agent investigating one supplied runtime trace file. Use only the evidence in the current working directory. You own hypotheses, causal reasoning, investigation order, conclusions, evidence sufficiency, and when to stop. Do not use web access, benchmark metadata, case names, fault labels, injection metadata, or outside knowledge. Cite exact traces.jsonl:L<line> references actually observed. Distinguish direct observation from inference.
          EOF
          cat > "$RUN_ROOT/tracecite-instructions.txt" <<'EOF'
          You are a real coding agent investigating one supplied runtime trace file. EVERY operation that inspects, searches, reads, aggregates, expands, or otherwise derives runtime-evidence content MUST use the TraceCite MCP server. Do not use command execution, shell, or any native file-content access on traces.jsonl. If TraceCite cannot provide enough evidence, state that evidence is insufficient instead of bypassing TraceCite. You own hypotheses, causal reasoning, investigation order, conclusions, evidence sufficiency, and when to stop. Do not use web access, benchmark metadata, case names, fault labels, injection metadata, or outside knowledge. Cite exact traces.jsonl:L<line> references actually observed. Distinguish direct observation from inference. The TraceCite skill documents API semantics only; it does not decide root cause or stopping.
          EOF

      - name: Run paired Codex arms
        shell: bash
        run: |
          set -euo pipefail
          run_arm() {
            arm="$1"
            if [[ "$arm" == native ]]; then
              work="$RUN_ROOT/native-work"
              home="$RUN_ROOT/codex-native-home"
              model="$GMI_MODEL"
              provider="gmi_native"
              instructions="$RUN_ROOT/native-instructions.txt"
            else
              work="$RUN_ROOT/tracecite-work"
              home="$RUN_ROOT/codex-tracecite-home"
              model="$GMI2_MODEL"
              provider="gmi_tracecite"
              instructions="$RUN_ROOT/tracecite-instructions.txt"
            fi
            out="$RUN_ROOT/result/$arm"
            mkdir -p "$out"
            start="$(date +%s)"
            set +e
            timeout -k 30s 1200s env CODEX_HOME="$home" \
              python benchmarks/agent-investigation/codex_app_server_to_transcript.py \
                --workspace "$work" \
                --question-file "$RUN_ROOT/question.txt" \
                --output-dir "$out" \
                --mode "rcaeval-codex-$arm" \
                --model "$model" \
                --provider "$provider" \
                --developer-instructions-file "$instructions"
            code=$?
            set -e
            end="$(date +%s)"
            echo "$code" > "$out/exit.txt"
            echo "$((end-start))" > "$out/wall-seconds.txt"
            printf '%s\n' "$model" > "$out/model.txt"
          }
          printf '%s\n' "$ARM_ORDER" > "$RUN_ROOT/result/arm-order.txt"
          run_arm "${ARM_ORDER%% *}"
          sleep 5
          run_arm "${ARM_ORDER##* }"

      - name: Validate TraceCite-only evidence channel
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          transcript="$RUN_ROOT/result/tracecite/codex-transcript.jsonl"
          if [[ -f "$transcript" ]]; then
            python benchmarks/agent-investigation/standard_mcp_benchmark.py validate-transcript \
              --host codex --transcript "$transcript" \
              --output "$RUN_ROOT/result/tracecite-mcp-contract.json" || true
          fi

      - name: Score both arms and build comparison
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          root = Path(os.environ['RUN_ROOT'])
          prepared = json.loads((root / 'result' / 'prepared.json').read_text())
          expected = os.environ['EXPECTED_SERVICE']

          def load_json(path):
              if not path.is_file() or not path.read_text(errors='replace').strip():
                  return None
              return json.loads(path.read_text())

          def score(arm):
              out = root / 'result' / arm
              answer_path = out / 'codex-answer.md'
              transcript_path = out / 'codex-transcript.jsonl'
              answer = answer_path.read_text(errors='replace') if answer_path.is_file() else ''
              evidence = root / f'{arm}-work' / 'traces.jsonl'
              citations = [int(x) for x in re.findall(r'traces\.jsonl:L(\d+)', answer)]
              wanted = set(citations)
              cited = {}
              rows = 0
              if evidence.is_file():
                  with evidence.open(encoding='utf-8', errors='replace') as fh:
                      for rows, line in enumerate(fh, start=1):
                          if rows in wanted:
                              cited[rows] = line.rstrip('\n')
              valid = [n for n in citations if 1 <= n <= rows]
              supporting = [n for n in valid if expected.lower() in cited.get(n, '').lower()]
              tool_calls = 0
              tracecite_calls = 0
              command_calls = 0
              usage = {'input_tokens':0,'output_tokens':0,'cached_input_tokens':0,'reasoning_tokens':0}
              if transcript_path.is_file():
                  for raw in transcript_path.read_text(errors='replace').splitlines():
                      try: event = json.loads(raw)
                      except Exception: continue
                      if event.get('type') == 'tool':
                          tool_calls += 1
                          name = str(event.get('name') or '')
                          tracecite_calls += int(name.startswith('tracecite_'))
                          command_calls += int(name in {'command_execution','shell_command'})
                      elif event.get('type') == 'model':
                          u = event.get('usage') or {}
                          for key in usage:
                              value = u.get(key)
                              if isinstance(value, int): usage[key] += value
              exit_code = int((out / 'exit.txt').read_text().strip()) if (out / 'exit.txt').is_file() else None
              contract = load_json(root / 'result' / 'tracecite-mcp-contract.json') if arm == 'tracecite' else None
              result = {
                  'arm': arm,
                  'model': (out / 'model.txt').read_text().strip() if (out / 'model.txt').is_file() else None,
                  'exit_code': exit_code,
                  'wall_seconds': int((out / 'wall-seconds.txt').read_text().strip()) if (out / 'wall-seconds.txt').is_file() else None,
                  'expected_service': expected,
                  'service_correct': expected.lower() in answer.lower(),
                  'citations': citations,
                  'valid_citations': valid,
                  'supporting_service_citations': supporting,
                  'citation_grounded': bool(valid and supporting),
                  'tool_calls': tool_calls,
                  'tracecite_calls': tracecite_calls,
                  'native_command_calls': command_calls,
                  'token_usage': usage,
                  'tracecite_contract': contract,
              }
              result['boundary_valid'] = True if arm == 'native' else bool(contract and contract.get('contract_valid'))
              result['run_completed'] = exit_code == 0 and bool(answer.strip())
              return result

          native = score('native')
          tracecite = score('tracecite')
          comparison = {
              'schema_version': 1,
              'host': 'codex-cli-app-server',
              'transport': 'standard-mcp',
              'case_id': os.environ['CASE_ID'],
              'tier': '${{ matrix.tier }}',
              'core_commit': '${{ github.sha }}',
              'mcp_ref': '${{ inputs.mcp_ref }}',
              'arm_order': (root / 'result' / 'arm-order.txt').read_text().strip(),
              'evidence': prepared,
              'native': native,
              'tracecite': tracecite,
          }
          comparison['comparison_valid'] = native['run_completed'] and tracecite['run_completed'] and tracecite['boundary_valid']
          (root / 'result' / 'comparison.json').write_text(json.dumps(comparison, indent=2, sort_keys=True) + '\n')
          print(json.dumps(comparison, indent=2, sort_keys=True))
          PY

      - name: Upload Codex RCAEval case artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-rcaeval-${{ matrix.case_id }}
          path: ${{ env.RUN_ROOT }}/result
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    name: Aggregate Codex RCAEval comparison
    if: always()
    needs: case
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: codex-rcaeval-*
          path: /tmp/codex-rcaeval-results

      - name: Build aggregate summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/codex-rcaeval-results')
          rows = []
          for path in sorted(root.rglob('comparison.json')):
              try: rows.append(json.loads(path.read_text()))
              except Exception: pass
          summary = {
              'schema_version': 1,
              'suite': 'RCAEval RE3-TT four-case scale',
              'host': 'codex-cli-app-server',
              'comparisons': rows,
              'valid_comparisons': sum(bool(x.get('comparison_valid')) for x in rows),
          }
          Path('/tmp/codex-rcaeval-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: codex-rcaeval-four-scale-summary
          path: /tmp/codex-rcaeval-summary.json
          if-no-files-found: warn
          retention-days: 14
