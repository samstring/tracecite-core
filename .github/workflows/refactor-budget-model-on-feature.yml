name: Budget model migration

on:
  push:
    branches:
      - feature_for_agent

permissions:
  contents: write

jobs:
  migrate:
    if: "${{ github.event.head_commit.message == 'chore: run budget model migration' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply budget model migration
        run: |
          python scripts/refactor_budget_model_once.py
          python - <<'PY'
          from pathlib import Path

          # Finish test migration for the new terminal status.
          path = Path('tests/test_budget_cache.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    assert refused["status"] == "error"\n    assert refused["error"]["type"] == "BudgetExhausted"\n    assert called["run"] is False\n',
              '    assert refused["status"] == "budget_exhausted"\n    assert refused["should_stop"] is True\n    assert refused["error"]["type"] == "BudgetExhausted"\n    assert called["run"] is False\n',
          )
          path.write_text(text, encoding='utf-8')

          # BudgetPolicy v2 is a real persisted-schema migration. Keep the v1
          # golden readable and register a deterministic v1 -> v2 migrator.
          compat_path = Path('src/tracecite/runtime/schema_compat.py')
          compat = compat_path.read_text(encoding='utf-8')
          old = '''    SchemaSpec(\n        schema_id="tracecite.investigation_budget_policy",\n        classification="persisted_nested",\n        versioning="versioned",\n        current_version=1,\n        source_path="src/tracecite/runtime/investigation.py",\n        source_symbol="BUDGET_POLICY_SCHEMA_VERSION",\n        reader="budget_policy",\n        fixtures=(_fixture("budget-policy-v1.json", 1),),\n        notes="BudgetPolicy is nested in InvestigationState; the fixture covers its standalone reader.",\n    ),'''
          new = '''    SchemaSpec(\n        schema_id="tracecite.investigation_budget_policy",\n        classification="persisted_nested",\n        versioning="versioned",\n        current_version=2,\n        source_path="src/tracecite/runtime/investigation.py",\n        source_symbol="BUDGET_POLICY_SCHEMA_VERSION",\n        reader="budget_policy",\n        legacy_versions=(1,),\n        migration_handler="tracecite.runtime.schema_compat:_migrate_budget_policy",\n        fixtures=(\n            _fixture("budget-policy-v1.json", 1),\n            _fixture("budget-policy-v2.json", 2),\n        ),\n        notes="v2 exposes only max_rounds and max_input_per_round; v1 execution limits remain readable migration input.",\n    ),'''
          if old not in compat:
              raise RuntimeError('budget schema registry block not found')
          compat = compat.replace(old, new, 1)
          old_migrator = '''def _migrate_knowledge_governance(path: Path) -> Dict[str, Any]:\n    from tracecite.knowledge import KnowledgeGovernanceStore\n\n    return KnowledgeGovernanceStore(path).migrate()\n\n\nMIGRATORS: Dict[str, Callable[[Path], Mapping[str, Any]]] = {\n    "tracecite.knowledge_governance": _migrate_knowledge_governance,\n}'''
          new_migrator = '''def _migrate_budget_policy(path: Path) -> Dict[str, Any]:\n    from .investigation import BudgetPolicy\n\n    return BudgetPolicy.from_mapping(_load_json(path)).to_dict()\n\n\ndef _migrate_knowledge_governance(path: Path) -> Dict[str, Any]:\n    from tracecite.knowledge import KnowledgeGovernanceStore\n\n    return KnowledgeGovernanceStore(path).migrate()\n\n\nMIGRATORS: Dict[str, Callable[[Path], Mapping[str, Any]]] = {\n    "tracecite.investigation_budget_policy": _migrate_budget_policy,\n    "tracecite.knowledge_governance": _migrate_knowledge_governance,\n}'''
          if old_migrator not in compat:
              raise RuntimeError('migrator registry block not found')
          compat = compat.replace(old_migrator, new_migrator, 1)
          compat_path.write_text(compat, encoding='utf-8')

          Path('tests/fixtures/schema_compat/budget-policy-v2.json').write_text(
              '{\n  "schema_version": 2,\n  "max_rounds": 64,\n  "max_input_per_round": 128000\n}\n',
              encoding='utf-8',
          )
          PY
      - name: Run focused regressions
        run: |
          python -m pytest tests/test_budget_cache.py tests/test_schema_compat.py tests/test_runtime_schema_tools.py tests/test_session_novelty_regressions.py
          python scripts/check_architecture.py
      - name: Run full Core test suite
        run: python -m pytest -W error::DeprecationWarning
      - name: Commit validated migration
        run: |
          rm .github/workflows/refactor-budget-model-on-feature.yml
          rm scripts/refactor_budget_model_once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: unify user budgets around rounds and input size'
          git push origin HEAD:feature_for_agent
