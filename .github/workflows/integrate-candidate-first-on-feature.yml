name: Integrate candidate-first search

on:
  push:
    branches:
      - feature_for_agent

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message == 'chore: run candidate-first integration'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Apply candidate-first integration
        run: python scripts/integrate_candidate_first_once.py

      - name: Run focused regressions
        run: |
          python -m pytest tests/test_candidate_filter.py tests/test_candidate_search.py tests/test_runtime_search_engine.py tests/test_runtime_schema_tools.py tests/test_runtime_session_retrieval.py tests/test_session_novelty_regressions.py tests/test_pi_tracecite_bridge.py tests/test_pi_tracecite_runtime_neutral.py
          python scripts/check_architecture.py

      - name: Run full Core test suite
        run: python -m pytest -W error::DeprecationWarning

      - name: Commit validated integration
        run: |
          rm .github/workflows/integrate-candidate-first-on-feature.yml
          rm scripts/integrate_candidate_first_once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: enable candidate-first literal search fast path'
          git push origin HEAD:feature_for_agent
