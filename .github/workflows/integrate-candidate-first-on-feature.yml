name: Integrate candidate-first search on feature_for_agent

on:
  push:
    branches:
      - feature_for_agent

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message == 'chore: stage candidate-first main-path integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Wire candidate-first into runtime search
        run: |
          python - <<'PY'
          from pathlib import Path

          tools = Path('src/tracecite/runtime/tools.py')
          text = tools.read_text(encoding='utf-8')
          old_import = 'from tracecite_core.text_filter import FilterError, filter_text, text_time_range\n'
          new_import = 'from tracecite_core.text_filter import FilterError, text_time_range\n\nfrom .search_engine import search_text\n'
          if old_import not in text:
              raise SystemExit('expected tools.py text_filter import not found')
          text = text.replace(old_import, new_import, 1)

          old_call = '''        result = filter_text(\n            source,\n            pattern=pattern,\n            output_path=resolved_output,\n            snapshot=snapshot,\n            segmenter=build_segmenter(kind),\n            last=last,\n            since=since,\n            until=until,\n            template_threshold=10 if fold else 0,\n            max_line_chars=max_line_chars,\n        )\n'''
          new_call = '''        result = search_text(\n            source,\n            pattern=pattern,\n            regex=regex,\n            output_path=resolved_output,\n            snapshot=snapshot,\n            segmenter=build_segmenter(kind),\n            last=last,\n            since=since,\n            until=until,\n            fold=fold,\n            max_line_chars=max_line_chars,\n        )\n'''
          if old_call not in text:
              raise SystemExit('expected tools.search filter_text call not found')
          tools.write_text(text.replace(old_call, new_call, 1), encoding='utf-8')

          Path('src/tracecite/runtime/search_engine.py').write_text('''from __future__ import annotations\n\n"""Mechanical search dispatch for the canonical Runtime.\n\nThe fast path is deliberately conservative: exact literal searches over\nsingle-line segmenters use the parity-tested candidate-first filter. Any\nrequest outside that proven subset falls back to the legacy Core filter with\nunchanged semantics. Multiline local-record recovery remains internal until its\nartifact/result parity is proven at this boundary.\n"""\n\nfrom pathlib import Path\nfrom typing import Optional\n\nfrom tracecite_core.segmenter import Segmenter\nfrom tracecite_core.text_filter import FilterResult, filter_text\n\nfrom .candidate_filter import CandidateFilterUnsupported, filter_literal_single_line\n\n\ndef search_text(\n    source: Path,\n    *,\n    pattern: str,\n    regex: bool,\n    output_path: Path,\n    snapshot: bool,\n    segmenter: Segmenter,\n    last: Optional[str] = None,\n    since: Optional[str] = None,\n    until: Optional[str] = None,\n    fold: bool = False,\n    max_line_chars: Optional[int] = None,\n) -> FilterResult:\n    """Execute one search with a correctness-preserving candidate-first fast path."""\n\n    template_threshold = 10 if fold else 0\n    if not regex:\n        try:\n            return filter_literal_single_line(\n                source,\n                pattern=pattern,\n                output_path=output_path,\n                snapshot=snapshot,\n                segmenter=segmenter,\n                last=last,\n                since=since,\n                until=until,\n                template_threshold=template_threshold,\n                max_line_chars=max_line_chars,\n            )\n        except CandidateFilterUnsupported:\n            pass\n\n    return filter_text(\n        source,\n        pattern=pattern,\n        output_path=output_path,\n        snapshot=snapshot,\n        segmenter=segmenter,\n        last=last,\n        since=since,\n        until=until,\n        template_threshold=template_threshold,\n        max_line_chars=max_line_chars,\n    )\n\n\n__all__ = ["search_text"]\n''', encoding='utf-8')

          Path('tests/test_runtime_search_engine.py').write_text('''from __future__ import annotations\n\nimport re\nfrom pathlib import Path\n\nfrom tracecite.runtime import search_engine, tools\nfrom tracecite.runtime.candidate_filter import CandidateFilterUnsupported\nfrom tracecite_core.segmenter import RawTextSegmenter\n\n\ndef test_literal_search_uses_candidate_first_fast_path(tmp_path: Path, monkeypatch) -> None:\n    source = tmp_path / "plain.log"\n    source.write_text("alpha\\nneedle one\\nbeta\\nneedle two\\n", encoding="utf-8")\n    original = search_engine.filter_literal_single_line\n    calls = 0\n\n    def wrapped(*args, **kwargs):\n        nonlocal calls\n        calls += 1\n        return original(*args, **kwargs)\n\n    monkeypatch.setattr(search_engine, "filter_literal_single_line", wrapped)\n    result = search_engine.search_text(\n        source,\n        pattern=re.escape("needle"),\n        regex=False,\n        output_path=tmp_path / "fast" / "evidence.log",\n        snapshot=False,\n        segmenter=RawTextSegmenter(mode="line"),\n    )\n\n    assert calls == 1\n    assert result.match_records == 2\n\n\ndef test_regex_search_bypasses_candidate_first(tmp_path: Path, monkeypatch) -> None:\n    source = tmp_path / "plain.log"\n    source.write_text("alpha\\nneedle one\\nneedle two\\n", encoding="utf-8")\n\n    def unexpected(*args, **kwargs):\n        raise AssertionError("regex search must not enter literal fast path")\n\n    monkeypatch.setattr(search_engine, "filter_literal_single_line", unexpected)\n    result = search_engine.search_text(\n        source,\n        pattern=r"needle\\s+(?:one|two)",\n        regex=True,\n        output_path=tmp_path / "legacy" / "evidence.log",\n        snapshot=False,\n        segmenter=RawTextSegmenter(mode="line"),\n    )\n\n    assert result.match_records == 2\n\n\ndef test_unsupported_fast_path_falls_back_to_legacy(tmp_path: Path, monkeypatch) -> None:\n    source = tmp_path / "plain.log"\n    source.write_text("alpha\\nneedle\\nbeta\\n", encoding="utf-8")\n\n    def unsupported(*args, **kwargs):\n        raise CandidateFilterUnsupported("test fallback")\n\n    monkeypatch.setattr(search_engine, "filter_literal_single_line", unsupported)\n    result = search_engine.search_text(\n        source,\n        pattern=re.escape("needle"),\n        regex=False,\n        output_path=tmp_path / "fallback" / "evidence.log",\n        snapshot=False,\n        segmenter=RawTextSegmenter(mode="line"),\n    )\n\n    assert result.match_records == 1\n\n\ndef test_runtime_tools_search_routes_through_search_engine(tmp_path: Path, monkeypatch) -> None:\n    source = tmp_path / "plain.log"\n    source.write_text("alpha\\nneedle\\n", encoding="utf-8")\n    original = tools.search_text\n    calls = 0\n\n    def wrapped(*args, **kwargs):\n        nonlocal calls\n        calls += 1\n        return original(*args, **kwargs)\n\n    monkeypatch.setattr(tools, "search_text", wrapped)\n    result = tools.search(source, "needle", snapshot=False, cache=False)\n\n    assert calls == 1\n    assert result["status"] == "ok"\n    assert result["coverage"]["match_records"] == 1\n''', encoding='utf-8')

          en = Path('docs/architecture.md')
          en_text = en.read_text(encoding='utf-8')
          en_marker = '| Evidence Ledger + Context Engine / cross-turn delta | Implemented | `tracecite.integrations` |\n'
          en_row = '| Candidate-first literal search fast path | Implemented for the parity-proven single-line literal subset | Runtime search dispatch with deterministic legacy fallback; multiline local recovery remains internal |\n'
          if en_marker not in en_text:
              raise SystemExit('architecture.md status marker not found')
          if en_row not in en_text:
              en_text = en_text.replace(en_marker, en_row + en_marker, 1)
          en.write_text(en_text, encoding='utf-8')

          zh = Path('docs/architecture.zh-CN.md')
          zh_text = zh.read_text(encoding='utf-8')
          zh_marker = '| Evidence Ledger + Context Engine / cross-turn delta | 已实现 | `tracecite.integrations` |\n'
          zh_row = '| Candidate-first literal search fast path | 已在 parity 已证明的单行 literal 子集正式接入 | Runtime search dispatch + 确定性 legacy fallback；multiline local recovery 仍保持 internal |\n'
          if zh_marker not in zh_text:
              raise SystemExit('architecture.zh-CN.md status marker not found')
          if zh_row not in zh_text:
              zh_text = zh_text.replace(zh_marker, zh_row + zh_marker, 1)
          zh.write_text(zh_text, encoding='utf-8')
          PY

      - name: Run focused regression suite
        run: |
          python -m pytest \
            tests/test_candidate_filter.py \
            tests/test_candidate_search.py \
            tests/test_runtime_search_engine.py \
            tests/test_runtime_schema_tools.py \
            tests/test_runtime_session_retrieval.py \
            tests/test_session_novelty_regressions.py \
            tests/test_pi_tracecite_bridge.py \
            tests/test_pi_tracecite_runtime_neutral.py
          python scripts/check_architecture.py

      - name: Commit candidate-first integration
        run: |
          rm .github/workflows/integrate-candidate-first-on-feature.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/tracecite/runtime/tools.py src/tracecite/runtime/search_engine.py tests/test_runtime_search_engine.py docs/architecture.md docs/architecture.zh-CN.md .github/workflows/integrate-candidate-first-on-feature.yml
          git commit -m 'feat: enable candidate-first literal search fast path'
          git push origin HEAD:feature_for_agent
