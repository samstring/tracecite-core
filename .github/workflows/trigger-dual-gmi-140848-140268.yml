name: Trigger Dual GMI 140848 and 140268

on:
  push:
    branches:
      - experiment/evidence-intelligence
    paths:
      - .github/workflows/trigger-dual-gmi-140848-140268.yml

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical 140848 and 140268 A/B
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for case_key in 140848 140268; do
            curl --fail-with-body -sS \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pi-dual-gmi-parallel-ab.yml/dispatches" \
              -d "{\"ref\":\"experiment/evidence-intelligence\",\"inputs\":{\"case_key\":\"${case_key}\"}}"
          done
