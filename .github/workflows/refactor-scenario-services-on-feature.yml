name: Scenario services migration

on:
  push:
    branches:
      - feature_for_agent

permissions:
  contents: write

jobs:
  migrate:
    if: "${{ github.event.head_commit.message == 'chore: run scenario services migration' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Apply ScenarioServices migration
        run: python scripts/refactor_scenario_services_once.py

      - name: Run focused regressions
        run: |
          python -m pytest \
            tests/test_scenario_services_migration.py \
            tests/test_extension_contract.py \
            tests/test_extension_models.py \
            tests/test_extension_public_naming.py \
            tests/test_runtime_schema_tools.py \
            tests/test_stateful_cli.py \
            tests/test_runtime_cli.py \
            tests/test_scenario_cli_base_dir.py \
            tests/test_scenario_pattern.py \
            tests/test_preset_provenance.py
          python scripts/check_architecture.py

      - name: Run full Core test suite
        run: python -m pytest -W error::DeprecationWarning

      - name: Commit validated migration
        run: |
          rm .github/workflows/refactor-scenario-services-on-feature.yml
          rm scripts/refactor_scenario_services_once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: close ScenarioRuntime transition layer'
          git push origin HEAD:feature_for_agent
