[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracecite"
version = "0.1.0"
description = "Extensible evidence runtime for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "TraceCite Contributors" }]
keywords = ["text", "evidence", "filter", "agents", "log-analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1", "pytest>=7"]

[project.scripts]
tracecite = "tracecite.integrations.cli:main"
tracecite-core = "tracecite_core.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["tracecite*", "tracecite_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
